app = "beeline-server"
primary_region = "iad"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Nine helpers can reconnect together; keep one leader slot plus their
  # evidence writes without starving phone/auth requests.
  DATABASE_POOL_MAX = "10"
  MEDIA_MAX_BYTES = "26214400"
  PUBLIC_ORIGIN = "https://server.usebeeline.app"
  BEELINE_WEB_APP_ORIGINS = "https://lunchboxfortwo-buzzy--beeline-desktop-web-workbench-final.expo.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
