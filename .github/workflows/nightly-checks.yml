name: Nightly Checks
on:
  workflow_dispatch:
  schedule:
    # Separate triggers identify the harmless DST twin even when it is delayed.
    - cron: '7 7 * * *'
    - cron: '7 8 * * *'
permissions:
  contents: read
  actions: write
  checks: read
  issues: write
concurrency:
  group: nightly-checks
  cancel-in-progress: false
jobs:
  nightly:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dispatch every Checks suite on main
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/nightly-checks.mjs
      - name: Publish nightly result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-checks-result
          path: nightly-checks.json
          if-no-files-found: ignore
          retention-days: 30
