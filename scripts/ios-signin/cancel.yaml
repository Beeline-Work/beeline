appId: app.usebeeline.mobile
name: iOS consent cancellation stand-in
---
- launchApp
- extendedWaitUntil:
    visible:
      id: onboarding-${PROVIDER}-sign-in
    timeout: 30000
- tapOn:
    id: onboarding-${PROVIDER}-sign-in
- extendedWaitUntil:
    visible: '.*wants to use.*'
    timeout: 10000
- takeScreenshot: 01-consent-before-cancel
- tapOn: Cancel
- extendedWaitUntil:
    visible:
      id: onboarding-${PROVIDER}-sign-in
    timeout: 10000
- takeScreenshot: 02-onboarding-after-cancel
