# Phone OTA leg of the unified release, by channel pointer (Expo's branch
# promotion pattern). It publishes this release to its own EAS branch,
# `release-<version>`, with one update per runtime live in the stores, points
# the `beta` channel at it, and (promote=true) points `production` at the same
# branch, so production serves the exact bundles beta got.
#
# Nothing is handed between steps, jobs or runs through a file: every step
# asks EAS. A rerun publishes only the runtimes the branch still lacks and
# skips a channel that already points at the branch. The caller checks out
# the release SHA, installs Node 22 and the pinned eas-cli (EAS_CLI_PATH), and
# provides the Play/App Store read credentials in the job env.
name: Mobile OTA release leg
description: Publish this release's OTA branch for every live store runtime and move the channel pointers

inputs:
  release_sha:
    required: true
  release_version:
    required: true
  expo_token:
    description: EXPO_TOKEN secret (composite actions cannot read secrets themselves)
    required: true
  sentry_auth_token:
    description: Sentry release upload token; never exposed to the app
    required: false
    default: ''
  ota_memory:
    description: JSON from the initialize job — store build identities and the runtimes the previous release served
    required: false
    default: '{}'
  branch:
    description: EAS branch for this release; empty means release-<release_version>
    required: false
    default: ''
  beta_channel:
    required: false
    default: beta
  production_channel:
    required: false
    default: production
  promote:
    description: true moves the production channel to the branch after beta
    required: false
    default: 'true'

outputs:
  ota_branch:
    description: The EAS branch this release published
    value: ${{ steps.publish.outputs.branch }}
  ota_targets:
    description: Comma-separated platform@runtime targets on the branch
    value: ${{ steps.publish.outputs.targets }}
  store_runtime:
    description: Store runtime observations for the release record (JSON)
    value: ${{ steps.publish.outputs.store_runtime }}
  completed_at:
    description: Epoch seconds when production pointed at the branch
    value: ${{ steps.promote.outputs.completed_at }}

runs:
  using: composite
  steps:
    - name: Install mobile dependencies and build SDKs
      shell: bash
      working-directory: apps/mobile
      run: |
        echo "OTA_LEG_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
        bash ../../scripts/npm-ci-timed.sh
        npm run eas-build-post-install
    - name: Read the live store runtimes
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN_SECRET: ${{ inputs.expo_token }}
        OTA_MEMORY: ${{ inputs.ota_memory }}
      run: |
        set -euo pipefail
        if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
        mkdir -p "$RUNNER_TEMP/ota"
        memory="${OTA_MEMORY:-}"
        [ -n "$memory" ] || memory='{}'
        printf '%s' "$memory" > "$RUNNER_TEMP/ota/memory.json"
        node scripts/ota-release.mjs targets --memory "$RUNNER_TEMP/ota/memory.json" --output "$RUNNER_TEMP/ota/targets.json"
    - name: Publish every live runtime to the release branch and point beta at it
      id: publish
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN_SECRET: ${{ inputs.expo_token }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry_auth_token }}
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        BRANCH: ${{ inputs.branch || format('release-{0}', inputs.release_version) }}
        BETA_CHANNEL: ${{ inputs.beta_channel }}
      run: |
        set -euo pipefail
        if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
        test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN is unavailable" >&2; exit 2; }
        started="$(date +%s)"
        OTA_TMPDIR="$(mktemp -d)"
        TMPDIR="$OTA_TMPDIR" node scripts/ota-release.mjs publish \
          --sha "$RELEASE_SHA" --release-version "$RELEASE_VERSION" --branch "$BRANCH" \
          --channel "$BETA_CHANNEL" --targets "$RUNNER_TEMP/ota/targets.json" \
          --output "$RUNNER_TEMP/ota/published.json"
        node - "$RUNNER_TEMP/ota/published.json" >> "$GITHUB_OUTPUT" <<'NODE'
        const facts = require(process.argv[2]);
        console.log(`branch=${facts.branch}`);
        console.log(`targets=${facts.targets.map((t) => `${t.platform}@${t.runtimeVersion}`).join(',')}`);
        console.log(`store_runtime=${JSON.stringify({ previouslyLive: facts.storeRuntime?.previouslyLive ?? [] })}`);
        NODE
        echo "OTA branch publish: $(( $(date +%s) - started ))s" >> "$GITHUB_STEP_SUMMARY"
    - name: Point production at the exact branch beta got
      id: promote
      if: inputs.promote == 'true'
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN_SECRET: ${{ inputs.expo_token }}
        RELEASE_SHA: ${{ inputs.release_sha }}
        BRANCH: ${{ steps.publish.outputs.branch }}
        PRODUCTION_CHANNEL: ${{ inputs.production_channel }}
      run: |
        set -euo pipefail
        if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
        node scripts/ota-release.mjs promote --sha "$RELEASE_SHA" --branch "$BRANCH" \
          --channel "$PRODUCTION_CHANNEL" --targets "$RUNNER_TEMP/ota/targets.json" \
          --output "$RUNNER_TEMP/ota/promoted.json"
        echo "completed_at=$(date +%s)" >> "$GITHUB_OUTPUT"
        {
          echo "## Phone OTA"
          echo "- $PRODUCTION_CHANNEL -> $BRANCH"
          echo "- Targets: ${{ steps.publish.outputs.targets }}"
          echo "- OTA leg: $(( $(date +%s) - OTA_LEG_STARTED_AT ))s"
        } >> "$GITHUB_STEP_SUMMARY"
