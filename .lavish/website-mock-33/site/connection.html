<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beeline connect prompt</title><link rel="stylesheet" href="style.css"><style>body{padding:24px 18px;background:var(--slab)}.connect{margin:16px auto}.helper{font-size:9px}</style></head><body><div class="eyebrow">Try choosing your agent</div><form id="connect" class="connect"><div class="prompt"><input id="agent" aria-label="Add your agent" placeholder="Claude Code, Codex, ChatGPT…" list="agents" required><datalist id="agents"><option value="Claude Code"><option value="Codex"><option value="ChatGPT"><option value="Cursor"></datalist><button aria-label="Show connection instruction">↗</button></div><div id="instruction" class="instruction" role="status"></div></form><p class="helper">CHOOSE ONE AGENT. GET ITS NEXT STEP.</p><script src="mock.js"></script></body></html>
