# Mobile OTA release governor.
#
# A merge creates an immutable beta candidate. Production only receives the
# exact candidate bytes after the Android canary passes. Native/runtime-version
# compatibility remains unchanged: native changes still require a binary build
# and a runtimeVersion bump before any OTA can target those binaries.
name: Mobile OTA release governor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ota.yml'
      - 'apps/mobile/**'
      - 'packages/buzz-client/**'
      - 'packages/nostr/**'
  workflow_dispatch:
    inputs:
      operation:
        description: Release the checked-out commit or roll production back
        type: choice
        options:
          - release
          - rollback
        default: release
        required: true
      skip_canary:
        description: Captain-ordered emergency release without the Android canary
        type: boolean
        default: false
        required: true
      rollback_group:
        description: Optional known-good source group; defaults to the latest release ledger predecessor
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-ota-release-governor
  cancel-in-progress: false

jobs:
  release:
    name: Beta, canary, and exact-group promotion
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
      - name: Install mobile dependencies and build @beeline SDKs
        working-directory: apps/mobile
        run: |
          npm ci
          npm run eas-build-post-install
      - name: Validate candidate
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npx vitest run \
            sources/config/appBranding.test.ts \
            sources/config/mobileOtaRelease.test.ts
          node scripts/ota-release.mjs publish --dry-run \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --ledger "$RUNNER_TEMP/mobile-ota-ledger.json"
      - name: Publish immutable beta candidate
        id: candidate
        working-directory: apps/mobile
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EXPO_TOKEN_SECRET" ]; then
            export EXPO_TOKEN="$EXPO_TOKEN_SECRET"
          fi
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is unavailable to the release governor." >&2
            exit 1
          fi
          TMPDIR="$(mktemp -d)"
          export TMPDIR
          node scripts/ota-release.mjs publish \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --ledger "$RUNNER_TEMP/mobile-ota-ledger.json"
          node - "$RUNNER_TEMP/mobile-ota-ledger.json" >> "$GITHUB_OUTPUT" <<'NODE'
            const ledger = require(process.argv[2]);
            console.log(`group_id=${ledger.candidateGroupId}`);
            console.log(`android_update_id=${ledger.androidUpdateId}`);
          NODE
      - name: Run Android beta canary
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.skip_canary != true
        working-directory: apps/mobile
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EXPO_TOKEN_SECRET" ]; then
            export EXPO_TOKEN="$EXPO_TOKEN_SECRET"
          fi
          scripts/ota-canary.sh --ledger "$RUNNER_TEMP/mobile-ota-ledger.json"
          node scripts/ota-release.mjs mark-canary \
            --ledger "$RUNNER_TEMP/mobile-ota-ledger.json" \
            --status passed
      - name: Record captain-ordered canary skip
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_canary == true
        working-directory: apps/mobile
        run: |
          node scripts/ota-release.mjs mark-canary \
            --ledger "$RUNNER_TEMP/mobile-ota-ledger.json" \
            --status skipped
      - name: Promote the canary-proven bytes to production
        working-directory: apps/mobile
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EXPO_TOKEN_SECRET" ]; then
            export EXPO_TOKEN="$EXPO_TOKEN_SECRET"
          fi
          node scripts/ota-release.mjs promote \
            --ledger "$RUNNER_TEMP/mobile-ota-ledger.json"
      - name: Store release ledger
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ota-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-ota-ledger.json
          if-no-files-found: error
          retention-days: 90

  rollback:
    name: Republish last-known-good production group
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'rollback'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
      - name: Find latest successful release ledger
        if: inputs.rollback_group == ''
        id: ledger_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-ota.yml',
              status: 'success',
              per_page: 100,
            });
            for (const run of runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              if (artifacts.data.artifacts.some((artifact) =>
                artifact.name.startsWith('mobile-ota-ledger-') && !artifact.expired
              )) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.setFailed('No non-expired successful mobile OTA release ledger was found.');
      - name: Download last-known-good ledger
        if: inputs.rollback_group == ''
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-ota-ledger-*
          path: ${{ runner.temp }}/last-good
          merge-multiple: true
          run-id: ${{ steps.ledger_run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Resolve rollback source group
        id: rollback_source
        env:
          EXPLICIT_GROUP: ${{ inputs.rollback_group }}
        run: |
          set -euo pipefail
          group="$EXPLICIT_GROUP"
          if [ -z "$group" ]; then
            group="$(node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const root = process.argv[1];
              const file = fs.readdirSync(root, { recursive: true })
                .find((entry) => entry.endsWith("mobile-ota-ledger.json"));
              if (!file) throw new Error("downloaded artifact has no mobile-ota-ledger.json");
              const ledger = JSON.parse(fs.readFileSync(path.join(root, file), "utf8"));
              if (!ledger.previousProductionGroupId) {
                throw new Error("release ledger has no previousProductionGroupId");
              }
              process.stdout.write(ledger.previousProductionGroupId);
            ' "$RUNNER_TEMP/last-good")"
          fi
          echo "group_id=$group" >> "$GITHUB_OUTPUT"
      - name: Republish rollback group to production
        working-directory: apps/mobile
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
          ROLLBACK_GROUP: ${{ steps.rollback_source.outputs.group_id }}
        run: |
          set -euo pipefail
          if [ -n "$EXPO_TOKEN_SECRET" ]; then
            export EXPO_TOKEN="$EXPO_TOKEN_SECRET"
          fi
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is unavailable to the release governor." >&2
            exit 1
          fi
          node scripts/ota-release.mjs rollback \
            --group "$ROLLBACK_GROUP" \
            --ledger "$RUNNER_TEMP/mobile-ota-rollback.json"
      - name: Store rollback ledger
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ota-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-ota-rollback.json
          if-no-files-found: error
          retention-days: 90
