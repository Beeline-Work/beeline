# Builds the Tauri desktop shell (apps/mobile/src-tauri) for macOS, Linux and
# Windows and uploads every bundle as a downloadable artifact. Published
# releases also receive stable installer filenames used by usebeeline.app.
# The desktop app is the Expo web bundle in a native window, so each leg exports
# the web build first and then wraps it.
#
# Triggers:
#   pull_request  — only when a desktop-owning path changes (the crate, the
#                   configs, the icons, the mobile manifest, this file). A
#                   three-runner matrix is too expensive to attach to every
#                   mobile PR, and nothing in sources/ can break the shell
#                   without also failing MOBILE SUITE.
#   workflow_dispatch — pick the variant; this is how a tester gets a build of
#                   an arbitrary branch.
#   workflow_call   — the unified release builds production installers before
#                   it creates the GitHub release.
#
# The variant selects which config the CLI merges over tauri.conf.json:
# production is the release identity, preview installs beside it with console
# logging kept, dev is the local-identity build. Pull requests build preview —
# an artifact from a PR should never claim to be the release app.
#
# Production macOS builds are signed, notarized, stapled, and strictly verified
# when the complete repository credential set is available. Until it is, they
# build fully unsigned with a loud release notice. Preview/dev builds stay
# intentionally unsigned.
name: Desktop

on:
  pull_request:
    paths:
      - 'apps/mobile/src-tauri/**'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/scripts/generate-tauri-icons.mjs'
      - 'apps/mobile/sources/assets/images/icon.png'
      - 'packages/api-contract/package.json'
      - 'packages/buzz-client/package.json'
      - 'scripts/clean-dist.mjs'
      - 'scripts/clean-dist.test.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: Which configuration to build
        type: choice
        default: preview
        options:
          - dev
          - preview
          - production
  workflow_call:
    inputs:
      variant:
        description: Which configuration to build
        required: true
        type: string
      release_sha:
        description: Immutable release source SHA
        required: false
        type: string
      release_version:
        description: Immutable release version
        required: false
        type: string
    secrets:
      APPLE_CERTIFICATE:
        description: Base64-encoded Developer ID Application .p12
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: Password used when exporting the Developer ID Application .p12
        required: false
      EXPO_ASC_KEY_ID:
        description: App Store Connect API key id, shared with the native release
        required: false
      EXPO_ASC_ISSUER_ID:
        description: App Store Connect API issuer id, shared with the native release
        required: false
      EXPO_ASC_API_KEY_P8:
        description: Base64-encoded App Store Connect API private key, shared with the native release
        required: false

permissions:
  contents: read

# One build per ref. A newer push supersedes the whole matrix, never one
# platform of it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The Windows leg runs the same shell script as the others; the runner's
    # default there is pwsh, which does not speak any of it.
    shell: bash

jobs:
  # icons/ is generated from sources/assets/images/icon.png. Regenerating is
  # seconds of node, so prove the committed files still match the source
  # before spending three runners on a bundle that would ship a stale mark.
  icons:
    name: DESKTOP ICONS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the desktop icons match the app icon
        working-directory: apps/mobile
        run: npm run tauri:icons:check
      - name: Check desktop dependency builds use portable cleanup
        run: node --test scripts/clean-dist.test.mjs

  build:
    name: DESKTOP BUILD (${{ matrix.label }})
    needs: icons
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform's toolchain failing should not hide whether the other two
      # produce a bundle.
      fail-fast: false
      matrix:
        include:
          # A universal binary, so one download covers Apple silicon and Intel.
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04 rather than latest: the .deb and the AppImage inherit the
          # builder's glibc, and a newer one narrows who can install them.
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    env:
      # Pull requests carry no input and remain preview builds. The unified
      # release calls this workflow explicitly with production.
      VARIANT: ${{ inputs.variant || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The webview Tauri renders into is the system one: WebKitGTK here,
      # WKWebView on macOS, WebView2 on Windows. Only Linux needs it installed.
      - name: Install the Linux webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cargo.lock is committed, so the key names an exact dependency set: a
      # hit restores a build that resolved the same crates.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/mobile/src-tauri/target
          key: desktop-cargo-${{ matrix.label }}-${{ hashFiles('apps/mobile/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ matrix.label }}-

      - run: npm ci
      # Metro resolves @beeline/* from built dist, exactly as the phone build
      # does, so the web export needs those dists to exist first.
      - run: npm run build -w @beeline/nostr && npm run build -w @beeline/api-contract && npm run build -w @beeline/buzz-client
      # The mobile app is isolated from the root workspaces and carries its own
      # node_modules, including the Tauri CLI.
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      # The gate evaluates the complete credential set before Tauri sees any
      # of it. A missing or partially configured set therefore builds fully
      # unsigned and emits an unmistakable notice; a complete set makes every
      # signing, notarization, and verification step mandatory.
      - name: Select the macOS signing mode
        id: macos_signing
        env:
          MACOS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          MACOS_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          MACOS_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: node scripts/desktop-signing.mjs

      - name: Materialize the macOS signing credentials
        if: steps.macos_signing.outputs.enabled == 'true'
        env:
          MACOS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          MACOS_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          MACOS_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${MACOS_ASC_KEY_ID}.p8"
          printf '%s' "$MACOS_ASC_API_KEY_P8" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          write_env() {
            delimiter="BEELINE_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_ENV"
          }
          write_env APPLE_CERTIFICATE "$MACOS_APPLE_CERTIFICATE"
          write_env APPLE_CERTIFICATE_PASSWORD "$MACOS_APPLE_CERTIFICATE_PASSWORD"
          write_env APPLE_SIGNING_IDENTITY 'Developer ID Application: Moon Rice Limited (89KT3SWYAF)'
          write_env APPLE_API_KEY "$MACOS_ASC_KEY_ID"
          write_env APPLE_API_ISSUER "$MACOS_ASC_ISSUER_ID"
          write_env APPLE_API_KEY_PATH "$key_path"

      # `tauri build` runs the config's beforeBuildCommand (the Expo web
      # export) and then bundles it for this platform's installers.
      - name: Build the desktop bundle
        working-directory: apps/mobile
        env:
          # app.config.js stamps the build with the commit it came from; the
          # checkout's git metadata would otherwise name a merge commit.
          EXPO_PUBLIC_BEELINE_RELEASE_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          config=()
          case "$VARIANT" in
            production) ;;
            dev) config=(--config src-tauri/tauri.dev.conf.json) ;;
            preview) config=(--config src-tauri/tauri.preview.conf.json) ;;
            *) echo "::error::unknown variant '$VARIANT'"; exit 1 ;;
          esac
          npx tauri build --target "${{ matrix.target }}" ${config[@]+"${config[@]}"} \
            2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      # Pull requests cannot use release secrets. Exercise the exact codesign
      # verification path against an ad-hoc-signed copy without changing the
      # unsigned preview artifact that testers download.
      - name: Exercise codesign verification on an ad-hoc test copy
        if: runner.os == 'macOS' && steps.macos_signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          bundle="apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle"
          app=$(find "$bundle" -type d -name '*.app' -print -quit)
          test -n "$app" || { echo '::error::macOS build produced no .app'; exit 1; }
          set +e
          unsigned_assessment=$(spctl --assess --type execute --verbose "$app" 2>&1)
          unsigned_status=$?
          set -e
          printf 'Unsigned preview assessment (expected rejection):\n%s\n' "$unsigned_assessment"
          test "$unsigned_status" -ne 0 || {
            echo '::error::unsigned preview unexpectedly passed Gatekeeper assessment'; exit 1;
          }
          test_app="$RUNNER_TEMP/codesign-test/$(basename "$app")"
          mkdir -p "$(dirname "$test_app")"
          ditto "$app" "$test_app"
          codesign --force --deep --sign - "$test_app"
          codesign --verify --deep --strict --verbose=2 "$test_app"
          echo '::notice::ad-hoc codesign verification passed; this does not represent Developer ID or notarization'

      # Tauri signs, submits, and staples the inner .app. Submit and staple the
      # outer disk image too: that .dmg is the file users actually download and
      # the artifact `stapler validate` must accept.
      - name: Notarize and staple the macOS disk image
        if: steps.macos_signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.EXPO_ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          bundle="apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg=$(find "$bundle" -type f -name '*.dmg' -print -quit)
          test -n "$dmg" || { echo '::error::signed macOS build produced no .dmg'; exit 1; }

          result=$(xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json)
          printf '%s\n' "$result"
          printf '%s\n' "$result" > "$RUNNER_TEMP/dmg-notarization.json"
          status=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).status ?? "")' "$RUNNER_TEMP/dmg-notarization.json")
          log_id=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).id ?? "")' "$RUNNER_TEMP/dmg-notarization.json")
          test "$status" = Accepted || { echo "::error::DMG notarization ended with status '$status'"; exit 1; }
          test -n "$log_id" || { echo '::error::DMG notarization returned no log id'; exit 1; }
          echo "Notarization log id: $log_id"
          xcrun stapler staple -v "$dmg"

      - name: Verify the signed and notarized macOS download
        if: steps.macos_signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          bundle="apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle"
          app=$(find "$bundle" -type d -name '*.app' -print -quit)
          dmg=$(find "$bundle" -type f -name '*.dmg' -print -quit)
          test -n "$app" && test -n "$dmg"

          codesign --verify --deep --strict --verbose=2 "$app"
          set +e
          assessment=$(spctl --assess --type execute --verbose "$app" 2>&1)
          assessment_status=$?
          set -e
          printf '%s\n' "$assessment"
          test "$assessment_status" -eq 0 || exit "$assessment_status"
          printf '%s\n' "$assessment" | grep -qi accepted || {
            echo '::error::spctl did not report accepted'; exit 1;
          }
          xcrun stapler validate "$dmg"

      - name: Prove the bundled macOS app icon
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle="apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle"
          app=$(find "$bundle" -type d -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::the macOS bundle has no .app"
            exit 1
          fi
          icon=$(find "$app/Contents/Resources" -type f -name '*.icns' -print -quit)
          if [ -z "$icon" ]; then
            echo "::error::$app has no .icns icon"
            exit 1
          fi
          iconset="$RUNNER_TEMP/beeline-app-icon.iconset"
          iconutil --convert iconset "$icon" --output "$iconset"
          master="$iconset/icon_512x512@2x.png"
          {
            echo '### Bundled macOS app icon'
            echo
            echo '```'
            echo "$icon"
            sips --getProperty pixelWidth --getProperty pixelHeight --getProperty hasAlpha "$master"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A bundler that produced nothing still exits 0 in some failure modes;
      # the installer files are the evidence. The same listing tells whoever
      # opens the run which downloads it produced.
      - name: Prove the build produced installers
        run: |
          set -euo pipefail
          dir="apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$dir" ]; then
            echo "::error::no bundle directory at $dir"
            exit 1
          fi
          # The .app bundle is a directory, and it is the only artifact a
          # macOS `dev` build produces (that variant bundles no installer).
          found=$(
            {
              find "$dir" -type f \
                \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' \
                   -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \)
              find "$dir" -type d -name '*.app'
            } | sort
          )
          if [ -z "$found" ]; then
            echo "::error::$dir contains no installer or app bundle for ${{ matrix.label }}"
            find "$dir" -type f | head -n 50
            exit 1
          fi
          {
            echo "### ${{ matrix.label }} ($VARIANT)"
            echo
            echo '```'
            echo "$found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: beeline-desktop-${{ inputs.variant || 'preview' }}-${{ matrix.label }}
          # The whole bundle directory: a macOS run carries both the .dmg and
          # the .app archive, a Windows run both the .msi and the NSIS .exe.
          path: apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

      - name: Stage stable public installer names
        if: inputs.variant == 'production'
        run: |
          set -euo pipefail
          bundle="apps/mobile/src-tauri/target/${{ matrix.target }}/release/bundle"
          release="$RUNNER_TEMP/desktop-release"
          mkdir -p "$release"
          one() {
            count=$(find "$bundle" -type f -name "$1" | awk 'END { print NR }')
            [ "$count" -eq 1 ] || { echo "::error::expected one $1, found $count"; exit 1; }
            source=$(find "$bundle" -type f -name "$1" -print -quit)
            cp "$source" "$release/$2"
          }
          case "${{ matrix.label }}" in
            macos-universal) one '*.dmg' 'Beeline-universal.dmg' ;;
            windows-x86_64)
              one '*.exe' 'Beeline-x86_64-setup.exe'
              one '*.msi' 'Beeline-x86_64.msi'
              ;;
            linux-x86_64)
              one '*.AppImage' 'Beeline-x86_64.AppImage'
              one '*.deb' 'Beeline-x86_64.deb'
              one '*.rpm' 'Beeline-x86_64.rpm'
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: inputs.variant == 'production'
        with:
          name: beeline-desktop-release-${{ inputs.release_version }}-${{ inputs.release_sha }}-${{ matrix.label }}
          path: ${{ runner.temp }}/desktop-release/*
          if-no-files-found: error
          retention-days: 7
