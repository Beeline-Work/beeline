services:
  trusted-read-socket-init:
    image: alpine:3.21
    command: ["sh", "-c", "chown 1000:1000 /run/buzz-trusted && chmod 0755 /run/buzz-trusted"]
    network_mode: none
    volumes:
      - trusted-read-socket:/run/buzz-trusted
    restart: "no"

  trusted-read-relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    env_file:
      - .env
    environment:
      BUZZ_BIND_ADDR: 127.0.0.1:3000
      BUZZ_UDS_PATH: /run/buzz-trusted/relay.sock
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      BUZZ_HUDDLE_AUDIO_AVAILABLE: "false"
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "false"
    volumes:
      - trusted-read-socket:/run/buzz-trusted
      - buzz-git-data:/data/git
    depends_on:
      trusted-read-socket-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /_readiness HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - buzz-net

  trusted-read-front:
    image: nginx:1.27-alpine
    user: "1000:1000"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      trusted-read-relay:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BUZZ_TRUSTED_READ_PORT:-3410}:3000"
    volumes:
      - ${BUZZ_PUSH_INSTALL_DIR:?set BUZZ_PUSH_INSTALL_DIR}/current/apps/push-gateway/deploy/trusted-read.nginx.conf:/etc/nginx/nginx.conf:ro
      - trusted-read-socket:/run/buzz-trusted:ro
    restart: unless-stopped
    networks:
      - buzz-net

volumes:
  trusted-read-socket:
