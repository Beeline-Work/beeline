# Build and stamp an immutable release-<version> OTA branch, then move the
# requested channel. Next and latest each publish their own versioned bundles.
# Reruns reuse only updates already published on this release's own branch.
name: Mobile OTA release leg
description: Publish this release's OTA branch for every live store runtime and move the channel pointers

inputs:
  release_sha:
    required: true
  release_version:
    required: true
  expo_token:
    description: EXPO_TOKEN secret (composite actions cannot read secrets themselves)
    required: true
  sentry_auth_token:
    description: Sentry release upload token; never exposed to the app
    required: false
    default: ''
  ota_memory:
    description: Encoded public metadata from the initialize job — store build identities and the runtimes the previous release served
    required: false
    default: '{}'
  channel:
    required: false
    default: beta

outputs:
  ota_branch:
    description: The EAS branch this release published
    value: ${{ steps.facts.outputs.branch }}
  ota_targets:
    description: Comma-separated platform@runtime targets on the branch
    value: ${{ steps.facts.outputs.targets }}
  store_runtime:
    description: Store runtime observations for the release record (encoded public metadata)
    value: ${{ steps.facts.outputs.store_runtime }}
  completed_at:
    description: Epoch seconds when production pointed at the branch
    value: ${{ steps.facts.outputs.completed_at }}

runs:
  using: composite
  steps:
    - name: Install mobile dependencies and build SDKs
      shell: bash
      working-directory: apps/mobile
      run: |
        bash ../../scripts/npm-ci-timed.sh
        npm run eas-build-post-install
    - name: Read the live store runtimes
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN_SECRET: ${{ inputs.expo_token }}
        OTA_MEMORY: ${{ inputs.ota_memory }}
        BEELINE_RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
        mkdir -p "$RUNNER_TEMP/ota"
        memory="${OTA_MEMORY:-}"
        [ -n "$memory" ] || memory='{}'
        export OTA_MEMORY="$memory"
        node ../../scripts/release-job-output.mjs OTA_MEMORY "$RUNNER_TEMP/ota/memory.json"
        node scripts/ota-release.mjs targets --memory "$RUNNER_TEMP/ota/memory.json" --output "$RUNNER_TEMP/ota/targets.json"
    - name: Publish every live runtime and move the requested channel
      id: publish
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN_SECRET: ${{ inputs.expo_token }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry_auth_token }}
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        BRANCH: ${{ format('release-{0}', inputs.release_version) }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
        test -n "${EXPO_TOKEN:-}" || { echo "EXPO_TOKEN is unavailable" >&2; exit 2; }
        started="$(date +%s)"
        OTA_TMPDIR="$(mktemp -d)"
        TMPDIR="$OTA_TMPDIR" node scripts/ota-release.mjs publish \
          --sha "$RELEASE_SHA" --release-version "$RELEASE_VERSION" --branch "$BRANCH" \
          --channel "$CHANNEL" --targets "$RUNNER_TEMP/ota/targets.json" \
          --output "$RUNNER_TEMP/ota/published.json"
        echo "OTA branch publish: $(( $(date +%s) - started ))s" >> "$GITHUB_STEP_SUMMARY"
    - name: Report the delivered branch identity
      id: facts
      shell: bash
      working-directory: apps/mobile
      run: |
        node --input-type=module - "$RUNNER_TEMP/ota" >> "$GITHUB_OUTPUT" <<'NODE'
        import { readFileSync } from 'node:fs';
        import { encodeReleaseOutput } from '../../scripts/release-job-output.mjs';
        const facts = JSON.parse(readFileSync(`${process.argv[2]}/published.json`, 'utf8'));
        console.log(`branch=${facts.branch}`);
        console.log(`targets=${facts.targets.map(t => `${t.platform}@${t.runtimeVersion}`).join(',')}`);
        if (facts.storeRuntime) console.log(`store_runtime=${encodeReleaseOutput({ previouslyLive: facts.storeRuntime.previouslyLive ?? [] })}`);
        console.log(`completed_at=${Math.floor(Date.now() / 1000)}`);
        NODE
