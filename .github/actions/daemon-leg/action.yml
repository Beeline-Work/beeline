# Daemon leg of the unified release (was .github/workflows/beeline-bundle.yml).
# unified-release.yml calls it twice from the self-hosted production host:
# phase=build combines the install-verified Linux and macOS native bundles,
# phase=promote publishes it to Pages and smoke-tests the exact manifest. Fleet
# uptake is asynchronous observability and never holds a release open.
name: Beeline daemon release leg
description: Build the exact daemon artifact or publish it and await updater READY proof

inputs:
  phase:
    description: build | promote
    required: true
  release_sha:
    required: true
  release_version:
    required: true
  pages_manifest_url:
    default: https://beeline-work.github.io/beeline/dl/manifest.json
  darwin_arm64_bundle_dir:
    description: Downloaded native darwin-arm64 artifact directory
    default: ''
  darwin_x64_bundle_dir:
    description: Downloaded native darwin-x64 artifact directory
    default: ''

runs:
  using: composite
  steps:
    # ---- build -------------------------------------------------------------
    - name: Find a downloadable daemon artifact for this exact release SHA
      if: inputs.phase == 'build'
      id: reuse
      uses: actions/github-script@v7
      with:
        script: |
          const name = `daemon-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}`;
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
          });
          const artifact = artifacts
            .filter((candidate) => candidate.name === name && !candidate.expired && candidate.workflow_run?.id)
            .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
          if (artifact) {
            try {
              await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: artifact.id, archive_format: 'zip',
              });
              core.setOutput('run_id', String(artifact.workflow_run.id));
            } catch (error) {
              core.info(`Artifact ${artifact.id} is no longer downloadable: ${error.message}`);
            }
          }
    - name: Reuse the exact daemon artifact
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: daemon-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}
        path: ${{ runner.temp }}/daemon-release
        run-id: ${{ steps.reuse.outputs.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/setup-node@v4
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      with:
        node-version: '20.19'
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
    - if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: npm ci
    - name: Build and verify the exact daemon bundle
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: npm run bundle:beeline -- --platform linux-x64
      env:
        BEELINE_BUNDLE_COMMIT: ${{ inputs.release_sha }}
        BEELINE_BUNDLE_VERSION: ${{ inputs.release_version }}
    - name: Collect daemon artifact
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: |
        test -n "${{ inputs.darwin_arm64_bundle_dir }}"
        test -n "${{ inputs.darwin_x64_bundle_dir }}"
        node scripts/merge-beeline-bundles.mjs \
          --output-dir "$RUNNER_TEMP/daemon-release" \
          --input-dir relay-stack/web/dl \
          --input-dir "${{ inputs.darwin_arm64_bundle_dir }}" \
          --input-dir "${{ inputs.darwin_x64_bundle_dir }}"
    - if: inputs.phase == 'build'
      uses: actions/upload-artifact@v4
      with:
        name: daemon-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}
        path: ${{ runner.temp }}/daemon-release/
        if-no-files-found: error
        retention-days: 7

    # ---- promote -----------------------------------------------------------
    - if: inputs.phase == 'promote'
      uses: actions/download-artifact@v4
      with:
        name: daemon-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}
        path: bundle/all-platforms
    - name: Publish the daemon artifact to durable Pages hosting
      if: inputs.phase == 'promote'
      uses: ./.github/actions/pages-leg
      with:
        bundle_dir: bundle/all-platforms
        release_sha: ${{ inputs.release_sha }}
        release_version: ${{ inputs.release_version }}
        manifest_url: ${{ inputs.pages_manifest_url }}
    - name: Record asynchronous fleet uptake without blocking the release
      if: inputs.phase == 'promote'
      shell: bash
      continue-on-error: true
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        set -u
        {
          echo '## Helper fleet uptake (asynchronous)'
          echo
          if curl -fsS --max-time 10 \
            https://server.usebeeline.app/v1/releases/daemon-readiness \
            -o "$RUNNER_TEMP/release-readiness.json"; then
            echo '```json'
            cat "$RUNNER_TEMP/release-readiness.json"
            echo
            echo '```'
          else
            echo 'Readiness snapshot unavailable. Fleet convergence remains post-release observability.'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
