name: Checks
run-name: ${{ inputs.nightly_id && format('Nightly Checks {0}', inputs.nightly_id) || github.event.pull_request.title || github.workflow }}
on:
  pull_request: {}
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
      release_sha:
        description: Exact commit to validate and record for release
        type: string
        required: true
  workflow_dispatch:
    inputs:
      nightly_id:
        description: Correlation identity for an authorized nightly test run
        type: string
        default: ""
      suite:
        description: Gate to run on demand
        type: choice
        default: all
        options:
          - all
          - typecheck
          - shared-package-tests
          - dead-code
          - body-suite
          - server-suite
          - server-integration
          - mobile-suite
          - mobile-export-reachability
          - production-corpus-replay
          - native-fingerprint
          - app-link-associations
          - actionlint
          - auth-image
          - mirror-ci-images
          - coverage-map
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_TEST_WORKERS: "2"
  UV_THREADPOOL_SIZE: "1"
  TURBO_CONCURRENCY: "1"
  ZSTD_NBTHREADS: "1"
jobs:
  typecheck:
    name: TYPECHECK
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'typecheck')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    timeout-minutes: 30
    env:
      CI_TEST_WORKERS: "1"
      CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || inputs.release_sha || github.sha }}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      RUN_TYPECHECK: ${{ ((github.event_name == 'pull_request' || github.event_name == 'merge_group') || inputs.suite == 'all' || inputs.suite == 'typecheck') }}
      RUN_DEAD_CODE: "false"
      RUN_NATIVE_FINGERPRINT: "false"
      RUN_MOBILE_EXPORT: "false"
    outputs:
      typecheck: ${{ steps.checks.outputs['typecheck'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
      - name: Run sequential workspace checks
        id: checks
        run: node scripts/run-ci-workspace-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-check-timings
          path: ${{ runner.temp }}/workspace-check-timings.json
          if-no-files-found: ignore
  shared-package-tests:
    name: SHARED PACKAGE TESTS
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'shared-package-tests')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
      - name: Prove corner preparation and iOS capture runner setup
        run: node --test scripts/prepare-corner.test.mjs scripts/ios-signin/capture.test.mjs
      - name: Test feedback grouping and ranking
        run: npm run test:feedback-signals
      - name: Test nightly dispatch and main-failure reporting
        run: node --test scripts/nightly-checks.test.mjs scripts/report-main-checks.test.mjs
      - name: Test server coverage records and PR selection
        run: node --test --test-concurrency=1 scripts/server-test-selection.test.mjs scripts/coverage-map-artifact.test.mjs
      - name: Protect nightly latency history and measured Loops publication
        run: node --test --test-concurrency=1 scripts/latency-rig/nightly-*.test.mjs
      - name: Block unbounded outside requests and waiting-screen regressions
        run: |
          npm test --prefix apps/mobile -- --run sources/sync/transport/monolith-operation.test.ts --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1
      - name: Prove network codecs and command ownership
        working-directory: packages/net
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node ../../scripts/generate-network-codecs.mjs --check
          for suite in src/*.test.ts; do
            npx vitest run "$suite" --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1
          done
          cd ../..
      - name: Run hermetic shared-package tests
        run: npm test -w @beeline/nostr -- --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1 && npm test -w @beeline/api-contract -- --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1 && npm test -w @beeline/buzz-client -- --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1
      - name: Protect Room navigation responsiveness
        run: npm test --prefix apps/mobile -- --run --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1     'sources/app/(app)/beeline/chat/useRoomSurfaceSession.test.ts'
  dead-code:
    name: DEAD CODE
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'dead-code')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/(server|body|mobile)/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
        if: steps.changes.outputs.run == 'true'
      - name: Execute dead-code in its own checkout
        run: timeout 15m bash scripts/ci-workspace-tasks.sh dead-code
        if: steps.changes.outputs.run == 'true'
  body-suite:
    name: BODY SUITE
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'body-suite')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XDG_CONFIG_HOME: ""
      BUZZ_AGENT_BIN: /bin/false
      BUZZ_DEV_MCP_BIN: /bin/false
      BEELINE_READONLY_MCP_BIN: /bin/false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        if: steps.changes.outputs.run == 'true'
      - name: Select tests in this checkout
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FRAME_BUDGET: "true"
          CI_STATE_UPGRADE: "true"
        run: |-
          node scripts/workspace-test-selection.mjs body --out "$RUNNER_TEMP/workspace-selection.json"
          echo "WORKSPACE_TEST_SELECTION=$(cat "$RUNNER_TEMP/workspace-selection.json")" >> "$GITHUB_ENV"
        if: steps.changes.outputs.run == 'true'
      - run: sudo ln -sf "$(command -v node)" /usr/bin/node
        if: steps.changes.outputs.run == 'true'
      - run: |
          git config --global user.name "Body CI"
          git config --global user.email "body-ci@users.noreply.github.com"
        if: steps.changes.outputs.run == 'true'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
        if: steps.changes.outputs.run == 'true'
      - name: Run the hermetic Body suite
        run: node scripts/run-workspace-tests.mjs body
        if: steps.changes.outputs.run == 'true'
      - name: Prove free-agent boot refresh and startup deadlines
        run: node --test --test-concurrency=1 infra/free-agent/entrypoint.test.mjs
        if: steps.changes.outputs.run == 'true'
  server-suite-shard:
    name: SERVER SUITE SHARD ${{ matrix.shard }}
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'server-suite' || inputs.suite == 'server-integration')"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
          fetch-depth: 0
          filter: blob:none
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - name: Record coverage from the full release run
        if: steps.changes.outputs.run == 'true' && inputs.release_sha != ''
        run: echo "SERVER_COVERAGE_MAP_DIR=$RUNNER_TEMP/coverage-records" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ci-workspace
        id: workspace
        if: steps.changes.outputs.run == 'true'
      - name: Download the newest usable coverage map
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/server/scripts/coverage-map-artifact.mjs --out "$RUNNER_TEMP/map"
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
      - name: Select server tests in this shard
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request')
        continue-on-error: true
        run: |-
          node apps/server/scripts/test-selection.mjs select --map "$RUNNER_TEMP/map/server-coverage-map.json" --out "$RUNNER_TEMP/server-test-selection.json"
          echo "SERVER_TEST_SELECTION=$RUNNER_TEMP/server-test-selection.json" >> "$GITHUB_ENV"
      - name: Run the balanced server suite shard
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.suite != 'server-integration')
        working-directory: apps/server
        env:
          SERVER_HOSTED_TIMING: ${{ github.event_name == 'pull_request' }}
        run: node scripts/run-ci-shard.mjs ${{ matrix.shard }}/8
      - name: Run one bounded integration batch
        if: steps.changes.outputs.run == 'true' && (!cancelled() && steps.workspace.outcome == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.suite == 'all' || inputs.suite == 'server-integration'))
        working-directory: apps/server
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/run-integration-shard.mjs "$SHARD/8"
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.run == 'true' && (inputs.release_sha != '' && always())
        with:
          name: server-coverage-records-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-records
          retention-days: 3
          if-no-files-found: error
    permissions:
      contents: read
      actions: read
  coverage-map-check:
    name: SERVER COVERAGE MAP
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-workspace
      - name: Check the map used by PR selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node apps/server/scripts/coverage-map-artifact.mjs --out "$RUNNER_TEMP/map"
          if [ -f "$RUNNER_TEMP/map/server-coverage-map.json" ]; then
            node apps/server/scripts/test-selection.mjs check-map "$RUNNER_TEMP/map/server-coverage-map.json"
          else
            echo 'No usable map: server selection must run the full suite.'
          fi
  coverage-map:
    name: SERVER COVERAGE MAP (on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'coverage-map'
    uses: ./.github/workflows/server-coverage-map.yml
  server-claim-latency:
    name: SERVER CLAIM LATENCY
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'server-claim-latency')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: isolated-proof
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: true
        if: steps.changes.outputs.run == 'true'
      - name: Record PostgreSQL proof coverage from the full release run
        if: steps.changes.outputs.run == 'true' && inputs.release_sha != ''
        run: echo "SERVER_COVERAGE_MAP_DIR=$RUNNER_TEMP/coverage-records" >> "$GITHUB_ENV"
      - name: Prove incident deadlock recovery on isolated PostgreSQL
        run: npm test -w @beeline/server -- --run src/incident-deadlocks.test.ts --maxWorkers=1 --minWorkers=1
        env:
          BEELINE_INCIDENT_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        if: steps.changes.outputs.run == 'true'
      - name: Prove release migration lock handoff on isolated PostgreSQL
        run: npm test -w @beeline/server -- --run src/migration-steps.test.ts --maxWorkers=1 --minWorkers=1
        env:
          BEELINE_MIGRATION_LOCK_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        if: steps.changes.outputs.run == 'true'
      - name: Prove push outbox migration lock handoff on isolated PostgreSQL
        run: npm test -w @beeline/server -- --run src/push-outbox.test.ts --maxWorkers=1 --minWorkers=1
        env:
          BEELINE_PUSH_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        if: steps.changes.outputs.run == 'true'
      - name: Prove router command identity and authority fences on isolated PostgreSQL
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BEELINE_COMMAND_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          npx vitest run tests/seams/server-db.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/production-deadlocks.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/connection-presence.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/mcp-webhook-delivery.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/agent-schedule-deadline.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/background-work.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/background-retirement.test.ts --maxWorkers=2 --minWorkers=1
          BEELINE_SENTRY_TEST_POSTGRES_URL="$BEELINE_COMMAND_TEST_POSTGRES_URL" npm test -w @beeline/server -- src/sentry-wake.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/router-group-c-completion.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/router-group-c-oauth.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/router-command.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/read-surface-growth.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/slow-query-workload.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/rooms-mcp-stream.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/helper-overlay.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/turn-ownership-socket.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/rooms-mcp-stream.test.ts --maxWorkers=2 --minWorkers=1
          BEELINE_VOICE_TEST_POSTGRES_URL="$BEELINE_COMMAND_TEST_POSTGRES_URL" npm test -w @beeline/server -- src/voice-budget.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/helper-usage.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/helper-activation.postgres.test.ts --maxWorkers=2 --minWorkers=1
          npm test -w @beeline/server -- src/operator-system-dm-source.postgres.test.ts --maxWorkers=2 --minWorkers=1
        if: steps.changes.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && inputs.release_sha != ''
        with:
          name: server-coverage-records-postgres
          path: ${{ runner.temp }}/coverage-records
          retention-days: 3
          if-no-files-found: error
  mobile-suite:
    name: MOBILE SUITE
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'mobile-suite')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-workspace
    env:
      CI_TEST_WORKERS: "2"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
        if: steps.changes.outputs.run == 'true'
      - name: Select tests in this checkout
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FRAME_BUDGET: "true"
          CI_STATE_UPGRADE: "true"
        run: |-
          node scripts/workspace-test-selection.mjs mobile --out "$RUNNER_TEMP/workspace-selection.json"
          echo "WORKSPACE_TEST_SELECTION=$(cat "$RUNNER_TEMP/workspace-selection.json")" >> "$GITHUB_ENV"
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
        if: steps.changes.outputs.run == 'true'
      - name: Run the mobile suite in its own checkout
        run: timeout 20m bash scripts/ci-workspace-tasks.sh mobile-suite
        if: steps.changes.outputs.run == 'true'
  mobile-export-reachability:
    name: MOBILE-EXPORT REACHABILITY
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'mobile-export-reachability')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/mobile/|^packages/
        run: |-
          run=true
