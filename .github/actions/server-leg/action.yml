# Server leg of the unified release (was .github/workflows/deploy-host.yml).
# unified-release.yml calls it twice from the self-hosted production host:
# phase=build records the SHA-pinned monolith artifact, phase=promote migrates
# once and canaries the exact release SHA across the two Fly Machines. The caller checks out the
# release SHA before invoking it and owns runner, timeout, and concurrency.
name: Server release leg
description: Build the exact server artifact or deploy the monolith to Fly.io

inputs:
  phase:
    description: build | promote
    required: true
  release_sha:
    required: true
  release_version:
    required: true

runs:
  using: composite
  steps:
    # ---- build -------------------------------------------------------------
    - name: Find a downloadable server artifact for this exact release SHA
      if: inputs.phase == 'build'
      id: reuse
      uses: actions/github-script@v7
      with:
        script: |
          const name = `server-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}`;
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
          });
          const artifact = artifacts
            .filter((candidate) => candidate.name === name && !candidate.expired && candidate.workflow_run?.id)
            .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
          if (artifact) {
            try {
              await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: artifact.id, archive_format: 'zip',
              });
              core.setOutput('run_id', String(artifact.workflow_run.id));
            } catch (error) {
              core.info(`Artifact ${artifact.id} is no longer downloadable: ${error.message}`);
            }
          }
    - name: Reuse the exact server artifact
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: server-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}
        path: ${{ runner.temp }}/server-release
        run-id: ${{ steps.reuse.outputs.run_id }}
        github-token: ${{ github.token }}
    - name: Build the SHA-pinned monolith image without changing production
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: ./scripts/build-release-server-images.sh
      env:
        BEELINE_RELEASE_SHA: ${{ inputs.release_sha }}
        BEELINE_RELEASE_VERSION: ${{ inputs.release_version }}
    - name: Record the verified server artifact identity
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        mkdir -p "$RUNNER_TEMP/server-release"
        node - "$RUNNER_TEMP/server-release/identity.json" "$RELEASE_VERSION" "$RELEASE_SHA" <<'NODE'
        const fs = require('node:fs');
        fs.writeFileSync(process.argv[2], JSON.stringify({
          version: process.argv[3], sourceSha: process.argv[4], images: ['server'],
        }));
        NODE
    - if: inputs.phase == 'build'
      uses: actions/upload-artifact@v4
      with:
        name: server-artifact-${{ inputs.release_version }}-${{ inputs.release_sha }}
        path: ${{ runner.temp }}/server-release/identity.json
        if-no-files-found: error
        retention-days: 7

    # ---- promote -----------------------------------------------------------
    - name: Verify Fly.io deployment authority
      if: inputs.phase == 'promote'
      shell: bash
      run: flyctl auth whoami
    - name: Build the exact Fly image and capture the two-Machine rollback plan
      if: inputs.phase == 'promote'
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        mkdir -p "$RUNNER_TEMP/server-release"
        flyctl machine list --app beeline-server --json > "$RUNNER_TEMP/server-release/machines-before.json"
        image_label="${RELEASE_VERSION#v}-${RELEASE_SHA:0:12}"
        image_ref="registry.fly.io/beeline-server:$image_label"
        flyctl deploy . \
          --config fly.beeline-server.toml \
          --dockerfile apps/server/Dockerfile \
          --app beeline-server \
          --build-arg "BEELINE_RELEASE_VERSION=$RELEASE_VERSION" \
          --build-arg "BEELINE_RELEASE_SHA=$RELEASE_SHA" \
          --image-label "$image_label" --build-only --push --yes
        node scripts/unified-release.mjs server-deploy-plan \
          --machines "$RUNNER_TEMP/server-release/machines-before.json" \
          --image "$image_ref" --output "$RUNNER_TEMP/server-release/server-deploy-plan.json"
        node scripts/unified-release.mjs server-ledger \
          --plan "$RUNNER_TEMP/server-release/server-deploy-plan.json" \
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" \
          --output "$RUNNER_TEMP/server-release/server-image-ledger.json"
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}

    - name: Run schema migrations and backfills once before Machine updates
      if: inputs.phase == 'promote'
      shell: bash
      env:
        # `flyctl mpg status --json` does not expose the cluster's private address.
        SERVER_DB_DIRECT_IP: fdaa:67:2f3e:0:1::11
      run: |
        set -euo pipefail
        test -n "${MIGRATION_DATABASE_URL:-}" || { echo 'MIGRATION_DATABASE_URL is required' >&2; exit 1; }

        flyctl proxy "15432:5432" "$SERVER_DB_DIRECT_IP" -a beeline-server &
        proxy_pid=$!
        trap 'kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true' EXIT

        proxy_ready=false
        for _ in $(seq 1 30); do
          if (: > /dev/tcp/127.0.0.1/15432) 2>/dev/null; then
            proxy_ready=true
            break
          fi
          sleep 1
        done
        if [ "$proxy_ready" != true ]; then
          echo 'database proxy did not open within 30s' >&2
          exit 1
        fi

        node <<'NODE'
        const { Client } = require('pg');

        const client = new Client({ connectionString: process.env.MIGRATION_DATABASE_URL });
        (async () => {
          try {
            await client.connect();
            const result = await client.query(
              "SELECT current_database() AS database, to_regclass('public.messages') IS NOT NULL AS has_messages",
            );
            const { database, has_messages: hasMessages } = result.rows[0] ?? {};
            if (database !== 'fly-db' || hasMessages !== true) {
              console.error(`MIGRATION_DATABASE_URL does not point at the production database (${database ?? 'unknown'})`);
              process.exitCode = 1;
            }
          } catch (error) {
            console.error(`database target guard failed: ${error.message}`);
            process.exitCode = 1;
          } finally {
            await client.end().catch(() => {});
          }
        })();
        NODE

        npm run migrate -w @beeline/server

    - name: Canary one Machine, observe for five minutes, then update its peer
      if: inputs.phase == 'promote'
      shell: bash
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/server-release/server-deploy-plan.json"
        ledger="$RUNNER_TEMP/server-release/server-image-ledger.json"
        read_plan() { node -e 'const p=require(process.argv[1]);process.stdout.write(String(p[process.argv[2]]))' "$plan" "$1"; }
        canary="$(read_plan canaryMachineId)"
        second="$(read_plan secondMachineId)"
        image_ref="$(read_plan newImageRef)"
        previous_ref="$(read_plan previousImageRef)"
        canary_updated=0
        second_update_attempted=0
        fleet_updated=0

        # Retry a flyctl machine update up to 3 times on transient failure.
        retry_flyctl_update() {
          local machine="$1" image="$2" desc="$3"
          local attempt=0
          while [ "$attempt" -lt 3 ]; do
            if flyctl machine update "$machine" --app beeline-server --image "$image" --wait-timeout 300 --yes 2>&1; then
              return 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -lt 3 ]; then
              echo "retry_flyctl_update($desc): attempt $attempt failed, sleeping 10s" >&2
              sleep 10
            fi
          done
          echo "retry_flyctl_update($desc): all 3 attempts failed for machine $machine -> $image" >&2
          return 1
        }

        # Assert that both Fly Machines report the same image name.
        verify_machine_convergence() {
          local expected_image="$1"
          local max_wait="${2:-0}"
          local deadline=0
          if [ "$max_wait" -gt 0 ]; then
            deadline=$((SECONDS + max_wait))
          fi
          while true; do
            local machines_json="$RUNNER_TEMP/server-release/machines-verify.json"
            flyctl machine list --app beeline-server --json > "$machines_json"
            local images
            images="$(node -e '
              const machines = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              for (const m of machines) {
                const image = m.imageRef || m.config?.image || "unknown";
                process.stdout.write(m.id + "=" + image + "\n");
              }
            ' "$machines_json")"
            echo "Current machine images:"
            echo "$images"
            local divergent=false
            while IFS='=' read -r mid mimage; do
              if [ "$mimage" != "$expected_image" ]; then
                echo "Machine $mid: expected $expected_image, found $mimage" >&2
                divergent=true
              fi
            done <<< "$images"
            if [ "$divergent" != true ]; then
              echo "Fleet converged on $expected_image"
              return 0
            fi
            if [ "$deadline" -eq 0 ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo "FLEET SPLIT: machines are not all on the expected image $expected_image" >&2
              return 1
            fi
            local remaining=$((deadline - SECONDS))
            local sleep_for=$((remaining < 10 ? remaining : 10))
            echo "Machines not yet converged, retrying in ${sleep_for}s (up to ${remaining}s left)" >&2
            sleep "$sleep_for"
          done
        }

        rollback_canary() {
          status=$?
          if [ "$canary_updated" = 1 ] && [ "$fleet_updated" = 0 ]; then
            echo "Server promotion failed; restoring attempted Machines to $previous_ref" >&2
            retry_flyctl_update "$canary" "$previous_ref" "rollback-canary" || true
            if [ "$second_update_attempted" = 1 ]; then
              retry_flyctl_update "$second" "$previous_ref" "rollback-second" || true
            fi
            # Verify both machines actually converged on previous_ref; retry rollback if split.
            local rollback_attempt=0
            while [ "$rollback_attempt" -lt 3 ]; do
              if verify_machine_convergence "$previous_ref" 2>/dev/null; then
                echo "Rollback confirmed: all machines on $previous_ref"
                break
              fi
              rollback_attempt=$((rollback_attempt + 1))
              if [ "$rollback_attempt" -lt 3 ]; then
                echo "Rollback attempt $rollback_attempt did not converge; re-applying rollback" >&2
                retry_flyctl_update "$canary" "$previous_ref" "rollback-canary-reverify" || true
                if [ "$second_update_attempted" = 1 ]; then
                  retry_flyctl_update "$second" "$previous_ref" "rollback-second-reverify" || true
                fi
                sleep 15
              fi
            done
            # Final assertion: if still split, fail loudly.
            if ! verify_machine_convergence "$previous_ref"; then
              echo "CRITICAL: Rollback exhausted all retries but fleet remains split!" >&2
              echo "Manual reconciliation required: ensure both machines on $previous_ref" >&2
            fi
            node scripts/unified-release.mjs server-ledger --plan "$plan" \
              --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --ledger-state rolled-back --output "$ledger"
          fi
          exit "$status"
        }

        wait_for_machine_ready() {
          machine="$1"
          force_header="fly-force-instance-id: $machine"
          ready_response="$RUNNER_TEMP/server-release/ready-$machine.json"
          health_response="$RUNNER_TEMP/server-release/ready-health-$machine.json"
          version_response="$RUNNER_TEMP/server-release/ready-version-$machine.json"
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            remaining=$((deadline - SECONDS))
            curl_timeout=$((remaining < 10 ? remaining : 10))
            ready_status="$(curl -sS --max-time "$curl_timeout" -o "$ready_response" -w '%{http_code}' \
              -H "$force_header" https://server.usebeeline.app/readyz || true)"
            if [ "$ready_status" = 200 ]; then
              remaining=$((deadline - SECONDS))
              if [ "$remaining" -gt 0 ]; then
                curl_timeout=$((remaining < 10 ? remaining : 10))
                # Check version match
                if curl -fsS --max-time "$curl_timeout" -H "$force_header" \
                  https://server.usebeeline.app/version -o "$version_response" && \
                  node -e 'const v=require(process.argv[1]);process.exit(v.version === process.argv[2] ? 0 : 1)' \
                    "$version_response" "$RELEASE_VERSION"; then
                  # Also check /health returns ok:true (database pool ready)
                  if curl -fsS --max-time "$curl_timeout" -H "$force_header" \
                    https://server.usebeeline.app/health -o "$health_response" && \
                    node -e 'const h=require(process.argv[1]);process.exit(h.ok === true ? 0 : 1)' \
                      "$health_response"; then
                    return 0
                  fi
                fi
              fi
            fi
            remaining=$((deadline - SECONDS))
            [ "$remaining" -gt 0 ] || break
            sleep_for=$((remaining < 5 ? remaining : 5))
            sleep "$sleep_for"
          done
          echo "$machine did not become ready within 180s" >&2
          return 1
        }
        trap rollback_canary ERR

        canary_updated=1
        retry_flyctl_update "$canary" "$image_ref" "canary"
        wait_for_machine_ready "$canary"

        if [ -n "${SERVER_CANARY_REVIEW_SECRET:-}" ]; then
          echo "::add-mask::$SERVER_CANARY_REVIEW_SECRET"
          exchange_request="$RUNNER_TEMP/server-release/canary-token-request.json"
          exchange_response="$RUNNER_TEMP/server-release/canary-token-response.json"
          node - "$exchange_request" <<'NODE'
        const fs = require('node:fs');
        fs.writeFileSync(process.argv[2], JSON.stringify({ secret: process.env.SERVER_CANARY_REVIEW_SECRET }));
        NODE
          exchange_status='000'
          for exchange_attempt in 1 2 3; do
            if exchange_status="$(curl -sS --max-time 12 -o "$exchange_response" -w '%{http_code}' \
              -H "fly-force-instance-id: $canary" -H 'Content-Type: application/json' \
              --data-binary "@$exchange_request" \
              https://server.usebeeline.app/v1/auth/review/exchange)"; then
              case "$exchange_status" in
                5??) ;;
                *) break ;;
              esac
            fi
            if [ "$exchange_attempt" -lt 3 ]; then sleep 5; fi
          done
          rm -f "$exchange_request"
          if [ "$exchange_status" != 200 ]; then
            echo "Canary access-token exchange failed with HTTP $exchange_status" >&2
            exit 1
          fi
          mapfile -t canary_tokens < <(node - "$exchange_response" <<'NODE'
        const response = require(process.argv[2]);
        if (typeof response.accessToken !== 'string' || response.accessToken.length === 0 ||
            typeof response.refreshToken !== 'string' || response.refreshToken.length === 0) {
          throw new Error('Canary access-token exchange returned incomplete tokens');
        }
        process.stdout.write(`${response.accessToken}\n${response.refreshToken}\n`);
        NODE
          )
          canary_access_token="${canary_tokens[0]:-}"
          canary_refresh_token="${canary_tokens[1]:-}"
          test -n "$canary_access_token" -a -n "$canary_refresh_token" || {
            echo "Canary access-token exchange returned incomplete tokens" >&2
            exit 1
          }
          echo "::add-mask::$canary_access_token"
          echo "::add-mask::$canary_refresh_token"
          rm -f "$exchange_response"
        elif [ -n "${SERVER_CANARY_PHONE_TOKEN:-}" ]; then
          canary_access_token="$SERVER_CANARY_PHONE_TOKEN"
          echo "::add-mask::$canary_access_token"
          echo "SERVER_CANARY_REVIEW_SECRET is unset; using the legacy canary phone token" >&2
        else
          echo "Canary authentication requires SERVER_CANARY_REVIEW_SECRET or SERVER_CANARY_PHONE_TOKEN" >&2
          exit 1
        fi

        for sample in $(seq 0 20); do
          if [ "$sample" -gt 0 ]; then sleep 15; fi
          force_header="fly-force-instance-id: $canary"
          curl -fsS --max-time 12 -H "$force_header" https://server.usebeeline.app/health \
            -o "$RUNNER_TEMP/server-release/health.json"
          curl -fsS --max-time 12 -H "$force_header" https://server.usebeeline.app/version \
            -o "$RUNNER_TEMP/server-release/version.json"
          room_status="$(curl -sS --max-time 12 -o "$RUNNER_TEMP/server-release/room.json" -w '%{http_code}' \
            -H "$force_header" -H "Authorization: Bearer $canary_access_token" \
            "https://server.usebeeline.app/v1/phone/rooms/$SERVER_CANARY_ROOM_ID")"
          node scripts/unified-release.mjs server-canary-sample \
            --health "$RUNNER_TEMP/server-release/health.json" \
            --version "$RUNNER_TEMP/server-release/version.json" --room-status "$room_status" \
            --expected-version "$RELEASE_VERSION" --expected-sha "$RELEASE_SHA"
        done
        second_update_attempted=1
        retry_flyctl_update "$second" "$image_ref" "second"
        wait_for_machine_ready "$second"
        fleet_updated=1
        trap - ERR
        # Final assertion: prove both machines are on the target image.
        # Poll for up to 180s to let a mid-update machine finish converging.
        verify_machine_convergence "$image_ref" 180
        node scripts/unified-release.mjs server-ledger --plan "$plan" \
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --ledger-state deployed --output "$ledger"
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
