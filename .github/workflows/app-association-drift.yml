name: Live app-association drift

on:
  workflow_run:
    workflows: ['Unified production release']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-app-association-drift
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Compare live app associations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail on live Apple or Android association drift
        run: npm run check:app-association-drift
