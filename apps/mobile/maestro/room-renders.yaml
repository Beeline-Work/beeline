# Release proof: a repo-bound Room must render its transcript AND its composer.
#
# This is the flow that would have caught the 2026-09-14 blank-screen release:
# the app cold-started to an empty surface, so `chat-messages` never appeared.
# ROOM_ID is substituted by scripts/release-proof.mjs (or the RELEASE_PROOF_ROOM
# environment variable).
appId: app.usebeeline
name: room-renders
---
- launchApp:
    clearState: false
- assertVisible:
    id: room-list
- tapOn:
    id: room-${ROOM_ID}
- assertVisible:
    id: chat-messages
- assertVisible:
    id: chat-composer-input-row
