# The one production release button. It plans from the last successful release,
# runs only affected components, and carries every other immutable artifact into
# one new release record. A merge to main never releases. A normal selective
# release ceiling is 20 minutes from dispatch to the final result.
name: Unified production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Recovery only - pinned SHA from main
        type: string
        required: false
      release_version:
        description: Recovery only - existing vX.Y.Z identity
        type: string
        required: false
      retry_attempt:
        description: Recovery only - component-local attempt (1-3)
        type: string
        default: '1'
        required: true
      selection:
        description: Recovery only - routine releases keep auto
        type: string
        default: auto
        required: true
      store_track:
        description: Recovery only - routine releases keep none
        type: choice
        default: none
        options:
          - none
          - internal
          - beta
          - production
        required: true
      plan_only:
        description: Recovery only - print server canary and rollback ordering without touching production
        type: boolean
        default: false
        required: false

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: unified-production-release
  cancel-in-progress: true

jobs:
  initialize:
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 2
    outputs:
      release_sha: ${{ steps.plan.outputs.release_sha }}
      release_version: ${{ steps.plan.outputs.release_version }}
      release_id: ${{ steps.plan.outputs.release_id }}
      trigger_epoch: ${{ steps.clock.outputs.trigger_epoch }}
      run_server: ${{ steps.plan.outputs.run_server }}
      run_helper: ${{ steps.plan.outputs.run_helper }}
      run_mobile_ota: ${{ steps.plan.outputs.run_mobile_ota }}
      run_mobile_native: ${{ steps.plan.outputs.run_mobile_native }}
      run_desktop: ${{ steps.plan.outputs.run_desktop }}
      run_website: ${{ steps.plan.outputs.run_website }}
      stage_server: ${{ steps.plan.outputs.stage_server }}
      stage_helper: ${{ steps.plan.outputs.stage_helper }}
      stage_mobile_ota: ${{ steps.plan.outputs.stage_mobile_ota }}
      stage_mobile_native: ${{ steps.plan.outputs.stage_mobile_native }}
      native_android: ${{ steps.plan.outputs.native_android }}
      native_ios: ${{ steps.plan.outputs.native_ios }}
      runtime_pin_changed: ${{ steps.plan.outputs.runtime_pin_changed }}
      previous_runtime_version: ${{ steps.plan.outputs.previous_runtime_version }}
      next_runtime_version: ${{ steps.plan.outputs.next_runtime_version }}
      stage_desktop: ${{ steps.plan.outputs.stage_desktop }}
      stage_website: ${{ steps.plan.outputs.stage_website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record dispatch clock
        id: clock
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            core.setOutput('trigger_epoch', String(Math.floor(Date.parse(run.data.created_at) / 1000)));
      - name: Locate the last successful release index
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'unified-release-index', per_page: 100,
            });
            for (const artifact of artifacts
              .filter((candidate) => !candidate.expired && candidate.workflow_run?.id)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))) {
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              if (run.data.conclusion === 'success') {
                core.setOutput('run_id', String(run.data.id));
                break;
              }
            }
      - name: Download the last successful release index
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: unified-release-index
          path: ${{ runner.temp }}/previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Locate this identity's latest retry state
        if: inputs.release_sha != '' && inputs.release_version != ''
        id: retry_state
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ inputs.release_version }}-${{ inputs.release_sha }}
        with:
          script: |
            const name = `unified-release-state-${process.env.RELEASE_ID}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
            });
            const artifact = artifacts
              .filter((candidate) => candidate.name === name && !candidate.expired && candidate.workflow_run?.id)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (artifact) core.setOutput('run_id', String(artifact.workflow_run.id));
      - name: Download this identity's retry state
        if: steps.retry_state.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: unified-release-state-${{ inputs.release_version }}-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/retry
          run-id: ${{ steps.retry_state.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Assign identity and produce the inspectable release plan
        id: plan
        env:
          PLAN_ONLY: ${{ inputs.plan_only }}
          REQUESTED_SHA: ${{ inputs.release_sha || '' }}
          REQUESTED_VERSION: ${{ inputs.release_version || '' }}
          SELECTION: ${{ inputs.selection || 'auto' }}
          STORE_TRACK: ${{ inputs.store_track || 'none' }}
        run: |
          set -euo pipefail
          git fetch origin main
          previous="$RUNNER_TEMP/previous/release-attempt.json"
          [ -f "$previous" ] || previous="$RUNNER_TEMP/previous/unified-release.json"
          retry="$RUNNER_TEMP/retry/release-attempt.json"
          if [ "$PLAN_ONLY" = true ]; then
            # workflow_dispatch checks out the selected branch/ref. A dry run is
            # deliberately allowed to plan an unmerged commit and gets an
            # unmistakably synthetic release identity.
            release_sha=$(git rev-parse HEAD)
            release_version=v0.0.0
          else
            release_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
            test -n "$release_sha" || { echo 'missing release identity' >&2; exit 1; }
            git merge-base --is-ancestor "$release_sha" origin/main || {
              echo "release SHA is not a commit on main: $release_sha" >&2; exit 1;
            }
            if [ -n "$REQUESTED_VERSION" ]; then
              release_version="$REQUESTED_VERSION"
            elif [ -f "$previous" ]; then
              release_version=$(node scripts/unified-release.mjs release-version --previous "$previous" --sha "$release_sha")
            else
              release_version=v0.0.1
            fi
          fi
          release_id="${release_version}-${release_sha}"
          if [ -f "$previous" ]; then
            node scripts/unified-release.mjs component-paths \
              --previous "$previous" --sha "$release_sha" \
              --output "$RUNNER_TEMP/release-component-paths.json" \
              --paths-output "$RUNNER_TEMP/release-paths.txt"
          else
            git ls-tree -r --name-only "$release_sha" > "$RUNNER_TEMP/release-paths.txt"
            node - "$RUNNER_TEMP/release-paths.txt" "$RUNNER_TEMP/release-component-paths.json" <<'NODE'
          const fs = require('node:fs');
          const [pathsPath, outputPath] = process.argv.slice(2);
          const paths = fs.readFileSync(pathsPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const components = ['server', 'helper', 'mobile-ota', 'mobile-native', 'desktop', 'website'];
          fs.writeFileSync(outputPath, `${JSON.stringify(Object.fromEntries(components.map((component) => [component, paths])), null, 2)}\n`);
          NODE
          fi
          args=(plan --version "$release_version" --sha "$release_sha"
            --paths "$RUNNER_TEMP/release-paths.txt" --component-paths "$RUNNER_TEMP/release-component-paths.json"
            --selection "$SELECTION"
            --store-track "$STORE_TRACK" --state "$RUNNER_TEMP/unified-release.json"
            --summary "$RUNNER_TEMP/release-plan.json")
          if [ -f "$previous" ]; then args+=(--previous "$previous"); fi
          if [ -f "$retry" ]; then args+=(--retry "$retry"); fi
          node scripts/unified-release.mjs "${args[@]}"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/release-plan.json"
          {
            echo "release_sha=$release_sha"
            echo "release_version=$release_version"
            echo "release_id=$release_id"
            node -e 'const p=require(process.argv[1]).plan;console.log("runtime_pin_changed="+(p.runtimePinChanged??false)+"\nprevious_runtime_version="+JSON.stringify(p.previousRuntimeVersion??"")+"\nnext_runtime_version="+JSON.stringify(p.nextRuntimeVersion??""))' "$RUNNER_TEMP/unified-release.json"
            node -e 'const p=require(process.argv[1]).plan;for(const platform of ["android","ios"])console.log("native_"+platform+"="+(p.nativePlatforms??["android","ios"]).includes(platform))' "$RUNNER_TEMP/unified-release.json"
            for component in server helper mobile-ota mobile-native desktop website; do
              output="run_${component//-/_}"
              value=$(node -e 'const p=require(process.argv[1]);process.stdout.write(String(p.retry[process.argv[2]]))' "$RUNNER_TEMP/release-plan.json" "$component")
              echo "$output=$value"
              stage=$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.components[process.argv[2]].state)' "$RUNNER_TEMP/unified-release.json" "$component")
              echo "stage_${component//-/_}=$stage"
            done
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: unified-release-plan-${{ steps.plan.outputs.release_id }}
          path: |
            ${{ runner.temp }}/unified-release.json
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/release-paths.txt
            ${{ runner.temp }}/release-component-paths.json
          if-no-files-found: error
          retention-days: 90

  server_deploy_plan:
    needs: initialize
    if: inputs.plan_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - name: Dry-run canary success and rollback paths
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify([{id:"machine-a",config:{image:"registry.fly.io/beeline-server:previous"}},{id:"machine-b",config:{image:"registry.fly.io/beeline-server:previous"}}]))' "$RUNNER_TEMP/server-machines.json"
          node scripts/unified-release.mjs server-deploy-plan \
            --machines "$RUNNER_TEMP/server-machines.json" \
            --image "registry.fly.io/beeline-server:${{ needs.initialize.outputs.release_version }}-${{ needs.initialize.outputs.release_sha }}" \
            --simulate-failure true | tee -a "$GITHUB_STEP_SUMMARY"

  server:
    needs: initialize
    if: inputs.plan_only != true && needs.initialize.outputs.run_server == 'true'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 18
    concurrency:
      group: deploy-beeline-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_server)
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare the server migration CLI once
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_server)
        run: |
          npm ci
          npm run build -w @beeline/nostr
          npm run build -w @beeline/api-contract
          npm run build -w @beeline/buzz-client
          npm run build -w @beeline/body
          npm run build -w @beeline/auth
          npm run build -w @beeline/push-gateway
          npm run build -w @beeline/server
      - uses: ./.github/actions/server-leg
        if: needs.initialize.outputs.stage_server == 'pending'
        with:
          phase: build
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
      - name: Checkpoint the server build
        if: needs.initialize.outputs.stage_server == 'pending'
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-server-built.json",JSON.stringify({component:"server",version,sourceSha,state:"built",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "server-artifact-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        if: needs.initialize.outputs.stage_server == 'pending'
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-server-built
          path: checkpoint-server-built.json
          if-no-files-found: error
      - uses: ./.github/actions/server-leg
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_server)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SERVER_CANARY_REVIEW_SECRET: ${{ secrets.SERVER_CANARY_REVIEW_SECRET }}
          SERVER_CANARY_PHONE_TOKEN: ${{ secrets.SERVER_CANARY_PHONE_TOKEN }}
          SERVER_CANARY_ROOM_ID: ${{ secrets.SERVER_CANARY_ROOM_ID }}
        with:
          phase: promote
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
      - name: Preserve server image rollback ledger
        if: always() && contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_server)
        uses: actions/upload-artifact@v4
        with:
          name: server-image-ledger-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/server-release/server-image-ledger.json
          if-no-files-found: warn
          retention-days: 90
      - name: Checkpoint the server promotion
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_server)
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-server-promoted.json",JSON.stringify({component:"server",version,sourceSha,state:"promoted",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "server-artifact-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_server)
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-server-promoted
          path: checkpoint-server-promoted.json
          if-no-files-found: error
      - name: Bounded exact server smoke check
        run: node scripts/server-release-smoke.mjs
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          EXPECTED_RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          BEELINE_REVIEW_SECRET: ${{ secrets.BEELINE_REVIEW_SECRET }}
      - name: Write server checkpoint
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-server.json",JSON.stringify({component:"server",version,sourceSha,state:"checked",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "server-artifact-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-server
          path: checkpoint-server.json
          if-no-files-found: error

  helper:
    needs: initialize
    if: inputs.plan_only != true && needs.initialize.outputs.run_helper == 'true'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: usebeeline-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: ./.github/actions/daemon-leg
        if: needs.initialize.outputs.stage_helper == 'pending'
        with:
          phase: build
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
      - name: Checkpoint the helper build
        if: needs.initialize.outputs.stage_helper == 'pending'
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-helper-built.json",JSON.stringify({component:"helper",version,sourceSha,state:"built",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "daemon-artifact-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        if: needs.initialize.outputs.stage_helper == 'pending'
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-helper-built
          path: checkpoint-helper-built.json
          if-no-files-found: error
      - uses: ./.github/actions/daemon-leg
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_helper)
        with:
          phase: promote
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          pages_manifest_url: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
      - uses: actions/setup-node@v4
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_helper)
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the exact helper CLI package
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_helper)
        run: |
          set -euo pipefail
          npm install --global npm@^11.15.0
          npm ci
          npm run build -w @beeline/nostr
          npm run build -w @beeline/api-contract
          npm run build -w @beeline/buzz-client
          npm run build -w @beeline/gate
          npm run build -w @beeline/body
          npm run build -w usebeeline
          version="${{ needs.initialize.outputs.release_version }}"
          npm version "${version#v}" --allow-same-version --no-git-tag-version --workspace usebeeline
          npm view "usebeeline@${version#v}" version >/dev/null 2>&1 || npm publish --no-provenance --workspace usebeeline
      - name: Checkpoint helper promotion
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_helper)
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-helper-promoted.json",JSON.stringify({component:"helper",version,sourceSha,state:"promoted",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "daemon-artifact-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_helper)
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-helper-promoted
          path: checkpoint-helper-promoted.json
          if-no-files-found: error
      - name: Smoke the exact helper package and manifest
        env:
          MANIFEST_URL: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$MANIFEST_URL" -o "$RUNNER_TEMP/live-helper-manifest.json"
          node - "$RUNNER_TEMP/live-helper-manifest.json" "$RELEASE_VERSION" "$RELEASE_SHA" <<'NODE'
          const manifest = require(process.argv[2]);
          if (manifest.version !== process.argv[3] || manifest.sourceCommit !== process.argv[4]) process.exit(1);
          NODE
          node scripts/npm-package-visibility.mjs usebeeline "${RELEASE_VERSION#v}"
      - name: Write helper checkpoint
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-helper.json",JSON.stringify({component:"helper",version,sourceSha,state:"checked",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "daemon-artifact-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-helper
          path: checkpoint-helper.json
          if-no-files-found: error

  mobile_ota:
    needs: [initialize, mobile_native_android, mobile_native_ios]
    if: >-
      always() && inputs.plan_only != true && needs.initialize.result == 'success' &&
      needs.initialize.outputs.run_mobile_ota == 'true' &&
      (needs.initialize.outputs.runtime_pin_changed != 'true' ||
      needs.initialize.outputs.stage_mobile_native == 'checked' ||
      (needs.initialize.outputs.native_android != 'true' || needs.mobile_native_android.result == 'success') &&
      (needs.initialize.outputs.native_ios != 'true' || needs.mobile_native_ios.result == 'success'))
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/mobile-ota-leg
        if: needs.initialize.outputs.stage_mobile_ota == 'pending'
        with:
          phase: build
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          retry_attempt: ${{ inputs.retry_attempt }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
      - name: Checkpoint the OTA build
        if: needs.initialize.outputs.stage_mobile_ota == 'pending'
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-mobile-ota-built.json",JSON.stringify({component:"mobile-ota",version,sourceSha,state:"built",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "mobile-ota-candidate-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        if: needs.initialize.outputs.stage_mobile_ota == 'pending'
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-mobile-ota-built
          path: checkpoint-mobile-ota-built.json
          if-no-files-found: error
      - uses: ./.github/actions/mobile-ota-leg
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_mobile_ota)
        with:
          phase: promote
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          retry_attempt: ${{ inputs.retry_attempt }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          owner_pubkey: ${{ secrets.MOBILE_OTA_OWNER_PUBKEY }}
          receipt_token: ${{ secrets.MOBILE_OTA_RECEIPT_TOKEN }}
          receipt_origin: ${{ vars.MOBILE_OTA_RECEIPT_ORIGIN || 'https://usebeeline.app/push' }}
      - name: Checkpoint OTA promotion
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_mobile_ota)
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-mobile-ota-promoted.json",JSON.stringify({component:"mobile-ota",version,sourceSha,state:"promoted",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "mobile-ota-promoted-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        if: contains(fromJSON('["pending","built"]'), needs.initialize.outputs.stage_mobile_ota)
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-mobile-ota-promoted
          path: checkpoint-mobile-ota-promoted.json
          if-no-files-found: error
      - name: Locate promoted OTA evidence for a check-only retry
        if: needs.initialize.outputs.stage_mobile_ota == 'promoted'
        id: ota_promoted
        uses: actions/github-script@v7
        with:
          script: |
            const name = `mobile-ota-promoted-${{ needs.initialize.outputs.release_id }}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
            });
            const artifact = artifacts.filter((candidate) => candidate.name === name && !candidate.expired && candidate.workflow_run?.id)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (!artifact) core.setFailed(`missing immutable artifact ${name}`);
            else core.setOutput('run_id', String(artifact.workflow_run.id));
      - uses: actions/download-artifact@v4
        if: needs.initialize.outputs.stage_mobile_ota == 'promoted'
        with:
          name: mobile-ota-promoted-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/mobile-ota-resume
          run-id: ${{ steps.ota_promoted.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Require rollback evidence and write checkpoint
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/mobile-ota-ledger.json"
          [ -f "$ledger" ] || ledger="$RUNNER_TEMP/mobile-ota-resume/mobile-ota-ledger.json"
          test -f "$ledger" || {
            echo 'mobile OTA promotion produced no rollback ledger' >&2; exit 1;
          }
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-mobile-ota.json",JSON.stringify({component:"mobile-ota",version,sourceSha,state:"checked",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "mobile-ota-promoted-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-mobile-ota
          path: checkpoint-mobile-ota.json
          if-no-files-found: error

  desktop_installers:
    needs: initialize
    if: inputs.plan_only != true && needs.initialize.outputs.run_desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      variant: production
      release_sha: ${{ needs.initialize.outputs.release_sha }}
      release_version: ${{ needs.initialize.outputs.release_version }}
    secrets: inherit

  desktop_checkpoint:
    needs: [initialize, desktop_installers]
    if: inputs.plan_only != true && needs.initialize.outputs.run_desktop == 'true' && needs.desktop_installers.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write desktop checkpoint
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-desktop.json",JSON.stringify({component:"desktop",version,sourceSha,state:"checked",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "beeline-desktop-release-${{ needs.initialize.outputs.release_id }}-*"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-desktop
          path: checkpoint-desktop.json
          if-no-files-found: error

  website:
    needs: initialize
    if: inputs.plan_only != true && needs.initialize.outputs.run_website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: usebeeline-pages-${{ needs.initialize.outputs.run_helper == 'true' && github.run_id || 'deploy' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: ./.github/actions/pages-leg
        if: needs.initialize.outputs.run_helper != 'true'
        with:
          manifest_url: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
      - uses: ./.github/actions/web-app-leg
        with:
          expo_token: ${{ secrets.EXPO_TOKEN }}
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
      - uses: actions/upload-artifact@v4
        if: needs.initialize.outputs.run_helper != 'true'
        with:
          name: website-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/usebeeline-pages
          if-no-files-found: error
      - name: Write website checkpoint
        run: |
          node -e 'const fs=require("node:fs");const [version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync("checkpoint-website.json",JSON.stringify({component:"website",version,sourceSha,state:"checked",artifactRef})+"\n")' \
            "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "website-${{ needs.initialize.outputs.release_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-checkpoint-${{ needs.initialize.outputs.release_id }}-website
          path: checkpoint-website.json
          if-no-files-found: error

  mobile_native_android:
    needs: initialize
    if: inputs.plan_only != true && needs.initialize.outputs.native_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EAS_CLI_VERSION: 22.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Require native release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN is required for a native release' >&2; exit 1; }
      - name: Build immutable Android store binary
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npx --yes "eas-cli@$EAS_CLI_VERSION" build --profile production --platform android --non-interactive --wait --json > "$RUNNER_TEMP/android-build.json"
          node - "$RUNNER_TEMP/android-build.json" <<'NODE'
          const fs = require('node:fs');
          for (const path of process.argv.slice(2)) {
            const raw = JSON.parse(fs.readFileSync(path));
            const build = Array.isArray(raw) ? raw[0] : raw;
            if (build?.status !== 'FINISHED' || !build?.id) throw new Error(`${path} has no finished immutable build`);
          }
          NODE
      - name: Resolve the store-facing app version
        id: native_version
        working-directory: apps/mobile
        run: echo "version=$(node scripts/check-release-version.cjs)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Play
        if: inputs.store_track != 'none'
        id: play-auth
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-token.mjs
      - name: Upload Android to the selected Play track
        if: inputs.store_track != 'none'
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          TRACK: ${{ inputs.store_track }}
        run: |
          set -euo pipefail
          archive=$(jq -r 'if type=="array" then .[0] else . end | .artifacts.applicationArchiveUrl // .artifacts.buildUrl' "$RUNNER_TEMP/android-build.json")
          curl -fsSL "$archive" -o "$RUNNER_TEMP/beeline.aab"
          AAB_PATH="$RUNNER_TEMP/beeline.aab" RELEASE_NAME="${{ steps.native_version.outputs.version }}" RELEASE_STATUS=draft bash scripts/play-publish.sh
          METADATA_DIR=apps/mobile/fastlane/metadata/android LANGUAGE=en-US bash scripts/play-publish-listing.sh
      - name: Preserve Android build evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-native-android-build-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/android-build.json
          if-no-files-found: error
          retention-days: 1

  mobile_native_ios:
    needs: initialize
    if: inputs.plan_only != true && needs.initialize.outputs.native_ios == 'true'
    runs-on: [self-hosted, macOS, X64, ios-builder]
    timeout-minutes: 90
    env:
      EAS_CLI_VERSION: 22.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - name: Isolate the iOS signing keychain
        run: |
          set -euo pipefail
          security list-keychains -d user > "$RUNNER_TEMP/user-keychains.txt"
          security default-keychain -d user > "$RUNNER_TEMP/user-default-keychain.txt"
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db
      - name: Require iOS release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          export PATH=/usr/local/opt/node@20/bin:/usr/local/bin:$PATH
          for name in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_ASC_API_KEY_P8; do
            test -n "${!name}" || { echo "$name is required for an iOS store release" >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          printf '%s' "$EXPO_ASC_API_KEY_P8" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$EXPO_ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$EXPO_ASC_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=89KT3SWYAF"
            echo "EXPO_NO_CAPABILITY_SYNC=1"
            echo "EAS_SKIP_AUTO_FINGERPRINT=1"
            echo "EXPO_TOKEN=$EXPO_TOKEN"
          } >> "$GITHUB_ENV"
      - name: Build immutable iOS store binary locally
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          export PATH=/usr/local/opt/node@20/bin:/usr/local/bin:$PATH
          npm ci
          npx --yes "eas-cli@$EAS_CLI_VERSION" build --local --platform ios --profile production-ci --non-interactive --output "$RUNNER_TEMP/beeline-ios.ipa"
          test -s "$RUNNER_TEMP/beeline-ios.ipa" || { echo 'local EAS build did not produce a non-empty ipa' >&2; exit 1; }
          sha256=$(shasum -a 256 "$RUNNER_TEMP/beeline-ios.ipa" | awk '{print $1}')
          node - "$RUNNER_TEMP/ios-build.json" "$RUNNER_TEMP/beeline-ios.ipa" "$sha256" <<'NODE'
          const fs = require('node:fs');
          const [output, path, sha256] = process.argv.slice(2);
          fs.writeFileSync(output, JSON.stringify({source:'local',status:'FINISHED',id:`local-${sha256}`,artifacts:{path},sha256})+'\n');
          NODE
      - name: Submit iOS build to TestFlight for a selected store track
        if: inputs.store_track != 'none'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          export PATH=/usr/local/opt/node@20/bin:/usr/local/bin:$PATH
          npx --yes "eas-cli@$EAS_CLI_VERSION" submit --platform ios --profile production --path "$RUNNER_TEMP/beeline-ios.ipa" --non-interactive --wait
      - name: Preserve iOS build evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-native-ios-build-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/ios-build.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove iOS credentials and build output
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_${{ secrets.EXPO_ASC_KEY_ID }}.p8" "$RUNNER_TEMP/beeline-ios.ipa"
      - name: Restore the runner user keychains
        if: always()
        run: |
          xargs security list-keychains -d user -s < "$RUNNER_TEMP/user-keychains.txt"
          xargs security default-keychain -d user -s < "$RUNNER_TEMP/user-default-keychain.txt"

  release_result:
    if: always() && inputs.plan_only != true && needs.initialize.result == 'success'
    needs: [initialize, server, helper, mobile_ota, mobile_native_android, mobile_native_ios, desktop_installers, desktop_checkpoint, website]
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 2
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unified-release-plan-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-checkpoint-${{ needs.initialize.outputs.release_id }}-*
          path: ${{ runner.temp }}/checkpoints
          merge-multiple: true
      - name: Collect successful native build evidence
        if: >-
          needs.initialize.outputs.run_mobile_native == 'true' &&
          (needs.initialize.outputs.native_android != 'true' || needs.mobile_native_android.result == 'success') &&
          (needs.initialize.outputs.native_ios != 'true' || needs.mobile_native_ios.result == 'success')
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-native-*-build-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/native-evidence
          merge-multiple: true
      - name: Preserve native build evidence
        if: >-
          needs.initialize.outputs.run_mobile_native == 'true' &&
          (needs.initialize.outputs.native_android != 'true' || needs.mobile_native_android.result == 'success') &&
          (needs.initialize.outputs.native_ios != 'true' || needs.mobile_native_ios.result == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: mobile-native-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Write native checkpoint
        if: >-
          needs.initialize.outputs.run_mobile_native == 'true' &&
          (needs.initialize.outputs.native_android != 'true' || needs.mobile_native_android.result == 'success') &&
          (needs.initialize.outputs.native_ios != 'true' || needs.mobile_native_ios.result == 'success')
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoints"
          node -e 'const fs=require("node:fs");const [path,version,sourceSha,artifactRef]=process.argv.slice(1);fs.writeFileSync(path,JSON.stringify({component:"mobile-native",version,sourceSha,state:"checked",artifactRef})+"\n")' \
            "$RUNNER_TEMP/checkpoints/checkpoint-mobile-native.json" "${{ needs.initialize.outputs.release_version }}" "${{ needs.initialize.outputs.release_sha }}" "mobile-native-${{ needs.initialize.outputs.release_id }}"
      - name: Merge checkpoints and classify the final attempt
        id: result
        env:
          TRIGGER_EPOCH: ${{ needs.initialize.outputs.trigger_epoch }}
          SERVER_RESULT: ${{ needs.server.result }}
          HELPER_RESULT: ${{ needs.helper.result }}
          MOBILE_OTA_RESULT: ${{ needs.mobile_ota.result }}
          MOBILE_NATIVE_ANDROID_RESULT: ${{ needs.mobile_native_android.result }}
          MOBILE_NATIVE_IOS_RESULT: ${{ needs.mobile_native_ios.result }}
          DESKTOP_RESULT: ${{ needs.desktop_installers.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/release/unified-release.json"
          node - "$RUNNER_TEMP/checkpoints" "$RUNNER_TEMP/checkpoints.json" <<'NODE'
          const fs = require('node:fs');
          const [directory, output] = process.argv.slice(2);
          const checkpoints = fs.existsSync(directory)
            ? fs.readdirSync(directory).filter((name) => name.endsWith('.json')).map((name) => JSON.parse(fs.readFileSync(`${directory}/${name}`)))
            : [];
          fs.writeFileSync(output, JSON.stringify(checkpoints));
          NODE
          node scripts/unified-release.mjs apply-checkpoints --state "$state" --checkpoints "$RUNNER_TEMP/checkpoints.json" --summary "$RUNNER_TEMP/retry-plan.json"
          incomplete=$(node -e 'const p=require(process.argv[1]);process.stdout.write(Object.entries(p.retry).filter(([,v])=>v).map(([k])=>k).join(","))' "$RUNNER_TEMP/retry-plan.json")
          no_op=$(node -e 'const p=require(process.argv[1]);process.stdout.write(String(p.state === "delivered"))' "$state")
          now=$(date +%s)
          elapsed=$((now - TRIGGER_EPOCH))
          if [ "$elapsed" -ge 1200 ]; then
            failure_class=budget
          elif [ -n "$incomplete" ]; then
            failure_class="component:$incomplete"
          else
            failure_class=''
          fi
          if [ -n "$failure_class" ]; then
            node scripts/unified-release.mjs finalize --state "$state" --outcome failure --failure-class "$failure_class"
            {
              echo "outcome=failure"
              echo "failure_class=$failure_class"
              echo "incomplete=$incomplete"
              echo "no_op=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "outcome=success"
              echo "failure_class="
              echo "incomplete="
              echo "no_op=$no_op"
            } >> "$GITHUB_OUTPUT"
          fi
          cp "$state" "$RUNNER_TEMP/release-attempt.json"
      - name: Publish immutable attempt state for component-local retry
        if: steps.result.outputs.no_op != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unified-release-state-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/release-attempt.json
          retention-days: 90
      - name: Download newly built stable desktop installers
        if: steps.result.outputs.outcome == 'success' && needs.initialize.outputs.run_desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: beeline-desktop-release-${{ needs.initialize.outputs.release_version }}-${{ needs.initialize.outputs.release_sha }}-*
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Create the one GitHub release record and preserve stable desktop downloads
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          RUN_DESKTOP: ${{ needs.initialize.outputs.run_desktop }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/release-attempt.json"
          mkdir -p "$RUNNER_TEMP/desktop-release"
          if [ "$RUN_DESKTOP" != true ]; then
            previous_version=$(node -e 'process.stdout.write(require(process.argv[1]).components.desktop.version)' "$state")
            gh release download "$previous_version" --pattern 'Beeline-*' --dir "$RUNNER_TEMP/desktop-release"
          fi
          previous_sha=$(node -e 'process.stdout.write(require(process.argv[1]).supersedes?.sourceSha ?? "")' "$state")
          notes="$RUNNER_TEMP/release-notes.md"
          git log --pretty='- %s (%h)' "${previous_sha:+${previous_sha}..}${RELEASE_SHA}" > "$notes"
          [ -s "$notes" ] || echo '- No component changes required.' > "$notes"
          assets=("$RUNNER_TEMP"/desktop-release/Beeline-*)
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            [ -e "${assets[0]}" ] && gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          elif [ -e "${assets[0]}" ]; then
            gh release create "$RELEASE_VERSION" --target "$RELEASE_SHA" --title "$RELEASE_VERSION" --notes-file "$notes" "${assets[@]}"
          else
            gh release create "$RELEASE_VERSION" --target "$RELEASE_SHA" --title "$RELEASE_VERSION" --notes-file "$notes"
          fi
      - name: Notify clients without changing the authoritative release outcome
        id: notification
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          BEELINE_RELEASE_NOTIFY_SECRET: ${{ secrets.BEELINE_RELEASE_NOTIFY_SECRET }}
        run: >-
          node scripts/unified-release.mjs notify
          --version "$RELEASE_VERSION"
          --sha "$RELEASE_SHA"
          --repository "$GITHUB_REPOSITORY"
          --output "$RUNNER_TEMP/release-notification.json"
      - name: Finalize successful delivery after every selected promotion and record
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        run: node scripts/unified-release.mjs finalize --state "$RUNNER_TEMP/release-attempt.json" --outcome success
      - name: Publish the one successful release index
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unified-release-index
          path: ${{ runner.temp }}/release-attempt.json
          overwrite: true
          retention-days: 90
      - name: Measure rolling release attempt reliability
        id: reliability
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'unified-release.yml', event: 'workflow_dispatch', per_page: 20,
            });
            const completed = runs.data.workflow_runs.filter((run) => run.status === 'completed').slice(0, 20);
            const failed = completed.filter((run) => run.conclusion !== 'success').length;
            const rate = completed.length ? failed / completed.length : 0;
            core.setOutput('sample', String(completed.length));
            core.setOutput('failed', String(failed));
            core.setOutput('rate', (rate * 100).toFixed(1));
      - name: Surface release outcome, duration, and measured failure rate
        env:
          OUTCOME: ${{ steps.result.outputs.outcome }}
          NO_OP: ${{ steps.result.outputs.no_op }}
          FAILURE_CLASS: ${{ steps.result.outputs.failure_class }}
          SAMPLE: ${{ steps.reliability.outputs.sample }}
          FAILED: ${{ steps.reliability.outputs.failed }}
          RATE: ${{ steps.reliability.outputs.rate }}
          RUN_DESKTOP: ${{ needs.initialize.outputs.run_desktop }}
          MACOS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          MACOS_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          MACOS_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          NOTIFICATION_STATE: ${{ (steps.result.outputs.no_op == 'true' && 'not-needed') || steps.notification.outputs.state || (steps.notification.outcome == 'failure' && 'warning') || 'not-attempted' }}
          NOTIFICATION_DETAIL: ${{ (steps.result.outputs.no_op == 'true' && 'no component inputs changed') || steps.notification.outputs.detail || (steps.notification.outcome == 'failure' && 'notification step failed unexpectedly') || 'release result was not successful' }}
        run: |
          node - "$RUNNER_TEMP/release-attempt.json" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2]));
          console.log(`## Release ${release.delivery.state}: ${release.version}`);
          console.log(`- Duration: ${release.delivery.durationSeconds}s`);
          console.log(`- Selected: ${release.plan.selected.join(', ') || 'none'}`);
          console.log(`- Carried: ${release.plan.carried.join(', ') || 'none'}`);
          const signingSecrets = [
            'MACOS_APPLE_CERTIFICATE',
            'MACOS_APPLE_CERTIFICATE_PASSWORD',
            'MACOS_APPLE_SIGNING_IDENTITY',
            'MACOS_ASC_KEY_ID',
            'MACOS_ASC_ISSUER_ID',
            'MACOS_ASC_API_KEY_P8',
          ];
          if (process.env.RUN_DESKTOP === 'true' && signingSecrets.some((name) => !process.env[name]?.trim())) {
            console.log('- macOS artifact UNSIGNED: signing secrets absent');
          }
          if (process.env.NO_OP === 'true') console.log('- No-op: this exact release was already delivered; nothing was republished.');
          console.log(`- Notification: ${process.env.NOTIFICATION_STATE} (${process.env.NOTIFICATION_DETAIL})`);
          if (release.delivery.failureClass) console.log(`- Failure class: ${release.delivery.failureClass}`);
          console.log('- Reliability target: fewer than 10% failed attempts over the rolling 20 release attempts.');
          if (Number(process.env.SAMPLE) >= 10) console.log(`- Measured failure rate: ${process.env.RATE}% (${process.env.FAILED}/${process.env.SAMPLE}).`);
          else console.log(`- Measured failure rate: insufficient sample (${process.env.SAMPLE}/10 attempts); one release cannot prove the target.`);
          NODE
      - name: Fail the attempt after preserving its classified record
        if: steps.result.outputs.outcome != 'success'
        run: |
          echo "Release failed (${{ steps.result.outputs.failure_class }}): ${{ steps.result.outputs.incomplete }}" >&2
          exit 1

  retry:
    if: >-
      always() && inputs.plan_only != true && needs.release_result.result == 'failure' &&
      fromJSON(inputs.retry_attempt || '1') < 3
    needs: [initialize, release_result]
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 2
    steps:
      - name: Redispatch the same release identity; successful checkpoints stay complete
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          ATTEMPT: ${{ inputs.retry_attempt || '1' }}
          SELECTION: ${{ inputs.selection || 'auto' }}
          STORE_TRACK: ${{ inputs.store_track || 'none' }}
        with:
          script: |
            const attempt = Number(process.env.ATTEMPT);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'unified-release.yml', ref: 'main',
              inputs: {
                release_sha: process.env.RELEASE_SHA,
                release_version: process.env.RELEASE_VERSION,
                retry_attempt: String(attempt + 1),
                selection: process.env.SELECTION,
                store_track: process.env.STORE_TRACK,
              },
            });
