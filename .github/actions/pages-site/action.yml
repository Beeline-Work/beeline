name: Build usebeeline.app Pages artifact
description: Assemble repository static files with one verified daemon release

inputs:
  bundle_dir:
    description: Directory containing manifest.json and its verified bundles
    required: true
  output_dir:
    description: Scratch directory for the complete Pages site
    required: true

runs:
  using: composite
  steps:
    - name: Build the Pages-shaped site
      shell: bash
      run: node scripts/pages-site.mjs build --bundle-dir "$BUNDLE_DIR" --output-dir "$OUTPUT_DIR"
      env:
        BUNDLE_DIR: ${{ inputs.bundle_dir }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
    - name: Prove the Pages path and byte contract
      shell: bash
      run: node --test scripts/pages-site.test.mjs
    - name: Upload the complete Pages artifact, including .well-known
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.output_dir }}
        include-hidden-files: true
