app = "beeline-server"
primary_region = "iad"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATABASE_POOL_MAX = "5"
  MEDIA_MAX_BYTES = "26214400"
  PUBLIC_ORIGIN = "https://server.usebeeline.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Phase B configuration only. Provisioning and `fly deploy` are Phase C owner actions.
