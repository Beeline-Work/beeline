<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Join a Beeline Workspace</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          'IBM Plex Sans',
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        background: #090909;
        color: #e8e8e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(18px, 5vw, 40px);
        background:
          linear-gradient(rgba(232, 232, 232, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 232, 232, 0.025) 1px, transparent 1px), #090909;
        background-size: 32px 32px;
      }

      main {
        position: relative;
        width: min(100%, 560px);
        overflow: hidden;
        border: 1px solid #444444;
        border-radius: 4px;
        padding: clamp(26px, 7vw, 48px);
        background: #111111;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      }

      main::before,
      main::after {
        position: absolute;
        top: 12px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #606060;
        content: '';
      }

      main::before {
        left: 12px;
      }
      main::after {
        right: 12px;
      }

      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border: 1px solid #606060;
        border-radius: 4px;
        background: #1d1d1d;
        color: #d8d8d8;
        font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.08em;
      }

      .eyebrow {
        margin: 26px 0 10px;
        color: #929292;
        font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 13ch;
        margin: 0;
        font-size: clamp(30px, 7vw, 44px);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .details {
        max-width: 46ch;
        margin: 18px 0 0;
        color: #929292;
        font-size: 14px;
        line-height: 1.65;
      }

      .primary {
        min-height: 50px;
        margin-top: 30px;
        display: grid;
        place-items: center;
        border: 1px solid #dddddd;
        border-radius: 4px;
        padding: 0 18px;
        background: #dddddd;
        color: #111111;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        transition:
          background-color 160ms cubic-bezier(0.22, 1, 0.36, 1),
          color 160ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .primary:hover {
        background: #e8e8e8;
        transform: translateY(-1px);
      }

      .primary:active {
        background: #c6c6c6;
        transform: translateY(0);
      }

      .primary:focus-visible {
        outline: 2px solid #b8b8b8;
        outline-offset: 3px;
      }

      .status {
        min-height: 18px;
        margin: 12px 0 0;
        color: #787878;
        font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
        font-size: 10px;
        line-height: 1.6;
      }

      @media (prefers-reduced-motion: reduce) {
        .primary {
          transition: none;
        }
      }
    </style>
    <script src="/join/invite.js" defer></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">B</div>
      <p class="eyebrow">Signed Workspace invite</p>
      <h1 id="invite-heading">You're invited to a Workspace</h1>
      <p class="details">
        Open this invite in Beeline to preview the Workspace and join as a member. The invite
        remains bound to its signed relay record.
      </p>
      <a class="primary" id="join-workspace" href="#">Join Workspace</a>
      <p class="status" id="status" role="status" aria-live="polite">Resolving signed invite…</p>
    </main>
  </body>
</html>
