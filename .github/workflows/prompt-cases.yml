# PROMPT CASES checks the saved behavior cases in docs/prompts/cases/ on pull
# requests that change agent prompt text: the prompt sections, the Beeline
# skills, the tool descriptions, or the cases and their runner. It validates
# every case, builds each case's prompt with the real assembler and tool
# descriptions, and requires one case per prompt section. It never calls a
# model and needs no secret. An agent in the Room replays the cases with its
# own model (docs/prompts/cases/README.md).
#
# The job uses a job-level `if:` so an unrelated pull request reports it as
# skipped, never a workflow-level `paths` filter (that would leave the check
# missing).
name: Prompt cases

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prompt-cases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect prompt changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prompts: ${{ steps.filter.outputs.prompts }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            prompts:
              - 'apps/body/src/prompt-assembly.ts'
              - 'apps/body/src/beeline-skill.ts'
              - 'apps/body/src/minimal-tool-surface.ts'
              - 'apps/body/src/read-only-mcp.ts'
              - 'apps/body/src/silent-wake.ts'
              - 'apps/body/src/harness-capabilities.ts'
              - 'apps/body/src/transcript-budget.ts'
              - 'docs/prompts/cases/**'
              - 'scripts/prompt-cases.ts'
              - 'scripts/prompt-case-rules.ts'
              - 'scripts/prompt-case-rules.test.ts'
              - 'scripts/prompt-nightly.mjs'
              - 'scripts/prompt-nightly.test.mjs'
              - '.github/workflows/prompt-nightly.yml'
              - '.github/workflows/prompt-cases.yml'

  prompt-cases:
    name: PROMPT CASES
    needs: changes
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.prompts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the shared contract the assembler imports
        run: npx turbo run build --filter=@beeline/api-contract
      - name: Check the case library
        run: npm run test:prompt-cases
      - name: Check nightly replay controls without spending model tokens
        run: npm run test:prompt-nightly
