<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Beeline</title>
  </head>
  <body>
    <p id="status">Opening Beeline…</p>
    <script>
      (() => {
        const route = /^\/join\/[^/]+\/?$/.test(window.location.pathname)
          ? '/join/index.html'
          : /^\/review\/[^/]+\/?$/.test(window.location.pathname)
            ? '/review/index.html'
            : null;
        if (!route) {
          document.querySelector('#status').innerHTML = '<a href="/">Return to Beeline</a>';
          return;
        }
        fetch(route, { headers: { accept: 'text/html' } })
          .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          })
          .then((html) => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(() => {
            document.querySelector('#status').textContent =
              'Beeline could not open this link. Check your connection and try again.';
          });
      })();
    </script>
  </body>
</html>
