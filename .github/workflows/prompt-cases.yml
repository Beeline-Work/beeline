name: Prompt cases
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: prompt-cases-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prompt-cases:
    name: PROMPT CASES
    if: "!cancelled()"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/(body|server)/|^docs/prompts/|^scripts/(prompt|discovery)
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        if: steps.changes.outputs.run == 'true'
      - run: npm ci
        if: steps.changes.outputs.run == 'true'
      - name: Build contracts and local service harness
        run: npx turbo run build --filter=@beeline/body --filter=@beeline/server
        if: steps.changes.outputs.run == 'true'
      - name: Check the case library
        run: node --import tsx scripts/prompt-cases.ts
        if: steps.changes.outputs.run == 'true'
      - name: Check capability discovery controls and real local service paths
        run: npm run test:prompt-discovery
        if: steps.changes.outputs.run == 'true'
