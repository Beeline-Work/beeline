# Compiler outputs live only in Actions cache. A miss compiles the pinned
# upstream; every restored binary still goes through bundle install proof.
name: Restore the native agent binaries
description: Cache native binaries by upstream, platform, compiler and build flags
inputs:
  platform:
    description: linux-x64 | darwin-arm64 | darwin-x64
    required: true
outputs:
  source:
    description: actions | miss
    value: ${{ steps.export.outputs.source }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: node scripts/native-agent-cache.mjs "$PLATFORM"
    - id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.key.outputs.directory }}/buzz-agent
          ${{ steps.key.outputs.directory }}/buzz-dev-mcp
        key: ${{ steps.key.outputs.key }}
    - id: export
      shell: bash
      env:
        DIRECTORY: ${{ steps.key.outputs.directory }}
        ACTIONS_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        cache_source=miss
        if [ "$ACTIONS_HIT" = true ]; then cache_source=actions; fi
        echo "source=$cache_source" >> "$GITHUB_OUTPUT"
        echo "BEELINE_NATIVE_CACHE_SOURCE=$cache_source" >> "$GITHUB_ENV"
        echo "Native binary cache: $cache_source" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$cache_source" = actions ]; then
          echo "BUZZ_AGENT_BIN=$GITHUB_WORKSPACE/$DIRECTORY/buzz-agent" >> "$GITHUB_ENV"
          echo "BUZZ_DEV_MCP_BIN=$GITHUB_WORKSPACE/$DIRECTORY/buzz-dev-mcp" >> "$GITHUB_ENV"
        fi
