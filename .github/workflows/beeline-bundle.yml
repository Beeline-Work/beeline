name: Beeline daemon release leg

on:
  workflow_call:
    inputs:
      phase:
        description: Build the exact daemon artifact or publish it and await updater READY proof
        type: string
        required: true
      release_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: inputs.phase == 'build'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 15
    steps:
      - name: Find a downloadable daemon artifact for this exact release SHA
        id: reuse
        uses: actions/github-script@v7
        with:
          script: |
            const name = `daemon-artifact-${{ inputs.release_sha }}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
            });
            const artifact = artifacts
              .filter((candidate) => candidate.name === name && !candidate.expired && candidate.workflow_run?.id)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (artifact) {
              try {
                await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner, repo: context.repo.repo,
                  artifact_id: artifact.id, archive_format: 'zip',
                });
                core.setOutput('run_id', String(artifact.workflow_run.id));
              } catch (error) {
                core.info(`Artifact ${artifact.id} is no longer downloadable: ${error.message}`);
              }
            }
      - name: Reuse the exact daemon artifact
        if: steps.reuse.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: daemon-artifact-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/daemon-release
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: steps.reuse.outputs.run_id == ''
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.run_id == ''
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.run_id == ''
      - run: npm ci
        if: steps.reuse.outputs.run_id == ''
      - name: Build and verify the exact daemon bundle
        if: steps.reuse.outputs.run_id == ''
        run: npm run bundle:beeline -- --platform linux-x64
        env:
          BEELINE_BUNDLE_COMMIT: ${{ inputs.release_sha }}
          BEELINE_BUNDLE_VERSION: ${{ inputs.release_version }}
      - name: Collect daemon artifact
        if: steps.reuse.outputs.run_id == ''
        run: |
          mkdir -p "$RUNNER_TEMP/daemon-release"
          cp relay-stack/web/dl/beeline-linux-x64.tar.gz "$RUNNER_TEMP/daemon-release/"
          cp relay-stack/web/dl/beeline-linux-x64.tar.gz.sha256 "$RUNNER_TEMP/daemon-release/"
          cp relay-stack/web/dl/manifest.json "$RUNNER_TEMP/daemon-release/"
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-artifact-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/daemon-release/
          if-no-files-found: error
          retention-days: 7

  promote:
    if: inputs.phase == 'promote'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: daemon-artifact-${{ inputs.release_sha }}
          path: bundle/linux-x64
      - name: Publish daemon artifact through the boring updater
        run: node scripts/publish-beeline-dl.mjs --dir bundle --output-dir "$BEELINE_DL_ROOT" --keep 5
        env:
          GITHUB_SHA: ${{ inputs.release_sha }}
          BEELINE_DL_ROOT: /home/lunchbox/buzz-router-relay-prod/relay-front/web/dl
      - name: Confirm every daemon restarted READY on the exact release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 15 https://usebeeline.app/push/health -o "$RUNNER_TEMP/release-health.json" \
              && node - "$RUNNER_TEMP/release-health.json" "$RELEASE_VERSION" "$RELEASE_SHA" <<'NODE'
          const fs = require('node:fs');
          const [path, version, sha] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(path, 'utf8'));
          const daemons = Array.isArray(health.daemons) ? health.daemons : [];
          const aligned = daemons.length > 0 && daemons.every((daemon) =>
            daemon.state === 'ready' && daemon.releaseVersion === version && daemon.sourceSha === sha
          );
          process.exit(aligned ? 0 : 1);
          NODE
            then
              cat "$RUNNER_TEMP/release-health.json"
              exit 0
            fi
            sleep 5
          done
          echo "daemon fleet did not confirm $RELEASE_VERSION ($RELEASE_SHA) within 10 minutes" >&2
          cat "$RUNNER_TEMP/release-health.json" >&2 || true
          exit 1
