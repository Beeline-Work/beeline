name: Voice crash vitals (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install --quiet google-auth requests
      - name: Read last 48 hours of Android crash traces
        env:
          PLAY_CREDENTIAL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: python
        run: |
          import os, json, datetime, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          try:
            credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ.pop('PLAY_CREDENTIAL')),
              scopes=['https://www.googleapis.com/auth/playdeveloperreporting'])
            session = AuthorizedSession(credentials)
            end = datetime.datetime.now(datetime.timezone.utc).replace(minute=0, second=0, microsecond=0)
            start = end - datetime.timedelta(hours=48)
            params = {'filter': 'errorIssueType = CRASH', 'pageSize': 100}
            for side, date in [('startTime', start), ('endTime', end)]:
              for key, value in [('year', date.year), ('month', date.month), ('day', date.day), ('hours', date.hour)]:
                params[f'interval.{side}.{key}'] = value
            count = 0
            while True:
              result = session.get('https://playdeveloperreporting.googleapis.com/v1beta1/apps/app.usebeeline/errorReports:search', params=params, timeout=30)
              if result.status_code != 200:
                error = result.json().get('error', {})
                reasons = [detail.get('reason') for detail in error.get('details', []) if detail.get('reason')]
                print(json.dumps({'status': result.status_code, 'error': error.get('status'), 'reasons': reasons}))
                for detail in error.get('details', []):
                  activation = detail.get('metadata', {}).get('activationUrl')
                  if activation: print('API_ENABLE_URL=' + activation)
                sys.exit(1)
              data = result.json()
              for report in data.get('errorReports', []):
                count += 1
                print(json.dumps({key: report.get(key) for key in ['reportText', 'deviceModel', 'osVersion', 'appVersion', 'eventTime']}))
              if not data.get('nextPageToken'): break
              params['pageToken'] = data['nextPageToken']
            if not count: print('No crash reports in the last 48 hours.')
          except Exception as error:
            print('Vitals query failed: ' + type(error).__name__)
            sys.exit(1)
