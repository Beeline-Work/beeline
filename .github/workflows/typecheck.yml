name: Typecheck

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  typecheck:
    # Runs on every PR (no path filter): a type error can be introduced by two
    # independently green PRs merging cleanly (see #850 + #851), so the gate
    # must observe the whole workspace graph, not only the touched files.
    name: TYPECHECK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # turbo's typecheck task depends on ^build, so every workspace's
      # dist/ is produced before its dependents are checked.
      - run: npx turbo run typecheck
