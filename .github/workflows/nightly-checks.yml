# Reports every completed main-push Checks failure immediately; also runs
# every Checks suite at 03:00 Eastern, reruns failed nightly jobs once and
# classifies each job as failed (twice), flaky (passed on the rerun) or passing.
# The result is an artifact and one open `nightly-checks` issue per failed or
# flaky job (closed when the job next passes first time), which the daily fix
# loop reads with the release-failure issues.
name: Nightly Checks
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Separate triggers identify the harmless DST twin even when it is delayed.
    - cron: '7 7 * * *'
    - cron: '7 8 * * *'
permissions:
  contents: read
  actions: write
  checks: read
  issues: write
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('main-checks-report-{0}', github.event.workflow_run.id) || 'nightly-checks' }}
  cancel-in-progress: false
jobs:
  nightly:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report every main merge failure without hiding it behind a rerun
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/report-main-checks.mjs
      - name: Dispatch every Checks suite on main
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/nightly-checks.mjs
      - name: Publish nightly result
        if: always() && github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-checks-result
          path: nightly-checks.json
          if-no-files-found: ignore
          retention-days: 30
