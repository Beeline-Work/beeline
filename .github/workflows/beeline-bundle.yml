# Beeline CLI bundle publishing ("latest from main" channel).
#
# Every push to main builds the CLI bundle natively for each supported platform
# (so scripts/verify-beeline-install.mjs really runs per platform) and publishes
# the bundle set to its existing home: relay-stack/web/dl/, served statically at
# https://usebeeline.app/dl/ — exactly where apps/body/src/self-update-manifest.ts
# reads it (DEFAULT_UPDATE_MANIFEST_URL). Tagged releases (`v0.2.x`) and the
# from-source installer are untouched.
#
# ---------------------------------------------------------------------------
# Manifest contract (consumed by apps/body/src/self-update-manifest.ts):
#
#   schemaVersion : 1
#   sourceCommit  : full SHA of the main commit built into these bundles
#                   (primary update-comparison identity)
#   version       : comparable version (`0.0.<run_number>`; GitHub's monotonic
#                   per-workflow counter — a larger number is always newer)
#   bundles[<platform>] : { file, sha256, bytes, node, commit, version,
#                           verified } where verified is true only when that
#                   platform's install probe ran on a native runner.
#
# Publish safety: filenames stay stable (beeline-<platform>.tar.gz); the whole
# set lands as ONE git commit so consumers can never see a manifest pointing at
# a missing tarball; same-commit re-runs no-op; the publisher's own commit
# carries a [beeline-bundle-publish] marker and does not re-trigger this
# workflow.
# ---------------------------------------------------------------------------
name: Beeline CLI bundle

on:
  push:
    branches:
      - main
      # Temporary pre-merge verification trigger, scoped to this feature branch
      # so the pipeline could be proved end-to-end before landing. Harmless to
      # keep: it fires only for this exact branch name.
      - fm/beeline-cli-publish
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beeline-bundle-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} bundle
    # The publisher commits back with a dedicated bot identity; never
    # re-trigger on our own publishes.
    if: github.event.head_commit.author.username != 'beeline-bundle-bot'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: darwin-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build and verify ${{ matrix.platform }} bundle
        run: npm run bundle:beeline -- --platform ${{ matrix.platform }}
        env:
          BEELINE_BUNDLE_COMMIT: ${{ github.sha }}
          BEELINE_BUNDLE_VERSION: 0.0.${{ github.run_number }}
          BEELINE_BUNDLE_CREATED_AT: ${{ github.event.head_commit.timestamp }}
      # The build merges its bundle into the committed dl/manifest.json, which
      # may already carry the OTHER platform's entry; extract exactly this
      # platform so each artifact is a clean single-platform partial.
      - name: Collect build outputs
        run: |
          mkdir -p out/${{ matrix.platform }}
          cp relay-stack/web/dl/beeline-${{ matrix.platform }}.tar.gz out/${{ matrix.platform }}/
          cp relay-stack/web/dl/beeline-${{ matrix.platform }}.tar.gz.sha256 out/${{ matrix.platform }}/
          node -e "const fs=require('fs');const p='${{ matrix.platform }}';const m=JSON.parse(fs.readFileSync('relay-stack/web/dl/manifest.json','utf8'));if(!m.bundles[p]||m.bundles[p].verified!==true)throw new Error(p+' missing or unverified in built manifest');fs.writeFileSync('out/'+p+'/manifest.json',JSON.stringify({schemaVersion:m.schemaVersion??1,sourceCommit:m.sourceCommit,version:m.version,bundles:{[p]:m.bundles[p]}},null,2)+'\n')" 
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    name: Publish bundle set to relay-stack/web/dl
    needs: build
    if: github.event.head_commit.author.username != 'beeline-bundle-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      - name: Assemble and publish the bundle set
        run: node scripts/publish-beeline-dl.mjs --dir bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
      - name: Commit the published set back to main
        run: |
          git config user.name "beeline-bundle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add relay-stack/web/dl
          if git diff --cached --quiet; then
            echo "bundle set already current; nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): publish beeline CLI bundle [beeline-bundle-publish]" \
            -m "sourceCommit: ${GITHUB_SHA}"
          git push
