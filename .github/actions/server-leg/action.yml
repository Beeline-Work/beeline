# Server leg of the unified release. unified-release.yml calls it once from the
# self-hosted production host: it builds and pushes the one Fly image, migrates
# once, and canaries the exact release SHA across the two Fly Machines. The
# caller checks out the release SHA, installs the migration CLI, and owns
# runner, timeout, and concurrency.
#
# Fly is the only memory: a rerun whose Machines already all run this release's
# image does nothing, and a fleet left split by an interrupted release is
# finished on the new image instead of refused. Each updated Machine records
# the image it replaced in its Fly metadata. The image and the image it
# replaced leave through step outputs; the release record keeps the previous
# published release's image as the rollback target.
name: Server release leg
description: Build the exact server image once and deploy it to Fly.io behind a canary

inputs:
  release_sha:
    required: true
  release_version:
    required: true

outputs:
  image_ref:
    description: The image every Machine runs after this leg
    value: ${{ steps.fleet.outputs.image_ref }}
  previous_image_ref:
    description: The image the fleet ran before this leg (on a rerun, read from the Machines' metadata; empty if unknown)
    value: ${{ steps.fleet.outputs.previous_image_ref }}

runs:
  using: composite
  steps:
    - name: Verify Fly.io deployment authority
      shell: bash
      run: flyctl auth whoami
    - name: Ask Fly whether this release already runs
      id: fleet
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        mkdir -p "$RUNNER_TEMP/server-release"
        flyctl machine list --app beeline-server --json > "$RUNNER_TEMP/server-release/machines-before.json"
        image_ref="registry.fly.io/beeline-server:${RELEASE_VERSION#v}-${RELEASE_SHA:0:12}"
        node - "$RUNNER_TEMP/server-release/machines-before.json" "$image_ref" >> "$GITHUB_OUTPUT" <<'NODE'
        const [file, image] = process.argv.slice(2);
        const machines = JSON.parse(require('node:fs').readFileSync(file, 'utf8'));
        const tag = (ref) => String(ref ?? '').replace(/@sha256:[0-9a-f]+$/, '');
        const images = machines.map((m) => tag(m.config?.image ?? m.imageRef));
        for (const [i, m] of machines.entries()) console.error(`${m.id}: ${images[i]}`);
        const live = images.length > 0 && images.every((ref) => ref === image);
        const others = [...new Set(images.filter((ref) => ref !== image))];
        // A Machine this release already updated names, in its Fly metadata,
        // the image it replaced; a rerun reads it there.
        const replaced = [...new Set(machines.filter((m, i) => images[i] === image)
          .map((m) => tag(m.config?.metadata?.beeline_replaced_image)).filter((ref) => ref && ref !== image))];
        console.log(`image_ref=${image}`);
        console.log(`shipped=${live}`);
        // Only an unsplit fleet names one previous image.
        const previous = others.length === 1 ? others : others.length === 0 ? replaced : [];
        console.log(`previous_image_ref=${previous.length === 1 ? previous[0] : ''}`);
        NODE
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
    - name: This release already runs on every Machine
      if: steps.fleet.outputs.shipped == 'true'
      shell: bash
      run: echo "Every beeline-server Machine already runs ${{ steps.fleet.outputs.image_ref }}; nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Build the exact Fly image and capture the two-Machine rollback plan
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |
        set -euo pipefail
        image_label="${RELEASE_VERSION#v}-${RELEASE_SHA:0:12}"
        image_ref="registry.fly.io/beeline-server:$image_label"
        build_started=$SECONDS
        flyctl deploy . \
          --local-only \
          --config fly.beeline-server.toml \
          --dockerfile apps/server/Dockerfile \
          --app beeline-server \
          --build-arg "BEELINE_RELEASE_VERSION=$RELEASE_VERSION" \
          --build-arg "BEELINE_RELEASE_SHA=$RELEASE_SHA" \
          --image-label "$image_label" --build-only --push --yes
        echo "Server image built and pushed in $((SECONDS - build_started))s"
        node scripts/unified-release.mjs server-deploy-plan \
          --machines "$RUNNER_TEMP/server-release/machines-before.json" \
          --image "$image_ref" --output "$RUNNER_TEMP/server-release/server-deploy-plan.json"
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}

    - name: Run schema migrations and backfills once before Machine updates
      id: migrate
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |
        set -euo pipefail
        test -n "${MIGRATION_DATABASE_URL:-}" || { echo 'MIGRATION_DATABASE_URL is required' >&2; exit 1; }

        node <<'NODE'
        const { Client } = require('pg');

        const client = new Client({ connectionString: process.env.MIGRATION_DATABASE_URL });
        (async () => {
          try {
            await client.connect();
            const result = await client.query(
              "SELECT current_database() AS database, to_regclass('public.messages') IS NOT NULL AS has_messages",
            );
            const { database, has_messages: hasMessages } = result.rows[0] ?? {};
            if (database !== 'fly-db' || hasMessages !== true) {
              console.error(`MIGRATION_DATABASE_URL does not point at the production database (${database ?? 'unknown'})`);
              process.exitCode = 1;
            }
          } catch (error) {
            console.error(`database target guard failed: ${error.message}`);
            process.exitCode = 1;
          } finally {
            await client.end().catch(() => {});
          }
        })();
        NODE

        npm run migrate -w @beeline/server

    - name: Canary one Machine for ninety seconds, then update its peer
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/server-release/server-deploy-plan.json"
        read_plan() { node -e 'const p=require(process.argv[1]);process.stdout.write(String(p[process.argv[2]]))' "$plan" "$1"; }
        canary="$(read_plan canaryMachineId)"
        second="$(read_plan secondMachineId)"
        image_ref="$(read_plan newImageRef)"
        previous_ref="$(read_plan previousImageRef)"
        second_previous_ref="$(read_plan secondPreviousImageRef)"
        canary_updated=0
        second_update_attempted=0
        fleet_updated=0

        # One retry covers a transient Fly API failure.
        retry_flyctl_update() {
          local machine="$1" image="$2" desc="$3" replaced="${4:-}"
          local metadata=()
          # A forward update records the image it replaces on the Machine, so a
          # rerun that finds this release live still knows what came before.
          if [ -n "$replaced" ] && [ "${replaced%@sha256:*}" != "${image%@sha256:*}" ]; then
            metadata=(--metadata "beeline_replaced_image=${replaced%@sha256:*}")
          fi
          if flyctl machine update "$machine" --app beeline-server --image "$image" "${metadata[@]}" --wait-timeout 300 --yes 2>&1; then
            return 0
          fi
          echo "retry_flyctl_update($desc): first attempt failed, retrying in 10s" >&2
          sleep 10
          flyctl machine update "$machine" --app beeline-server --image "$image" "${metadata[@]}" --wait-timeout 300 --yes 2>&1
        }

        # Report whether every Fly Machine runs its expected image.
        verify_machine_images() {
          local machines_json="$RUNNER_TEMP/server-release/machines-verify.json"
          flyctl machine list --app beeline-server --json > "$machines_json"
          # Fly appends a resolved @sha256:<digest> to the running image; compare tags only.
          node -e '
            const machines = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const expected = Object.fromEntries(process.argv.slice(2).map((pair) => pair.split("=")));
            let split = false;
            for (const m of machines) {
              const image = (m.imageRef || m.config?.image || "unknown").replace(/@sha256:[0-9a-f]+$/, "");
              const want = (expected[m.id] || "").replace(/@sha256:[0-9a-f]+$/, "");
              console.log(`${m.id}=${image}`);
              if (image !== want) { console.error(`Machine ${m.id}: expected ${want}, found ${image}`); split = true; }
            }
            process.exit(split ? 1 : 0);
          ' "$machines_json" "$canary=$1" "$second=$2"
        }

        rollback_canary() {
          status=$?
          if [ "$canary_updated" = 1 ] && [ "$fleet_updated" = 0 ]; then
            echo "Server promotion failed; restoring attempted Machines to their previous images" >&2
            retry_flyctl_update "$canary" "$previous_ref" "rollback-canary" || true
            expected_second="$second_previous_ref"
            if [ "$second_update_attempted" = 1 ]; then
              retry_flyctl_update "$second" "$second_previous_ref" "rollback-second" || true
            fi
            if verify_machine_images "$previous_ref" "$expected_second"; then
              echo "Rollback confirmed: every Machine runs its previous image"
            else
              echo "CRITICAL: rollback left the fleet on unexpected images; run server-rollback.yml" >&2
            fi
          fi
          exit "$status"
        }

        wait_for_machine_ready() {
          machine="$1"
          force_header="fly-force-instance-id: $machine"
          ready_response="$RUNNER_TEMP/server-release/ready-$machine.json"
          health_response="$RUNNER_TEMP/server-release/ready-health-$machine.json"
          version_response="$RUNNER_TEMP/server-release/ready-version-$machine.json"
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            remaining=$((deadline - SECONDS))
            curl_timeout=$((remaining < 10 ? remaining : 10))
            ready_status="$(curl -sS --max-time "$curl_timeout" -o "$ready_response" -w '%{http_code}' \
              -H "$force_header" https://server.usebeeline.app/readyz || true)"
            if [ "$ready_status" = 200 ]; then
              remaining=$((deadline - SECONDS))
              if [ "$remaining" -gt 0 ]; then
                curl_timeout=$((remaining < 10 ? remaining : 10))
                # The Machine must serve this exact release.
                if curl -fsS --max-time "$curl_timeout" -H "$force_header" \
                  https://server.usebeeline.app/version -o "$version_response" && \
                  node -e 'const v=require(process.argv[1]);process.exit(v.version === process.argv[2] && v.sourceSha === process.argv[3] ? 0 : 1)' \
                    "$version_response" "$RELEASE_VERSION" "$RELEASE_SHA"; then
                  # Also check /health returns ok:true (database pool ready)
                  if curl -fsS --max-time "$curl_timeout" -H "$force_header" \
                    https://server.usebeeline.app/health -o "$health_response" && \
                    node -e 'const h=require(process.argv[1]);process.exit(h.ok === true ? 0 : 1)' \
                      "$health_response"; then
                    return 0
                  fi
                fi
              fi
            fi
            remaining=$((deadline - SECONDS))
            [ "$remaining" -gt 0 ] || break
            sleep_for=$((remaining < 5 ? remaining : 5))
            sleep "$sleep_for"
          done
          echo "$machine did not become ready within 180s" >&2
          return 1
        }
        trap rollback_canary ERR

        if [ "$(read_plan split)" = true ]; then
          echo "::warning::Server fleet is split ($previous_ref, $second_previous_ref); converging both Machines on $image_ref"
        fi
        canary_updated=1
        retry_flyctl_update "$canary" "$image_ref" "canary" "$previous_ref"
        wait_for_machine_ready "$canary"

        if [ -n "${SERVER_CANARY_REVIEW_SECRET:-}" ]; then
          echo "::add-mask::$SERVER_CANARY_REVIEW_SECRET"
          exchange_request="$RUNNER_TEMP/server-release/canary-token-request.json"
          exchange_response="$RUNNER_TEMP/server-release/canary-token-response.json"
          node - "$exchange_request" <<'NODE'
        const fs = require('node:fs');
        fs.writeFileSync(process.argv[2], JSON.stringify({ secret: process.env.SERVER_CANARY_REVIEW_SECRET }));
        NODE
          exchange_status='000'
          for exchange_attempt in 1 2 3; do
            if exchange_status="$(curl -sS --max-time 12 -o "$exchange_response" -w '%{http_code}' \
              -H "fly-force-instance-id: $canary" -H 'Content-Type: application/json' \
              --data-binary "@$exchange_request" \
              https://server.usebeeline.app/v1/auth/review/exchange)"; then
              case "$exchange_status" in
                5??) ;;
                *) break ;;
              esac
            fi
            if [ "$exchange_attempt" -lt 3 ]; then sleep 5; fi
          done
          rm -f "$exchange_request"
          if [ "$exchange_status" != 200 ]; then
            echo "Canary access-token exchange failed with HTTP $exchange_status" >&2
            exit 1
          fi
          mapfile -t canary_tokens < <(node - "$exchange_response" <<'NODE'
        const response = require(process.argv[2]);
        if (typeof response.accessToken !== 'string' || response.accessToken.length === 0 ||
            typeof response.refreshToken !== 'string' || response.refreshToken.length === 0) {
          throw new Error('Canary access-token exchange returned incomplete tokens');
        }
        process.stdout.write(`${response.accessToken}\n${response.refreshToken}\n`);
        NODE
          )
          canary_access_token="${canary_tokens[0]:-}"
          canary_refresh_token="${canary_tokens[1]:-}"
          test -n "$canary_access_token" -a -n "$canary_refresh_token" || {
            echo "Canary access-token exchange returned incomplete tokens" >&2
            exit 1
          }
          echo "::add-mask::$canary_access_token"
          echo "::add-mask::$canary_refresh_token"
          rm -f "$exchange_response"
        elif [ -n "${SERVER_CANARY_PHONE_TOKEN:-}" ]; then
          canary_access_token="$SERVER_CANARY_PHONE_TOKEN"
          echo "::add-mask::$canary_access_token"
          echo "SERVER_CANARY_REVIEW_SECRET is unset; using the legacy canary phone token" >&2
        else
          echo "Canary authentication requires SERVER_CANARY_REVIEW_SECRET or SERVER_CANARY_PHONE_TOKEN" >&2
          exit 1
        fi

        canary_samples="$RUNNER_TEMP/server-release/canary-samples.jsonl"
        : > "$canary_samples"

        # Seven samples over 90s; unified-release.mjs SERVER_CANARY_* must match.
        for sample in $(seq 0 6); do
          if [ "$sample" -gt 0 ]; then sleep 15; fi
          force_header="fly-force-instance-id: $canary"
          if ! curl -fsS --max-time 12 -H "$force_header" https://server.usebeeline.app/health \
            -o "$RUNNER_TEMP/server-release/health.json"; then
            printf '{"ok":false}\n' > "$RUNNER_TEMP/server-release/health.json"
          fi
          if ! curl -fsS --max-time 12 -H "$force_header" https://server.usebeeline.app/version \
            -o "$RUNNER_TEMP/server-release/version.json"; then
            printf '{}\n' > "$RUNNER_TEMP/server-release/version.json"
          fi
          room_status="$(curl -sS --max-time 12 -o "$RUNNER_TEMP/server-release/room.json" -w '%{http_code}' \
            -H "$force_header" -H "Authorization: Bearer $canary_access_token" \
            "https://server.usebeeline.app/v1/phone/rooms/$SERVER_CANARY_ROOM_ID" || true)"
          sample_verdict="$RUNNER_TEMP/server-release/canary-sample-$sample.json"
          # Keep every verdict, including transient warmup failures. The
          # sustained-window check below decides whether promotion is safe.
          if node scripts/unified-release.mjs server-canary-sample \
            --health "$RUNNER_TEMP/server-release/health.json" \
            --version "$RUNNER_TEMP/server-release/version.json" --room-status "$room_status" \
            --expected-version "$RELEASE_VERSION" --expected-sha "$RELEASE_SHA" \
            --output "$sample_verdict"; then :; fi
          node - "$canary_samples" "$sample_verdict" <<'NODE'
        const fs = require('node:fs');
        const verdict = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
        fs.appendFileSync(process.argv[2], JSON.stringify({ at: new Date().toISOString(), verdict }) + '\n');
        NODE
        done

        node scripts/unified-release.mjs server-canary-promotion --samples "$canary_samples"
        second_update_attempted=1
        retry_flyctl_update "$second" "$image_ref" "second" "$second_previous_ref"
        wait_for_machine_ready "$second"
        fleet_updated=1
        trap - ERR
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
