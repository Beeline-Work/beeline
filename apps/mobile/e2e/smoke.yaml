appId: app.usebeeline.mobile
name: Workspace and chat smoke
env:
  SMOKE_NSEC: ${SMOKE_NSEC}
  SMOKE_HANDLE: ${SMOKE_HANDLE}
  SMOKE_ROOM_ID: ${SMOKE_ROOM_ID}
  SMOKE_LATEST_MESSAGE_ID: ${SMOKE_LATEST_MESSAGE_ID}
---
# A clean app is installed by scripts/maestro-e2e.sh. Importing the generated
# identity is the stable, device-held identity path — no OIDC browser or agent
# runtime is required for this smoke suite.
- tapOn:
    id: onboarding-advanced
- tapOn:
    id: onboarding-secret-key
- inputText: ${SMOKE_NSEC}
# On a compact Android viewport the IME can cover the import control. Dismiss
# only the keyboard before tapping; this keeps the identity import user-visible.
- pressKey: back
- tapOn:
    id: onboarding-import-key
- extendedWaitUntil:
    visible:
      id: onboarding-handle-ceremony
    timeout: 15000
# The app intentionally starts with an empty input and an example placeholder;
# type this run's identity-derived unique handle before claiming it.
- inputText: ${SMOKE_HANDLE}
- pressKey: back
- tapOn:
    id: onboarding-claim-handle
- extendedWaitUntil:
    visible:
      id: room-list
    timeout: 20000
# Server-indexed Workspaces are ordered by recent activity, so explicitly
# select this run's primary fixture before asserting its Rooms.
- tapOn:
    id: workspace-avatar-trigger
- tapOn:
    id: community-rail-${SMOKE_WORKSPACE_ID}
- assertVisible:
    id: workspace-active-${SMOKE_WORKSPACE_ID}
- assertVisible: Buzzy Maestro Smoke Workspace
- extendedWaitUntil:
    visible:
      id: room-${SMOKE_ROOM_ID}
    timeout: 20000

# Two successive successful creates must both land in the deck immediately.
# This specifically catches a relay list projection that is one create behind:
# the second create may reconcile the first, but must not evict itself.
- tapOn:
    id: room-deck-compose-fab
- tapOn:
    id: room-deck-compose-room
- tapOn:
    id: create-room-name
- inputText: 'SMOKE CREATE ONE'
- tapOn:
    id: create-room-submit
- extendedWaitUntil:
    visible: '#SMOKE CREATE ONE'
    timeout: 5000
- tapOn:
    id: room-deck-compose-fab
- tapOn:
    id: room-deck-compose-room
- tapOn:
    id: create-room-name
- inputText: 'SMOKE CREATE TWO'
- tapOn:
    id: create-room-submit
- extendedWaitUntil:
    visible: '#SMOKE CREATE TWO'
    timeout: 5000
- assertVisible: '#SMOKE CREATE ONE'

# Pull refresh owns only the structural list swap. Its idle boundary must
# return inside five seconds while both just-created Rooms remain visible;
# transcript/repository/member hydration is deliberately outside this gate.
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 400
- extendedWaitUntil:
    visible:
      id: room-list-idle
    timeout: 5000
- assertVisible: '#SMOKE CREATE ONE'
- assertVisible: '#SMOKE CREATE TWO'

- tapOn:
    id: room-${SMOKE_ROOM_ID}
# The transcript is the route-ready boundary. Android exposes the bottom-edge
# composer in its hierarchy even when Maestro's 100%-visible predicate rejects
# it, so composer usability is proven by the later tap/input/send sequence.
- extendedWaitUntil:
    visible:
      id: chat-messages
    timeout: 10000
- extendedWaitUntil:
    # The unique message row proves the actual newest seeded event is visible,
    # instead of merely asserting that some wrapped text is in Android's tree.
    visible:
      id: chat-message-${SMOKE_LATEST_MESSAGE_ID}
    timeout: 20000
- assertNotVisible:
    id: agent-offline-hint

# The device must restore touch handling before foreground reconnect work runs.
# This is intentionally a real Android HOME/resume transition, not a mocked
# AppState callback.
- pressKey: HOME
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: room-list
    timeout: 5000
- tapOn:
    id: room-${SMOKE_ROOM_ID}
- extendedWaitUntil:
    visible:
      id: chat-messages
    timeout: 5000

# A Room send must reach the remote participant, whose fixture reply is only
# published after the signed device event appears on the relay.
- tapOn:
    id: chat-input
- inputText: SMOKE ROOM SEND
- tapOn:
    id: chat-send
- assertVisible: SMOKE ROOM SEND
- extendedWaitUntil:
    # Maestro's text matcher is whole-string regex matching; accept the
    # delivery annotation while still requiring the live reply prefix.
    visible: SMOKE AGENT ROOM REPLY.*
    timeout: 10000

# The send and live reply above already prove the Room transcript. Stay in the
# Room instead of exiting, reopening, and asserting the same rows a second time.
- tapOn:
    id: chat-input
- inputText: '@'
- extendedWaitUntil:
    visible:
      id: mention-suggestions
    timeout: 3000
- tapOn:
    # Handles are deterministic from a fresh test identity, so select the
    # first rendered participant control rather than hard-coding its handle.
    id: mention-suggestion-.*
- assertNotVisible:
    id: mention-suggestions
- inputText: ' mention picker stayed responsive'
- tapOn:
    id: chat-send
- assertVisible: .*mention picker stayed responsive
# This must run while the signed mention publish is still in flight. It catches
# a foreground JS/MMKV stall rather than merely proving the eventual relay ACK.
- tapOn:
    id: chat-input
- inputText: ' still accepting input'
- extendedWaitUntil:
    visible: '.*still accepting input'
    timeout: 1000

# Selecting Beebee then appending text used to race Android's controlled
# selection and publish only the prefix. The remote agent waits for the exact
# full payload, proving the relay stored every trailing character.
- eraseText
- inputText: '@'
- extendedWaitUntil:
    visible:
      id: mention-suggestions
    timeout: 3000
- tapOn:
    id: mention-suggestion-beebee
- inputText: " what's up"
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible: "SMOKE AGENT MENTION REPLY — @beebee what's up"
    timeout: 30000

# Keep the IME open while a real relay reply arrives. The reply must become the
# visible tail rather than landing behind Android's keyboard.
- tapOn:
    id: chat-input
- inputText: 'SMOKE KEYBOARD PIN TRIGGER'
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible: 'SMOKE AGENT KEYBOARD REPLY — newest above keyboard'
    timeout: 30000

# Presence is only a compact per-agent light now: no room-wide offline copy.
- pressKey: back
- tapOn:
    id: room-participant-roster-trigger
- extendedWaitUntil:
    visible:
      id: room-roster-sheet
    timeout: 3000
- assertVisible: 'Beebee, agent, online.*'
- assertVisible: 'Milo, agent, offline.*'
- assertNotVisible: 'AGENT OFFLINE'
- tapOn: '×'

# Give the remote fixture a relay-backed boundary immediately before the
# corner phase. Roster interaction and corner navigation are deliberately
# tested UI work and must not consume a timeout for a later device action.
- tapOn:
    id: chat-input
- inputText: SMOKE CORNER PHASE READY
- tapOn:
    id: chat-send

# Scroll to the linked corner, steer it, and receive the relay-backed agent
# fixture reply. A real Body/ACP daemon is separately required to prove model
# reasoning; this flow proves mobile delivery and live response rendering.
- scrollUntilVisible:
    element:
      id: corner-status-working
    direction: UP
    timeout: 10000
- takeScreenshot: corner-ripout-working
- tapOn:
    id: corner-status-working
    # RoomView keeps receiving lifecycle facts while this card is visible.
    # Do not let Maestro's generic UI-settle wait consume the canary's fixed
    # deadline; the following route assertion remains the product proof.
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: corner-session-header
    timeout: 10000
- takeScreenshot: corner-ripout-opened
- assertVisible: I am ready for a steering message.
- extendedWaitUntil:
    visible: 'Completion needed: open a pull request for fm/smoke-lifecycle.'
    timeout: 10000
- takeScreenshot: corner-ripout-idle-nudge
- tapOn:
    id: chat-input
    # This composer is already rendered and can be focused while lifecycle
    # facts continue arriving. The subsequent send/assertion own correctness.
    waitToSettleTimeoutMs: 1000
- inputText: SMOKE CORNER STEER
- tapOn:
    id: chat-send
- assertVisible: SMOKE CORNER STEER
- extendedWaitUntil:
    visible:
      id: turn-progress-line
    timeout: 10000
- extendedWaitUntil:
    visible: 'SMOKE AGENT CORNER STREAM — first chunk.*'
    timeout: 10000
- assertVisible:
    id: activity-message-draft
- takeScreenshot: corner-turn-streaming-live
- extendedWaitUntil:
    visible: SMOKE AGENT CORNER REPLY.*
    timeout: 30000
- assertNotVisible:
    id: activity-message-draft
- assertNotVisible:
    id: turn-progress-line
- takeScreenshot: corner-turn-streaming-complete

# The streamed overlay is ephemeral, but the completed agent message is the
# ordinary durable transcript row. Leave and reopen before continuing the
# lifecycle phase so a stale in-memory overlay cannot satisfy this assertion.
- pressKey: back
- extendedWaitUntil:
    visible:
      id: chat-messages
    timeout: 5000
- tapOn:
    id: corner-live-bar
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: corner-session-header
    timeout: 10000
- assertVisible: SMOKE AGENT CORNER REPLY.*
- assertNotVisible: 'SMOKE AGENT CORNER STREAM — first chunk.*'
- takeScreenshot: corner-turn-streaming-persisted

# The daemon's zero-model-call lifecycle watches the pushed branch and posts a
# typed PR fact. The fixture uses the same state/event contract and waits on
# the card itself, so this verifies the GitHub link reaches RoomView and the
# device in the normal live path.
- extendedWaitUntil:
    visible:
      id: github-event-card-pull-request-opened
    timeout: 10000
- assertVisible: 'GitHub created a new PR: Smoke lifecycle PR'
- takeScreenshot: corner-ripout-pr-fact
- extendedWaitUntil:
    visible: '.*checks failing.*'
    timeout: 10000
- takeScreenshot: corner-ripout-checks-red
- tapOn:
    id: chat-input
- inputText: SMOKE CHECKS GREEN
- tapOn:
    id: chat-send
- assertNotVisible: '.*checks failing.*'

# The fixture only completes this phase after the device's explicit merge
# command reaches the relay. It then observes branch death, posts the parent
# landed summary, and archives the child — the same mechanical sequence the
# daemon performs after `gh pr merge` deletes the branch.
- tapOn:
    id: chat-input
- inputText: SMOKE GH MERGE
- takeScreenshot: corner-ripout-gh-merge-command
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible: Corner archived (read-only)
    timeout: 10000
- takeScreenshot: corner-ripout-gh-merge

# The merge command leaves the corner composer focused. Dismiss it first, then
# leave the pushed corner route for its parent Room; `chat-messages` exists on
# both routes, so the second back press is the navigation proof rather than a
# timing allowance.
- pressKey: back
- pressKey: back
- extendedWaitUntil:
    visible:
      id: chat-messages
    timeout: 1000
- extendedWaitUntil:
    visible: Landed.*Smoke lifecycle PR.*
    timeout: 10000
- takeScreenshot: corner-ripout-landed-summary
- assertNotVisible:
    id: corner-status-working
- takeScreenshot: corner-ripout-corner-removed
- extendedWaitUntil:
    visible: Corner worktree cleaned after branch deletion.
    timeout: 10000
- takeScreenshot: corner-ripout-archived
- takeScreenshot: corner-ripout-worktree-cleaned
