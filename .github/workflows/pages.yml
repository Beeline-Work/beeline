name: Publish usebeeline.app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

concurrency:
  group: usebeeline-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      daemon_run_id: ${{ steps.daemon.outputs.run_id }}
      daemon_artifact_name: ${{ steps.daemon.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Locate the latest delivered daemon artifact
        id: daemon
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'unified-release.yml',
              branch: 'main',
              status: 'success',
              per_page: 100,
            });
            for (const run of runs.sort((a, b) => b.run_number - a.run_number)) {
              const artifactName = `daemon-artifact-${run.head_sha}`;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some((artifact) => artifact.name === artifactName && !artifact.expired)) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('artifact_name', artifactName);
                return;
              }
            }
            core.setFailed('No non-expired daemon artifact from a successful unified release is available.');
      - name: Download the latest delivered daemon artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.daemon.outputs.artifact_name }}
          path: ${{ runner.temp }}/daemon-release
          repository: ${{ github.repository }}
          run-id: ${{ steps.daemon.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/pages-site
        with:
          bundle_dir: ${{ runner.temp }}/daemon-release
          output_dir: ${{ runner.temp }}/usebeeline-pages

  deploy:
    name: Deploy static site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover the daemon inputs for the deployed-byte proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.daemon_artifact_name }}
          path: ${{ runner.temp }}/daemon-release
          repository: ${{ github.repository }}
          run-id: ${{ needs.build.outputs.daemon_run_id }}
          github-token: ${{ github.token }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the Pages origin serves exact bytes without redirects
        env:
          PAGES_ORIGIN: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if node scripts/pages-site.mjs verify \
              --bundle-dir "$RUNNER_TEMP/daemon-release" \
              --origin "$PAGES_ORIGIN"; then
              exit 0
            fi
            echo "Pages has not exposed the deployment yet (attempt $attempt/12)."
            sleep 10
          done
          exit 1
