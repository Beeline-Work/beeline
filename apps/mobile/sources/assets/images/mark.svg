<svg xmlns="http://www.w3.org/2000/svg" viewBox="-124 -124 248 248" width="248" height="248">
  <title>Beeline Alloy mark, brass</title>
  <!-- THE ALLOY — canonical geometry, do not redesign.
       Coin: semicircle (human) + half-square (workspace) fused into one solid;
       the triangle (agent) is struck through as negative space (fill-rule evenodd).
       The group shift translate(-9,0) optically centers the enlarged triangle. -->
  <g transform="translate(-9,0)">
    <path fill="#E5A645" fill-rule="evenodd" d="M 0 -100 A 100 100 0 0 0 0 100 L 100 100 L 100 -100 Z M 9 -58 L 67 42 L -49 42 Z"/>
  </g>
</svg>
