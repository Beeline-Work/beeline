          if [ "$SUITE_RESULT" != 'success' ]; then
            echo "::error::STATE-UPGRADE derives its verdict from MOBILE SUITE, which reported '$SUITE_RESULT'. MOBILE SUITE runs apps/mobile/sources/buzz/surface-storage.upgrade.test.ts."
            exit 1
          fi
          echo 'apps/mobile/sources/buzz/surface-storage.upgrade.test.ts ran in MOBILE SUITE when its change decision selected the suite.'
