name: Publish usebeeline.app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Bootstrap only - unified release run containing the CURRENT live daemon artifact
        type: string
        default: ''

permissions:
  contents: write
  actions: read
  id-token: write
  pages: write

jobs:
  deploy:
    name: Deploy static site with the current helper channel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-pages
    concurrency:
      group: usebeeline-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Bootstrap resolves production identity and fetches that exact artifact.
      - name: Resolve the current production identity for bootstrap
        if: inputs.release_run_id != ''
        id: current
        run: |
          curl -fsS --max-time 30 https://server.usebeeline.app/version -o "$RUNNER_TEMP/current-release.json"
          node - "$RUNNER_TEMP/current-release.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const identity = require(process.argv[2]);
          if (!/^[0-9a-f]{40}$/.test(identity.sourceSha) || !/^v\d+\.\d+\.\d+$/.test(identity.version)) {
            throw new Error('production did not name a usable release identity');
          }
          console.log(`sha=${identity.sourceSha}`);
          console.log(`version=${identity.version}`);
          NODE
      - uses: actions/download-artifact@v4
        if: inputs.release_run_id != ''
        with:
          name: daemon-artifact-${{ steps.current.outputs.sha }}
          path: ${{ runner.temp }}/bootstrap-daemon
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/pages-leg
        with:
          bundle_dir: ${{ inputs.release_run_id != '' && format('{0}/bootstrap-daemon', runner.temp) || '' }}
          release_sha: ${{ steps.current.outputs.sha }}
          release_version: ${{ steps.current.outputs.version }}
          manifest_url: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
