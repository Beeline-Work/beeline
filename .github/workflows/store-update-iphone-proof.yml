name: Temporary store-update iPhone proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  iphone:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/corner-3d29e4aa1138'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_BUZZY_MONOLITH_URL: http://127.0.0.1:8788
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare the app and simulator tools
        run: |
          npm ci
          npm run mobile:install
          npm run build
          brew install mobile-dev-inc/tap/maestro
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as f:
              devices = json.load(f)['devices']
          phones = [d for runtime in devices.values() for d in runtime if d['name'].startswith('iPhone') and d.get('isAvailable')]
          assert phones, 'No iPhone simulator available'
          print('PROOF_SIMULATOR=' + phones[0]['udid'])
          PY
      - name: Generate and build the native Debug simulator app
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --clean
          xcodebuild -workspace ios/Beeline.xcworkspace -scheme Beeline \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$PROOF_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/store-update-build" \
            -jobs 2 CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/iphone-build.log" 2>&1 || {
              tail -200 "$RUNNER_TEMP/iphone-build.log"
              exit 1
            }
      - name: Capture native required, equal and unset policies
        run: |
          mkdir -p "$RUNNER_TEMP/store-update-proof"
          cat > "$RUNNER_TEMP/store-update-policy-server.py" <<'PY'
          import http.server, json, os
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  policy = os.path.join(os.environ['RUNNER_TEMP'], 'store-update-policy.json')
                  data = open(policy, 'rb').read() if self.path == '/v1/public/mobile-minimum' else b'{}'
                  self.send_response(200 if self.path == '/v1/public/mobile-minimum' else 503)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Cache-Control', 'no-store')
                  self.end_headers()
                  self.wfile.write(data)
              def log_message(self, *_): pass
          http.server.HTTPServer(('127.0.0.1', 8788), Handler).serve_forever()
          PY
          echo '{}' > "$RUNNER_TEMP/store-update-policy.json"
          python3 "$RUNNER_TEMP/store-update-policy-server.py" > "$RUNNER_TEMP/policy-server.log" 2>&1 &
          (cd apps/mobile && npx expo start --dev-client --localhost --port 8081) > "$RUNNER_TEMP/iphone-metro.log" 2>&1 &
          xcrun simctl boot "$PROOF_SIMULATOR" || true
          xcrun simctl bootstatus "$PROOF_SIMULATOR" -b
          cat > "$RUNNER_TEMP/store-update-required.yaml" <<'YAML'
          appId: app.usebeeline.mobile
          ---
          - extendedWaitUntil:
              visible: "^(Continue|Update Beeline to keep going)$"
              timeout: 180000
          - tapOn:
              text: Continue
              optional: true
          - tapOn:
              text: Close
              optional: true
          - extendedWaitUntil:
              visible: "Update Beeline to keep going"
              timeout: 180000
          - assertVisible: "Update on the App Store"
          YAML
          cat > "$RUNNER_TEMP/store-update-normal.yaml" <<'YAML'
          appId: app.usebeeline.mobile
          ---
          - tapOn:
              text: Continue
              optional: true
          - tapOn:
              text: Close
              optional: true
          - extendedWaitUntil:
              visible: "Continue with GitHub"
              timeout: 180000
          - assertNotVisible: "Update Beeline to keep going"
          YAML
          app="$RUNNER_TEMP/store-update-build/Build/Products/Debug-iphonesimulator/Beeline.app"
          for appearance in light dark; do
            xcrun simctl ui "$PROOF_SIMULATOR" appearance "$appearance"
            xcrun simctl uninstall "$PROOF_SIMULATOR" app.usebeeline.mobile || true
            xcrun simctl install "$PROOF_SIMULATOR" "$app"
            echo '{"ios":{"minVersion":"0.2.24","reason":"This version can no longer sign in. The update takes about a minute."}}' > "$RUNNER_TEMP/store-update-policy.json"
            xcrun simctl openurl "$PROOF_SIMULATOR" 'beeline://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
            maestro --udid "$PROOF_SIMULATOR" test "$RUNNER_TEMP/store-update-required.yaml"
            theme=bone
            if [ "$appearance" = dark ]; then theme=obsidian; fi
            xcrun simctl io "$PROOF_SIMULATOR" screenshot "$RUNNER_TEMP/store-update-proof/ios-$theme-native.png"
          done
          version=$(node -p "require('./apps/mobile/package.json').version")
          printf '{"ios":{"minVersion":"%s","reason":"Equal-version proof"}}' "$version" > "$RUNNER_TEMP/store-update-policy.json"
          xcrun simctl terminate "$PROOF_SIMULATOR" app.usebeeline.mobile
          xcrun simctl openurl "$PROOF_SIMULATOR" 'beeline://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
          maestro --udid "$PROOF_SIMULATOR" test "$RUNNER_TEMP/store-update-normal.yaml"
          xcrun simctl io "$PROOF_SIMULATOR" screenshot "$RUNNER_TEMP/store-update-proof/ios-equal-minimum.png"
          echo '{}' > "$RUNNER_TEMP/store-update-policy.json"
          xcrun simctl terminate "$PROOF_SIMULATOR" app.usebeeline.mobile
          xcrun simctl openurl "$PROOF_SIMULATOR" 'beeline://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
          maestro --udid "$PROOF_SIMULATOR" test "$RUNNER_TEMP/store-update-normal.yaml"
          xcrun simctl io "$PROOF_SIMULATOR" screenshot "$RUNNER_TEMP/store-update-proof/ios-unset-minimum.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-update-iphone-proof
          path: |
            ${{ runner.temp }}/store-update-proof/
            ${{ runner.temp }}/iphone-build.log
            ${{ runner.temp }}/iphone-metro.log
          retention-days: 7
