# TEMPORARY proof for the release-pipeline corner; removed before merge (attempt 2).
# Exercises the new phone OTA path against TEST EAS channels and branches only
# (never `production`, never `beta`), plus the release identity/plan and the
# server reconcile plan as dry runs. Nothing here deploys or releases.
name: OTA channel proof (temporary)

on:
  push:
    branches: [feature/corner-22cec696f18b]
    paths: [.github/workflows/ota-channel-proof.yml]

permissions:
  contents: read

concurrency:
  group: ota-channel-proof
  cancel-in-progress: false

jobs:
  plan_dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identity and plan from GitHub Releases (no draft is created)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse origin/main)
          node scripts/release-record.mjs identity --sha "$sha" --requested "" --previous "$RUNNER_TEMP/previous/release.json" | tee "$RUNNER_TEMP/identity.txt"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/identity.txt")
          node scripts/unified-release.mjs component-paths --previous "$RUNNER_TEMP/previous/release.json" --sha "$sha" \
            --output "$RUNNER_TEMP/component-paths.json" --paths-output "$RUNNER_TEMP/paths.txt"
          node scripts/unified-release.mjs plan --version "$version" --sha "$sha" --previous "$RUNNER_TEMP/previous/release.json" \
            --paths "$RUNNER_TEMP/paths.txt" --component-paths "$RUNNER_TEMP/component-paths.json" \
            --selection auto --store-track none --state "$RUNNER_TEMP/state.json" --summary "$RUNNER_TEMP/plan.json" \
            --outputs "$RUNNER_TEMP/outputs.txt"
          cat "$RUNNER_TEMP/plan.json"
          grep -E '^(run_|no_op|runtime_pin_changed|native_)' "$RUNNER_TEMP/outputs.txt"
          sed -n 's/^ota_memory=//p' "$RUNNER_TEMP/outputs.txt"

  server_dry_run:
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/require-tools
        with:
          tools: flyctl git
      - name: List both Machines' images and plan the reconcile (no deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flyctl machine list --app beeline-server --json > "$RUNNER_TEMP/machines.json"
          node -e 'for (const m of require(process.argv[1])) console.log(m.id, m.config?.image)' "$RUNNER_TEMP/machines.json"
          node scripts/unified-release.mjs server-deploy-plan --machines "$RUNNER_TEMP/machines.json" \
            --image "registry.fly.io/beeline-server:0.0.0-proof$(git rev-parse --short=7 HEAD)"
          node scripts/release-record.mjs previous --output "$RUNNER_TEMP/previous.json"
          node scripts/release-record.mjs server-rollback-image --record "$RUNNER_TEMP/previous.json" \
            --machines "$RUNNER_TEMP/machines.json" || echo "(expected before the first new release records an image)"

  ota_channels:
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 45
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: ./.github/actions/require-tools
        with:
          tools: git
      - uses: ./.github/actions/eas-cli
      - name: Install mobile dependencies and build SDKs
        working-directory: apps/mobile
        run: |
          bash ../../scripts/npm-ci-timed.sh
          npm run eas-build-post-install
      - name: Live store runtimes from the previous release record and the stores
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ota"
          node ../../scripts/release-record.mjs previous --output "$RUNNER_TEMP/ota/previous.json"
          node --input-type=module -e "
            import { otaMemory } from '$GITHUB_WORKSPACE/scripts/unified-release.mjs';
            import { readFileSync, writeFileSync } from 'node:fs';
            writeFileSync('$RUNNER_TEMP/ota/memory.json', JSON.stringify(otaMemory(JSON.parse(readFileSync('$RUNNER_TEMP/ota/previous.json','utf8')))));"
          node scripts/ota-release.mjs targets --memory "$RUNNER_TEMP/ota/memory.json" --output "$RUNNER_TEMP/ota/targets.json"
      - name: Publish branch A, point the test channel at it
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Same as the release leg: Metro's cache must not land in a shared /tmp.
          TMPDIR="$(mktemp -d)"
          export TMPDIR
          sha=$(git rev-parse HEAD)
          branch="release-proof-${sha:0:12}-a"
          node scripts/ota-release.mjs publish --sha "$sha" --branch "$branch" --channel release-proof-beta \
            --targets "$RUNNER_TEMP/ota/targets.json" --output "$RUNNER_TEMP/ota/a.json"
          node scripts/ota-release.mjs promote --sha "$sha" --branch "$branch" --channel release-proof \
            --targets "$RUNNER_TEMP/ota/targets.json" --output "$RUNNER_TEMP/ota/a-promoted.json"
      - name: Kill a publish to branch B midway, then rerun it twice
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Same as the release leg: Metro's cache must not land in a shared /tmp.
          TMPDIR="$(mktemp -d)"
          export TMPDIR
          sha=$(git rev-parse HEAD)
          branch="release-proof-${sha:0:12}-b"
          count() { "$EAS_CLI_PATH" update:list --branch "$branch" --limit 50 --json --non-interactive 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).currentPage.length)}catch{console.log(0)}})'; }
          node scripts/ota-release.mjs publish --sha "$sha" --branch "$branch" --channel release-proof-beta \
            --targets "$RUNNER_TEMP/ota/targets.json" --output "$RUNNER_TEMP/ota/b-killed.json" &
          pid=$!
          for _ in $(seq 1 180); do
            n=$(count)
            if [ "$n" -ge 2 ]; then break; fi
            sleep 5
          done
          pkill -9 -P "$pid" || true
          kill -9 "$pid" || true
          wait "$pid" || true
          sleep 5
          before=$(count)
          echo "KILLED after $before of $(node -p 'require(process.argv[1]).targets.length' "$RUNNER_TEMP/ota/targets.json") updates were on $branch"
          node scripts/ota-release.mjs publish --sha "$sha" --branch "$branch" --channel release-proof-beta \
            --targets "$RUNNER_TEMP/ota/targets.json" --output "$RUNNER_TEMP/ota/b-rerun.json"
          node -e 'const f=require(process.argv[1]);console.log("RERUN published",f.published.length,":",f.published.join(","),"| already present:",f.alreadyPresent.join(","))' "$RUNNER_TEMP/ota/b-rerun.json"
          node scripts/ota-release.mjs publish --sha "$sha" --branch "$branch" --channel release-proof-beta \
            --targets "$RUNNER_TEMP/ota/targets.json" --output "$RUNNER_TEMP/ota/b-again.json"
          node -e 'const f=require(process.argv[1]);console.log("SECOND RERUN published",f.published.length)' "$RUNNER_TEMP/ota/b-again.json"
          after=$(count)
          echo "TOTAL updates on $branch: $after"
          test "$after" = "$(node -p 'require(process.argv[1]).targets.length' "$RUNNER_TEMP/ota/targets.json")"
      - name: Promote B on the test channel, list it, roll the test channel back to A
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Same as the release leg: Metro's cache must not land in a shared /tmp.
          TMPDIR="$(mktemp -d)"
          export TMPDIR
          sha=$(git rev-parse HEAD)
          a="release-proof-${sha:0:12}-a"
          b="release-proof-${sha:0:12}-b"
          node scripts/ota-release.mjs promote --sha "$sha" --branch "$b" --channel release-proof \
            --targets "$RUNNER_TEMP/ota/targets.json" --output "$RUNNER_TEMP/ota/b-promoted.json"
          echo "== eas update:list --branch $b --json"
          "$EAS_CLI_PATH" update:list --branch "$b" --limit 50 --json --non-interactive
          node scripts/ota-release.mjs verify-branch --sha "$sha" --branch "$b" --targets "$RUNNER_TEMP/ota/targets.json"
          echo "release-proof channel -> $(node scripts/ota-release.mjs channel-branch --channel release-proof)"
          node scripts/ota-release.mjs rollback --channel release-proof --to-branch "$a" --expected-current "$b" \
            --output "$RUNNER_TEMP/ota/rollback.json"
          cat "$RUNNER_TEMP/ota/rollback.json"
          echo "release-proof channel after rollback -> $(node scripts/ota-release.mjs channel-branch --channel release-proof)"
          echo "production channel (untouched) -> $(node scripts/ota-release.mjs channel-branch --channel production)"
          echo "beta channel (untouched) -> $(node scripts/ota-release.mjs channel-branch --channel beta)"
