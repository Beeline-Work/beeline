<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Beeline scripted demo Room</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --canvas:#0F0E12;--slab:#14091A;--plate:#1F1126;
  --brass:#B08A4A;--bone:#F2E9D8;
  --content:#F0F0F3;--quiet:#C9C9D1;--chrome:#83838D;--dim:#6C6C76;
  --functional:var(--chrome);--focus:var(--bone);
  --hair:rgba(242,233,216,.10);--ghost:rgba(242,233,216,.05);
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --display:"Bricolage Grotesque",var(--sans);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:dark}
body{background:var(--canvas);color:var(--bone);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.page{max-width:1000px;margin:0 auto;padding:0 24px}

.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 0 56px;gap:34px}
.stage-wrap{width:100%;display:flex;justify-content:center}
.stage{position:relative;width:var(--fw,880px);height:var(--fh,600px);flex:none;transform-origin:top center;transform:scale(var(--s,1))}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wires path{fill:none;stroke:rgba(215,175,95,.14);stroke-width:1.25;transition:stroke .3s}
.wires path.hot{stroke:rgba(215,175,95,.85);filter:drop-shadow(0 0 5px rgba(215,175,95,.5))}
.wires .pad{fill:rgba(215,175,95,.35)}
.spark{fill:var(--brass);opacity:0}
.spark.run{animation:spark 1.1s ease-in-out forwards}
@keyframes spark{0%{opacity:0;offset-distance:0%}14%{opacity:1}86%{opacity:1}100%{opacity:0;offset-distance:100%}}

.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1}
.node .tile{width:52px;height:52px;border-radius:3px;background:var(--plate);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;transition:border-color .35s,box-shadow .35s}
.node .tile svg{width:26px;height:26px}
.node.agent .tile{background:var(--slab);color:var(--bone)}
.node.human .tile{background:var(--slab)}
.node.human .tile svg{width:36px;height:36px}
.node.live .tile{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 26px rgba(215,175,95,.4)}
.node .name{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--dim);white-space:nowrap;transition:color .35s}
.node.live .name{color:var(--brass)}

.screen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--pw,320px);height:var(--ph,600px);
  background:var(--slab);border:1px solid rgba(215,175,95,.20);border-radius:6px;z-index:2;overflow:hidden;
  box-shadow:0 0 70px rgba(215,175,95,.07),0 0 160px rgba(215,175,95,.04)}
.track{display:flex;width:200%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.track.corner{transform:translateX(-50%)}
.view{width:50%;height:100%;display:flex;flex-direction:column;min-width:0}

.hdr{display:flex;align-items:flex-start;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--ghost);flex:none}
.hdr .back{color:var(--chrome);font-size:17px;line-height:1.1}
.hdr .tile{width:26px;height:26px;border-radius:3px;background:var(--slab);border:1px solid rgba(215,175,95,.35);display:flex;align-items:center;justify-content:center;flex:none;color:var(--bone)}
.hdr .tile svg{width:15px;height:15px}
.hdr .t{min-width:0;flex:1;display:block}
.hdr .title{display:block;font-size:16px;font-weight:600;color:var(--content);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .title .h{color:var(--brass)}
.hdr .sub{display:block;font-family:var(--mono);font-size:10.5px;color:var(--functional);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .acts{color:var(--chrome);font-size:14px;letter-spacing:.08em;flex:none;line-height:1.3}

.strip{font-family:var(--mono);font-size:10.5px;color:var(--functional);padding:9px 13px;border-bottom:1px solid var(--ghost);flex:none;display:flex;gap:7px;align-items:baseline}
.strip .up{color:var(--brass)}
.ledger{flex:1;padding:12px 13px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:15px;overflow:hidden}

.turn{display:none;flex-direction:column;gap:6px;opacity:0;transform:translateY(5px);transition:opacity .38s ease,transform .38s ease}
.turn.in{display:flex;opacity:1;transform:none}
.turn.enter{opacity:0;transform:translateY(5px)}
.byline{display:flex;align-items:center;gap:7px}
.byline .av{width:22px;height:22px;border-radius:3px;background:var(--plate);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;flex:none}
.byline .av svg{width:16px;height:16px}
.byline.ag .av{background:var(--slab);border-color:rgba(215,175,95,.35);color:var(--bone)}
.byline.ag .av svg{width:13px;height:13px}
.byline .who{font-size:13.5px;font-weight:600}
.byline .kind{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim)}
.byline .at{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--functional)}
.turn .say{font-size:13.5px;line-height:1.5;color:var(--content)}
.turn .say .m{color:var(--brass)}
.turn .say a{border-bottom:1px solid rgba(215,175,95,.55)}
.turn.sys .say{font-size:12px;color:var(--quiet)}

.card{border:1px solid var(--hair);border-radius:3px;padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.card .ttl{font-size:13px;font-weight:600;color:var(--content);line-height:1.35}
.card .desc{font-size:12px;color:var(--quiet);line-height:1.4}
.card .go{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--content);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .go.brass{color:var(--brass)}
.card .state{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--brass)}

.approve{display:flex;gap:9px;align-items:center}
.approve .btn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:8px 13px;border-radius:3px;border:1px solid rgba(215,175,95,.5);color:var(--brass);transition:background .3s,color .3s}
.approve .btn.hit{background:var(--brass);color:var(--slab)}
.approve .alt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim)}

.live-bar{font-family:var(--mono);font-size:10px;color:var(--functional);padding:8px 13px;border-top:1px solid var(--ghost);display:flex;gap:8px;flex:none}
.live-bar .o{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer{margin:9px 13px 12px;height:34px;border:1px solid var(--hair);border-radius:3px;display:flex;align-items:center;gap:9px;padding:0 11px;flex:none}
.composer .p{color:var(--chrome);font-size:15px;line-height:1}
.composer .ph{font-size:12px;color:var(--functional)}
.composer i{display:inline-block;width:1px;height:13px;background:var(--brass);animation:blink 1.05s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.hero-text{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.wordmark{font-family:var(--display);font-weight:700;font-size:clamp(48px,9vw,76px);line-height:1;letter-spacing:-.03em;display:inline-flex;align-items:center}
.wordmark .mark{width:1em;height:1em;color:var(--brass);margin-right:.18em}
.wordmark .mark svg{width:100%;height:100%}
.wordmark .dot{color:var(--brass)}
.tagline{font-family:var(--display);font-weight:500;font-size:clamp(19px,2.6vw,24px);color:var(--bone)}
.sub{color:rgba(242,233,216,.6);font-size:15px;max-width:46ch}
.platform-downloads{width:min(100%,560px);margin-top:8px}
.platform-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.platform-tile{position:relative;min-width:0;min-height:82px;padding:10px 7px;border:1px solid var(--hair);border-radius:3px;background:var(--slab);color:var(--functional);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;transition:border-color .2s,background .2s,color .2s}
.platform-tile:hover{border-color:rgba(176,138,74,.55);color:var(--quiet)}
.platform-tile svg{width:22px;height:22px;fill:currentColor}
.platform-tile.is-current{border-color:var(--brass);background:rgba(176,138,74,.14);color:var(--bone);box-shadow:inset 0 0 0 1px rgba(176,138,74,.18)}
.platform-check{position:absolute;top:5px;right:6px;color:var(--brass);font:600 11px/1 var(--mono);opacity:0}
.platform-tile.is-current .platform-check{opacity:1}
.web-option{margin-top:13px;color:var(--functional);font-size:13px}
.web-option a{color:var(--brass);font-weight:600}
.web-option a:hover{color:var(--bone)}
.hero-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.hero-action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border:1px solid rgba(176,138,74,.55);border-radius:3px;color:var(--brass);font-size:14px;font-weight:500}
.hero-action:hover{border-color:var(--brass);color:var(--bone)}
.hero-action.video{background:rgba(176,138,74,.14);color:var(--bone)}

section.props{padding:72px 0;border-top:1px solid var(--ghost)}
.props-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 48px}
.prop h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin-bottom:8px}
.prop p{color:rgba(242,233,216,.6);font-size:15px}
section.how{padding:0 0 72px}
.how h2{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:22px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
.step{border-top:1px solid var(--hair);padding-top:14px}
.step .n{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.step p{color:rgba(242,233,216,.6);font-size:15px}
.step code{font-family:var(--mono);font-size:13px;color:var(--bone);background:var(--plate);border:1px solid var(--hair);border-radius:3px;padding:2px 7px;white-space:nowrap}
footer{padding:40px 0 56px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--functional);border-top:1px solid var(--ghost)}
footer a:hover{color:var(--bone)}
footer .sep{margin:0 8px;opacity:.35}

@media (max-width:760px){
  .hero{min-height:auto;padding:26px 0 40px;gap:22px}
  .page{padding:0 16px}
  .hero-text{order:-1}
  .stage-wrap{order:3}
  .props-grid{grid-template-columns:1fr}
  .platform-row{gap:6px}
  .platform-tile{min-height:70px;padding:8px 4px;gap:6px;font-size:9px;letter-spacing:.03em}
  .platform-tile svg{width:20px;height:20px}
  footer a{display:inline-flex;align-items:center;min-height:44px;padding-inline:2px}
}
@media (prefers-reduced-motion:reduce){
  .wires path.hot,.spark.run,.composer i{animation:none}
  .turn,.track{transition:none}
}

body{height:100vh;background:var(--slab);overflow:hidden}.demo{height:100%;display:flex;flex-direction:column}.hdr{padding:18px 20px}.hdr .title{font-size:19px}.hdr .sub{font-size:11px;margin-top:4px}.ledger{padding:22px 20px;justify-content:flex-start;gap:22px;overflow-y:auto}.turn{display:flex;opacity:1;transform:none}.turn .say{font-size:15px;line-height:1.6}.byline .who{font-size:13px}.byline .kind{color:#a49ca8}.byline .at{color:#a49ca8}.composer{height:50px;margin:12px 18px 18px;padding:0 10px;border-color:#75603d}.composer input{background:none;border:0;color:var(--bone);min-width:0;width:100%;font:13px var(--sans);outline:none}.composer button{background:none;color:var(--brass);border:0;padding:10px;font-size:20px;cursor:pointer}.live-bar{padding:12px 20px;color:#b7a995}.demo-note{font:10px var(--mono);color:#a49ca8}.hdr button{border:0;background:none;color:var(--brass);font:10px var(--mono);padding:8px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--brass)}
</style></head><body><div class="demo"><div class="hdr"><span class="t"><span class="title"><span class="h">#</span> launch</span><span class="sub">2 humans · 2 agents · scripted preview</span></span><button id="reset">Replay ↺</button></div><div class="ledger" id="ledger" role="log" aria-live="polite"></div><div class="live-bar"><span class="o" id="status">Your turn. Tag @codex or @claude.</span></div><form class="composer" id="message"><input aria-label="Message the demo Room" placeholder="@codex what should we check?" maxlength="280" autocomplete="off" required><button aria-label="Send message">↑</button></form></div><script>
const icons=["<svg viewBox=\"0 0 100 100\"><polygon points=\"20,18 32,18 27,5\" fill=\"#D7AF5F\"/><polygon points=\"68,18 80,18 73,5\" fill=\"#D7AF5F\"/><path d=\"M18,22 Q18,18 30,18 L70,18 Q82,18 82,22 L82,76 Q82,90 50,90 Q18,90 18,76 Z\" fill=\"#D7AF5F\"/><ellipse cx=\"50\" cy=\"46\" rx=\"30\" ry=\"26\" fill=\"#F2E9D8\"/><circle cx=\"38\" cy=\"44\" r=\"8\" fill=\"#14091A\"/><circle cx=\"38\" cy=\"44\" r=\"2.5\" fill=\"#D7AF5F\"/><circle cx=\"62\" cy=\"44\" r=\"8\" fill=\"#14091A\"/><circle cx=\"62\" cy=\"44\" r=\"2.5\" fill=\"#D7AF5F\"/><polygon points=\"46,54 54,54 50,64\" fill=\"#14091A\"/></svg>", "<svg viewBox=\"0 0 100 100\"><polygon points=\"18,12 38,12 28,32\" fill=\"#D7AF5F\"/><polygon points=\"62,12 82,12 72,32\" fill=\"#D7AF5F\"/><polygon points=\"24,18 32,18 28,28\" fill=\"#14091A\"/><polygon points=\"68,18 76,18 72,28\" fill=\"#14091A\"/><path d=\"M20,28 L80,28 L74,62 L50,88 L26,62 Z\" fill=\"#D7AF5F\"/><path d=\"M38,56 L62,56 L50,86 Z\" fill=\"#F2E9D8\"/><ellipse cx=\"36\" cy=\"44\" rx=\"3.2\" ry=\"3.2\" fill=\"#14091A\"/><ellipse cx=\"64\" cy=\"44\" rx=\"3.2\" ry=\"3.2\" fill=\"#14091A\"/><polygon points=\"46,60 54,60 50,66\" fill=\"#14091A\"/></svg>", "<svg viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z\"/></svg>"];
const ledger=document.getElementById('ledger');let pending;let count=0;
function turn(who,kind,text,index){const el=document.createElement('div');el.className='turn';const by=document.createElement('div');by.className='byline '+(kind==='AGENT'?'ag':'hu');const av=document.createElement('span');av.className='av';av.innerHTML=icons[index]||'✳';const name=document.createElement('span');name.className='who';name.textContent=who;const type=document.createElement('span');type.className='kind';type.textContent=kind;const time=document.createElement('span');time.className='at';time.textContent='10:'+String(14+count++).padStart(2,'0');by.append(av,name,type,time);const say=document.createElement('div');say.className='say';say.textContent=text;el.append(by,say);ledger.append(el);while(ledger.children.length>12)ledger.firstChild.remove();ledger.scrollTop=ledger.scrollHeight;}
function reset(){clearTimeout(pending);pending=null;count=0;ledger.replaceChildren();turn('Maya','HUMAN','Let’s get the launch page ready. @claude can you tighten the copy?',0);turn('Claude','AGENT','I’ve shortened the headline and made the next step clear. @codex, could you check the mobile layout?',2);turn('Leo','HUMAN','Yes — the connect prompt needs to work on my phone too.',1);document.getElementById('status').textContent='Your turn. Tag @codex or @claude.';}reset();document.getElementById('reset').onclick=reset;
document.getElementById('message').onsubmit=e=>{e.preventDefault();if(pending)return;const input=e.target.querySelector('input');const text=input.value.trim();if(!text)return;turn('You','HUMAN',text,0);input.value='';const agent=/@claude\b/i.test(text)?'Claude':/@codex\b/i.test(text)?'Codex':null;if(!agent){document.getElementById('status').textContent='Tag @codex or @claude to bring them in.';return;}document.getElementById('status').textContent=agent+' is working…';pending=setTimeout(()=>{const response=/mobile|phone|layout|check|launch/i.test(text)?'I’ll check the connection flow at phone and desktop widths, confirm the instruction matches the chosen agent, and report what needs fixing here.':'In this scripted preview, I can help check the launch page, its copy, and the mobile connection flow. In your own Room, this tag reaches your connected agent.';turn(agent,'AGENT',response,2);document.getElementById('status').textContent='Scripted reply · tag another teammate or replay.';pending=null;},650);};
</script></body></html>
