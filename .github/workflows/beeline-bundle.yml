# Beeline CLI bundle publishing ("latest from main" channel).
#
# Every push to main touching daemon/CLI bundle inputs builds the CLI bundle
# natively for linux-x64 on the SELF-HOSTED production-Linux runner (same
# labels as deploy-host.yml) and publishes the bundle set directly to the
# host-local webroot, served statically at https://usebeeline.app/dl/
# — exactly where apps/body/src/self-update-manifest.ts reads it
# (DEFAULT_UPDATE_MANIFEST_URL). Tagged releases (`v0.2.x`) and the
# from-source installer are untouched.
#
# The darwin-arm64 leg is DISABLED (captain decision, 2026-08): no real Mac
# consumer has ever downloaded the bundle, and macOS runners bill 10x. The
# commented matrix entry below is ready to re-enable if a Mac consumer appears;
# scripts/build-beeline-bundle.mjs and install.sh still support darwin for
# local/cross builds.
#
# ---------------------------------------------------------------------------
# Manifest contract (consumed by apps/body/src/self-update-manifest.ts):
#
#   schemaVersion : 1
#   sourceCommit  : full SHA of the main commit built into these bundles
#                   (primary update-comparison identity)
#   version       : comparable version (`0.0.<run_number>`; GitHub's monotonic
#                   per-workflow counter — a larger number is always newer)
#   bundles[<platform>] : { file, sha256, bytes, node, commit, version,
#                           verified } where verified is true only when that
#                   platform's install probe ran on a native runner.
#
# Publish safety: filenames stay stable (beeline-<platform>.tar.gz); each file
# is checksum-verified and atomically renamed into the host-local store, with
# manifest.json renamed last. Same-commit re-runs are no-ops and the last five
# generations remain in .versions/ for operator rollback.
# ---------------------------------------------------------------------------
name: Beeline CLI bundle

on:
  push:
    branches:
      - main
    # Only daemon/CLI bundle inputs: the input closure of
    # scripts/build-beeline-bundle.mjs (the workspaces it builds — body, gate,
    # buzz-client, nostr — plus the bundle/publish/verify tooling and the
    # installer the probe drives) and this workflow itself. Mobile-app-only,
    # auth, or docs-only merges must not spend runner time.
    paths:
      - '.github/workflows/beeline-bundle.yml'
      - 'apps/body/**'
      - 'apps/gate/**'
      - 'packages/buzz-client/**'
      - 'packages/nostr/**'
      - 'scripts/build-beeline-bundle.mjs'
      - 'scripts/publish-beeline-dl.mjs'
      - 'scripts/verify-beeline-install.mjs'
      - 'relay-stack/web/install.sh'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: beeline-bundle-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            # Same labels deploy-host.yml targets: the production Linux host.
            runner: [self-hosted, beeline-prod-host]
          # darwin leg disabled: no Mac consumers yet. Re-enable by
          # uncommenting — never with a `matrix.*` job-level `if` guard.
          # - platform: darwin-arm64
          #   runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build and verify ${{ matrix.platform }} bundle
        run: npm run bundle:beeline -- --platform ${{ matrix.platform }}
        env:
          BEELINE_BUNDLE_COMMIT: ${{ github.sha }}
          BEELINE_BUNDLE_VERSION: 0.0.${{ github.run_number }}
          BEELINE_BUNDLE_CREATED_AT: ${{ github.event.head_commit.timestamp }}
      # The build merges its bundle into the committed dl/manifest.json, which
      # may already carry another platform's entry; extract exactly this
      # platform so each artifact is a clean single-platform partial.
      - name: Collect build outputs
        run: |
          mkdir -p out/${{ matrix.platform }}
          cp relay-stack/web/dl/beeline-${{ matrix.platform }}.tar.gz out/${{ matrix.platform }}/
          cp relay-stack/web/dl/beeline-${{ matrix.platform }}.tar.gz.sha256 out/${{ matrix.platform }}/
          node -e "const fs=require('fs');const p='${{ matrix.platform }}';const m=JSON.parse(fs.readFileSync('relay-stack/web/dl/manifest.json','utf8'));if(!m.bundles[p]||m.bundles[p].verified!==true)throw new Error(p+' missing or unverified in built manifest');fs.writeFileSync('out/'+p+'/manifest.json',JSON.stringify({schemaVersion:m.schemaVersion??1,sourceCommit:m.sourceCommit,version:m.version,bundles:{[p]:m.bundles[p]}},null,2)+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    name: Publish bundle set to the host-local /dl store
    needs: build
    # Self-hosted too, so the whole pipeline costs zero paid GitHub minutes.
    runs-on: [self-hosted, beeline-prod-host]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      - name: Assemble and publish the bundle set
        run: node scripts/publish-beeline-dl.mjs --dir bundle --output-dir "$BEELINE_DL_ROOT" --keep "$BEELINE_DL_KEEP"
        env:
          GITHUB_SHA: ${{ github.sha }}
          BEELINE_DL_ROOT: /home/lunchbox/buzz-router-relay-prod/relay-front/web/dl
          BEELINE_DL_KEEP: '5'
      # The ordinary main deploy may have run before this longer native build.
      # Dispatch again only after /dl is populated so the cutover is ordered.
      - name: Deploy the published bundle set
        run: gh workflow run deploy-host.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
