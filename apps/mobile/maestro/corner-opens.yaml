# Release proof: a corner opens from the room-list deck and renders its
# inscribed objective line (the one durable corner surface).
#
# ROOM_ID and CORNER_ID are substituted by scripts/release-proof.mjs
# (RELEASE_PROOF_ROOM / RELEASE_PROOF_CORNER override the automatic picks).
appId: app.usebeeline
name: corner-opens
---
- launchApp:
    clearState: false
- assertVisible:
    id: room-list
- tapOn:
    id: room-corners-toggle-${ROOM_ID}
- tapOn:
    id: room-corner-${CORNER_ID}
- assertVisible:
    id: corner-objective-line
