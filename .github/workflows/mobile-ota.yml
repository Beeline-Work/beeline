# Commanded Mobile OTA production delivery.
#
# The owner-visible clock ends only after the exact beta group is republished
# to production and the ledger proves that current main is in that group. The
# full emulator rehearsal runs after promotion by design; it can
# automatically restore the predecessor but cannot hold the owner's phone
# behind the single self-hosted emulator runner.
name: Mobile OTA production delivery (under 10 minutes)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: Governor-managed attempt number (1-3)
        type: number
        default: 1
        required: true
      reason:
        description: Optional owner or firstmate command note
        type: string
        required: false

permissions:
  actions: write
  contents: read
  issues: write

# The newest main is cumulative. Superseding an older run cannot lose a merge:
# init-delivery reconstructs every commit after the last artifact boundary.
concurrency:
  group: mobile-ota-production-delivery
  cancel-in-progress: true

jobs:
  release:
    name: Publish current main and prove production promotion
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      delivered: ${{ steps.promotion.outcome == 'success' }}
      production_group_id: ${{ steps.promotion.outputs.production_group_id }}
      source_sha: ${{ github.sha }}
    env:
      CURRENT_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_attempt || 1 }}
    steps:
      - name: Initialize run clock and runner-local paths
        id: clock
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const triggerEpoch = Math.floor(new Date(run.data.created_at).getTime() / 1000);
            core.exportVariable('TRIGGER_EPOCH', String(triggerEpoch));
            core.exportVariable('JOB_START_EPOCH', String(Math.floor(Date.now() / 1000)));
            core.exportVariable('DELIVERY_INDEX', `${process.env.RUNNER_TEMP}/mobile-ota-delivery-index.json`);
            core.exportVariable('RUN_LEDGER', `${process.env.RUNNER_TEMP}/mobile-ota-ledger.json`);
            core.exportVariable('TIMINGS_FILE', `${process.env.RUNNER_TEMP}/mobile-ota-stage-timings.tsv`);

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate the latest cumulative delivery index
        id: previous_index
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'mobile-ota-delivery-index',
              per_page: 100,
            });
            const latest = artifacts.data.artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            if (latest?.workflow_run?.id) core.setOutput('run_id', String(latest.workflow_run.id));

      - name: Download previous delivery index
        if: steps.previous_index.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: mobile-ota-delivery-index
          path: ${{ runner.temp }}/previous-index
          run-id: ${{ steps.previous_index.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Initialize every merge before setup
        id: initialize
        working-directory: apps/mobile
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous-index/mobile-ota-delivery-index.json"
          if [ -f "$previous" ]; then cp "$previous" "$DELIVERY_INDEX"; fi
          node scripts/ota-release.mjs init-delivery \
            --sha "$GITHUB_SHA" --ref main --run-id "$GITHUB_RUN_ID" \
            --attempt "$CURRENT_ATTEMPT" --before "$PUSH_BEFORE" \
            --ledger "$RUN_LEDGER" --index "$DELIVERY_INDEX"
          now="$(date +%s)"
          printf 'queue\t%s\ninitialize\t%s\n' \
            "$((JOB_START_EPOCH - TRIGGER_EPOCH))" "$((now - JOB_START_EPOCH))" > "$TIMINGS_FILE"

      - name: Install mobile dependencies and build SDKs
        id: install
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm ci
          npm run eas-build-post-install
          printf 'dependencies_and_sdks\t%s\n' "$(( $(date +%s) - started ))" >> "$TIMINGS_FILE"

      - name: Validate while exporting and publishing the beta candidate
        id: candidate
        working-directory: apps/mobile
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is unavailable to the release governor." >&2
            exit 2
          fi

          validation_started="$(date +%s)"
          (
            set +e
            npm run typecheck && npx vitest run \
              sources/config/appBranding.test.ts \
              sources/config/mobileOtaRelease.test.ts \
              sources/push/update-receipt.test.ts && node scripts/ota-release.mjs publish --dry-run \
              --sha "$GITHUB_SHA" --ref main --ledger "$RUN_LEDGER"
            status=$?
            printf '%s\n' "$(( $(date +%s) - validation_started ))" > "$RUNNER_TEMP/mobile-ota-validation-seconds.txt"
            exit "$status"
          ) > "$RUNNER_TEMP/mobile-ota-validation.log" 2>&1 &
          validation_pid=$!

          publish_started="$(date +%s)"
          set +e
          OTA_TMPDIR="$(mktemp -d)"
          TMPDIR="$OTA_TMPDIR" node scripts/ota-release.mjs publish \
              --sha "$GITHUB_SHA" --ref main --ledger "$RUN_LEDGER" --index "$DELIVERY_INDEX" \
              > "$RUNNER_TEMP/mobile-ota-publish.log" 2>&1
          publish_status=$?
          publish_seconds="$(( $(date +%s) - publish_started ))"
          wait "$validation_pid"
          validation_status=$?
          set -e

          cat "$RUNNER_TEMP/mobile-ota-validation.log"
          cat "$RUNNER_TEMP/mobile-ota-publish.log"
          finished="$(date +%s)"
          validation_seconds="$(cat "$RUNNER_TEMP/mobile-ota-validation-seconds.txt")"
          printf 'validation\t%s\ncandidate_export_and_publish\t%s\nparallel_candidate_wall\t%s\n' \
            "$validation_seconds" \
            "$publish_seconds" \
            "$((finished - validation_started))" >> "$TIMINGS_FILE"
          if [ "$validation_status" -ne 0 ]; then
            echo "Mobile validation failed while the candidate was built." >&2
            exit "$validation_status"
          fi
          if [ "$publish_status" -ne 0 ]; then
            echo "Beta candidate publication failed." >&2
            exit "$publish_status"
          fi

      - name: Promote the exact beta group to production
        id: promotion
        working-directory: apps/mobile
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$EXPO_TOKEN_SECRET" ]; then export EXPO_TOKEN="$EXPO_TOKEN_SECRET"; fi
          started="$(date +%s)"
          node scripts/ota-release.mjs mark-canary --ledger "$RUN_LEDGER" --status post-promote
          node scripts/ota-release.mjs promote --ledger "$RUN_LEDGER" --index "$DELIVERY_INDEX"
          node scripts/ota-release.mjs assert-promotion --ledger "$RUN_LEDGER" --index "$DELIVERY_INDEX" \
            | tee "$RUNNER_TEMP/mobile-ota-promotion-proof.txt"
          promoted="$(date +%s)"
          printf 'production_promotion\t%s\ntrigger_to_promotion\t%s\n' \
            "$((promoted - started))" "$((promoted - TRIGGER_EPOCH))" >> "$TIMINGS_FILE"
          echo "promoted_epoch=$promoted" >> "$GITHUB_OUTPUT"
          node - "$RUN_LEDGER" >> "$GITHUB_OUTPUT" <<'NODE'
            const ledger = require(process.argv[2]);
            console.log(`production_group_id=${ledger.production.groupId}`);
          NODE

      - name: Enforce the commanded ten-minute promotion contract
        if: github.event_name == 'workflow_dispatch' && steps.promotion.outcome == 'success'
        run: |
          set -euo pipefail
          elapsed="$(( ${{ steps.promotion.outputs.promoted_epoch }} - TRIGGER_EPOCH ))"
          if [ "$elapsed" -ge 600 ]; then
            echo "Owner-commanded production promotion took ${elapsed}s; the contract is under 600s." >&2
            exit 1
          fi

      - name: Check owner device receipt
        id: receipt
        if: always() && steps.promotion.outcome == 'success'
        working-directory: apps/mobile
        env:
          OWNER_PUBKEY: ${{ secrets.MOBILE_OTA_OWNER_PUBKEY }}
          RECEIPT_TOKEN: ${{ secrets.MOBILE_OTA_RECEIPT_TOKEN }}
          RECEIPT_ORIGIN: ${{ vars.MOBILE_OTA_RECEIPT_ORIGIN || 'https://usebeeline.app/push' }}
        run: |
          set -euo pipefail
          if [ -z "$OWNER_PUBKEY" ] || [ -z "$RECEIPT_TOKEN" ]; then
            echo "Owner receipt query is not configured; delivery remains published." >&2
            exit 0
          fi
          if ! curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $RECEIPT_TOKEN" \
            "$RECEIPT_ORIGIN/update-receipts/$OWNER_PUBKEY" \
            -o "$RUNNER_TEMP/owner-update-receipt.json"; then
            echo "Owner receipt endpoint is temporarily unavailable; receipt reconciliation will retry." >&2
            exit 0
          fi
          readarray -t delivery < <(node scripts/ota-release.mjs delivery-target --index "$DELIVERY_INDEX")
          node scripts/ota-release.mjs confirm \
            --index "$DELIVERY_INDEX" --ledger "$RUN_LEDGER" \
            --receipt "$RUNNER_TEMP/owner-update-receipt.json" \
            --group "${delivery[0]#group_id=}" --update-ids "${delivery[1]#update_ids=}"

      - name: Record any failed release stage
        if: failure() && steps.initialize.outcome == 'success' && steps.promotion.outcome != 'success'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if node -e "process.exit(require('$RUN_LEDGER').failure ? 0 : 1)"; then exit 0; fi
          failure_class="app-side"
          failure_reason="production delivery workflow failed"
          exit_code=1
          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            failure_class="environment-setup"; failure_reason="dependency installation or SDK build failed"; exit_code=2
          elif [ "${{ steps.candidate.outcome }}" = "failure" ]; then
            failure_reason="parallel validation or beta candidate publication failed"
          elif [ "${{ steps.promotion.outcome }}" = "failure" ]; then
            failure_reason="exact-group production promotion or delivery assertion failed"
          fi
          node scripts/ota-release.mjs record-failure \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$CURRENT_ATTEMPT" \
            --class "$failure_class" --exit-code "$exit_code" --reason "$failure_reason" \
            --ledger "$RUN_LEDGER" --index "$DELIVERY_INDEX"

      - name: Render undelivered merge report
        if: always() && steps.initialize.outcome == 'success'
        working-directory: apps/mobile
        run: node scripts/ota-release.mjs list-undelivered --index "$DELIVERY_INDEX" --output "$RUNNER_TEMP/mobile-ota-undelivered.json"

      - name: Print release stage timings
        if: always()
        run: |
          {
            echo "## Mobile OTA delivery timing"
            echo
            echo "| Stage | Seconds |"
            echo "|---|---:|"
            if [ -f "$TIMINGS_FILE" ]; then
              while IFS=$'\t' read -r stage seconds; do
                printf '| %s | %s |\n' "${stage//_/ }" "$seconds"
              done < "$TIMINGS_FILE"
            fi
            echo
            if [ "${{ steps.promotion.outcome }}" = "success" ]; then
              echo "**DELIVERED:** current main was republished to the exact production group."
            else
              echo "**NOT DELIVERED:** production promotion proof was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store cumulative delivery index
        if: always() && steps.initialize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ota-delivery-index
          path: |
            ${{ runner.temp }}/mobile-ota-delivery-index.json
            ${{ runner.temp }}/mobile-ota-undelivered.json
          if-no-files-found: error
          retention-days: 90

      - name: Store release ledger, timings, and promotion proof
        if: always() && steps.initialize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ota-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mobile-ota-ledger.json
            ${{ runner.temp }}/mobile-ota-stage-timings.tsv
            ${{ runner.temp }}/mobile-ota-promotion-proof.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Escalate or close Undelivered merges issue
        if: always() && steps.initialize.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DELIVERY_INDEX: ${{ runner.temp }}/mobile-ota-delivery-index.json
        with:
          script: |
            const fs = require('node:fs');
            const index = JSON.parse(fs.readFileSync(process.env.DELIVERY_INDEX, 'utf8'));
            const undelivered = index.merges.filter((merge) => merge.state !== 'confirmed');
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            const matches = all.filter((issue) => !issue.pull_request && issue.title === 'Undelivered merges');
            const canonical = matches[0];
            for (const duplicate of matches.slice(1)) {
              if (duplicate.state === 'open') await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: duplicate.number, state: 'closed', state_reason: 'not_planned' });
            }
            if (undelivered.length === 0) {
              if (canonical?.state === 'open') await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: canonical.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            const rows = undelivered.map((merge) => {
              const failure = merge.failures?.at(-1);
              const reason = failure ? `${failure.class}: ${failure.reason}` : merge.state === 'published' ? 'awaiting owner-device receipt' : 'awaiting production delivery';
              return `| \`${merge.sha.slice(0, 12)}\` | ${merge.state} | ${merge.failures?.length ?? 0} | ${reason.replaceAll('|', '\\|')} |`;
            });
            const body = ['The Mobile OTA delivery path has main commits that are not confirmed on the configured owner device.', '', '| Commit | State | Failures | Latest reason |', '|---|---:|---:|---|', ...rows, '', `Updated by production-delivery run ${context.runId}. Download the \`mobile-ota-delivery-index\` artifact for machine-readable state.`].join('\n');
            if (canonical) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: canonical.number, state: 'open', body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Undelivered merges', body });


  post_promote:
    name: Full rehearsal after production promotion
    needs: release
    if: always() && needs.release.outputs.delivered == 'true'
    uses: ./.github/workflows/mobile-ota-post-promote.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      production_group_id: ${{ needs.release.outputs.production_group_id }}
    secrets: inherit

  retry:
    name: Retry failed delivery with backoff
    needs: release
    if: >-
      always() &&
      (needs.release.result == 'cancelled' ||
       (needs.release.result == 'failure' && needs.release.outputs.delivered != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redispatch up to three total attempts
        uses: actions/github-script@v7
        env:
          CURRENT_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_attempt || 1 }}
        with:
          script: |
            const attempt = Number(process.env.CURRENT_ATTEMPT);
            if (attempt >= 3) {
              core.setFailed('Three production-delivery attempts failed; Undelivered merges escalation owns recovery.');
              return;
            }
            const backoffMs = attempt * 30_000;
            core.notice(`Waiting ${backoffMs / 1000}s before delivery attempt ${attempt + 1}.`);
            await new Promise((resolve) => setTimeout(resolve, backoffMs));
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-ota.yml',
              ref: 'main',
              inputs: { retry_attempt: String(attempt + 1), reason: `retry of run ${context.runId}` },
            });
