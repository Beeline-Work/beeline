pid /tmp/nginx.pid;
error_log /dev/stderr;

events {}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream trusted_relay {
    server unix:/run/buzz-trusted/relay.sock;
  }

  server {
    listen 3000;
    server_name _;

    location = /health {
      default_type application/json;
      return 200 '{"ok":true}\n';
    }

    location = /query {
      limit_except POST { deny all; }
      client_max_body_size 1m;
      proxy_pass http://trusted_relay;
      # This listener belongs to exactly one production tenant. Pinning the
      # authority avoids loopback URL handling differences between HTTP clients.
      proxy_set_header Host relay.buzzrouter.com;
      proxy_set_header X-Forwarded-For 127.0.0.1;
      proxy_set_header X-Forwarded-Proto http;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 30s;
    }

    location / {
      return 404;
    }
  }
}
