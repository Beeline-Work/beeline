name: Checks
run-name: ${{ inputs.nightly_id && format('Nightly Checks {0}', inputs.nightly_id) || github.event.pull_request.title || github.workflow }}
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:
    inputs:
      nightly_id:
        description: Correlation identity for an authorized nightly test run
        type: string
        default: ""
      suite:
        description: Gate to run on demand
        type: choice
        default: all
        options:
          - all
          - typecheck
          - shared-package-tests
          - dead-code
          - body-suite
          - server-suite
          - server-integration
          - mobile-suite
          - mobile-export-reachability
          - native-fingerprint
          - readme-parity
          - app-link-associations
          - actionlint
          - auth-image
          - mirror-ci-images
          - coverage-map
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_TEST_WORKERS: "2"
  UV_THREADPOOL_SIZE: "1"
  TURBO_CONCURRENCY: "1"
  ZSTD_NBTHREADS: "1"
jobs:
  typecheck:
    name: TYPECHECK
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'typecheck')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    timeout-minutes: 30
    env:
      CI_TEST_WORKERS: "1"
      CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      RUN_TYPECHECK: ${{ ((github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') || inputs.suite == 'all' || inputs.suite == 'typecheck') }}
      RUN_DEAD_CODE: "false"
      RUN_NATIVE_FINGERPRINT: "false"
      RUN_MOBILE_EXPORT: "false"
    outputs:
      typecheck: ${{ steps.checks.outputs['typecheck'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
      - name: Run sequential workspace checks
        id: checks
        run: node scripts/run-ci-workspace-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-check-timings
          path: ${{ runner.temp }}/workspace-check-timings.json
          if-no-files-found: ignore
  shared-package-tests:
    name: SHARED PACKAGE TESTS
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'shared-package-tests')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
      - name: Test feedback grouping and ranking
        run: npm run test:feedback-signals
      - name: Protect nightly latency history and measured Loops publication
        run: node --test --test-concurrency=1 scripts/latency-rig/nightly-*.test.mjs
      - name: Block unbounded outside requests and waiting-screen regressions
        run: |
          npm test --prefix apps/mobile -- --run sources/sync/transport/monolith-operation.test.ts   --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1
      - name: Prove local network admission
        working-directory: packages/net
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node ../../scripts/generate-network-codecs.mjs --check
          for suite in src/*.test.ts src/private/*.test.ts; do
            npx vitest run "$suite" --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1
          done
          cd ../..
      - name: Run hermetic shared-package tests
        run: npm test -w @beeline/nostr -- --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1 && npm test -w @beeline/api-contract -- --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1 && npm test -w @beeline/buzz-client -- --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1
      - name: Protect Room navigation responsiveness
        run: npm test --prefix apps/mobile -- --run --maxWorkers="$CI_TEST_WORKERS" --minWorkers=1     'sources/app/(app)/beeline/chat/useRoomSurfaceSession.test.ts'
  dead-code:
    name: DEAD CODE
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'dead-code')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/(server|body|mobile)/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: "true"
        if: steps.changes.outputs.run == 'true'
      - name: Execute dead-code in its own checkout
        run: timeout 15m bash scripts/ci-workspace-tasks.sh dead-code
        if: steps.changes.outputs.run == 'true'
  body-suite:
    name: BODY SUITE
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'body-suite')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XDG_CONFIG_HOME: ""
      BUZZ_AGENT_BIN: /bin/false
      BUZZ_DEV_MCP_BIN: /bin/false
      BEELINE_READONLY_MCP_BIN: /bin/false
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        if: steps.changes.outputs.run == 'true'
      - name: Select tests in this checkout
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FRAME_BUDGET: "true"
          CI_STATE_UPGRADE: "true"
        run: |-
          node scripts/workspace-test-selection.mjs body --out "$RUNNER_TEMP/workspace-selection.json"
          echo "WORKSPACE_TEST_SELECTION=$(cat "$RUNNER_TEMP/workspace-selection.json")" >> "$GITHUB_ENV"
        if: steps.changes.outputs.run == 'true'
      - run: sudo ln -sf "$(command -v node)" /usr/bin/node
        if: steps.changes.outputs.run == 'true'
      - run: |
          git config --global user.name "Body CI"
          git config --global user.email "body-ci@users.noreply.github.com"
        if: steps.changes.outputs.run == 'true'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
        if: steps.changes.outputs.run == 'true'
      - name: Run the hermetic Body suite
        run: node scripts/run-workspace-tests.mjs body
        if: steps.changes.outputs.run == 'true'
      - name: Prove free-agent boot refresh and startup deadlines
        run: node --test --test-concurrency=1 infra/free-agent/entrypoint.test.mjs
        if: steps.changes.outputs.run == 'true'
  server-suite-shard:
    name: SERVER SUITE SHARD ${{ matrix.shard }}
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'server-suite' || inputs.suite == 'server-integration')"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-heavy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
          fetch-depth: 0
          filter: blob:none
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - name: Record complete main coverage
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'push')
        run: echo "SERVER_COVERAGE_MAP_DIR=$RUNNER_TEMP/coverage-records" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ci-workspace
        id: workspace
        if: steps.changes.outputs.run == 'true'
      - name: Download the newest coverage map in this PR's history
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          best='' best_distance=''
          while read -r run sha branch; do
            [ "$branch" = "$BASE_REF" ] || [ "$branch" = "$HEAD_REF" ] || continue
            git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || continue
            distance=$(git rev-list --count "$sha..HEAD")
            if [ -z "$best" ] || [ "$distance" -lt "$best_distance" ]; then best=$run best_distance=$distance; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=server-coverage-map&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.workflow_run.id) \(.workflow_run.head_sha) \(.workflow_run.head_branch)"')
          if [ -n "$best" ]; then
            gh run download "$best" --repo "$GITHUB_REPOSITORY" --name server-coverage-map --dir "$RUNNER_TEMP/map"
            echo "Coverage map from run $best, $best_distance commits behind this PR."
          else
            echo "No coverage map from $BASE_REF or $HEAD_REF in this PR's history; every server test will run."
          fi
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request')
        continue-on-error: true
      - name: Select server tests in this shard
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request')
        continue-on-error: true
        run: |-
          node apps/server/scripts/test-selection.mjs select --map "$RUNNER_TEMP/map/server-coverage-map.json" --out "$RUNNER_TEMP/server-test-selection.json"
          echo "SERVER_TEST_SELECTION=$RUNNER_TEMP/server-test-selection.json" >> "$GITHUB_ENV"
      - name: Run the balanced server suite shard
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || inputs.suite != 'server-integration')
        working-directory: apps/server
        env:
          SERVER_HOSTED_TIMING: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: node scripts/run-ci-shard.mjs ${{ matrix.shard }}/8
      - name: Run one bounded integration batch
        if: steps.changes.outputs.run == 'true' && (!cancelled() && steps.workspace.outcome == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'server-integration'))
        working-directory: apps/server
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/run-integration-shard.mjs "$SHARD/8"
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'push' && always())
        with:
          name: server-coverage-records-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-records
          retention-days: 3
          if-no-files-found: error
    permissions:
      contents: read
      actions: read
  main-coverage-map:
    name: SERVER COVERAGE MAP
    if: github.event_name == 'push'
    needs:
      - server-suite-shard
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-control
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - uses: ./.github/actions/ci-workspace
      - uses: actions/download-artifact@v4
        with:
          pattern: server-coverage-records-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-records
      - name: Publish complete main coverage for later PR selections
        run: |
          node apps/server/scripts/test-selection.mjs build-map --records "$RUNNER_TEMP/coverage-records" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/server-coverage-map.json"
          node apps/server/scripts/test-selection.mjs check-map "$RUNNER_TEMP/server-coverage-map.json"
      - uses: actions/upload-artifact@v4
        with:
          name: server-coverage-map
          path: ${{ runner.temp }}/server-coverage-map.json
          retention-days: 14
          if-no-files-found: error
  coverage-map:
    name: SERVER COVERAGE MAP (on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'coverage-map'
    uses: ./.github/workflows/server-coverage-map.yml
  server-claim-latency:
    name: SERVER CLAIM LATENCY
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'server-claim-latency')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: isolated-proof
        ports:
          - 5432/tcp
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - uses: ./.github/actions/ci-workspace
        with:
          mobile: true
        if: steps.changes.outputs.run == 'true'
      - name: Run the canonical server seams on isolated PostgreSQL
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BEELINE_COMMAND_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_APP_DISCOVERY_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_ATTENTION_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_INVITE_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_LIFETIME_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_MERGE_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_REVIEW_RECOVERY_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_SENTRY_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BEELINE_STOP_TEST_POSTGRES_URL: postgres://postgres:isolated-proof@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          for suite in tests/seams/*.test.ts; do
            npx vitest run "$suite" --maxWorkers=2 --minWorkers=1
          done
          npm test -w @beeline/server -- src/production-deadlocks.postgres.test.ts --maxWorkers=2 --minWorkers=1
          node --import tsx scripts/prove-router-group-c-room-payload.mjs
          BEELINE_GROUP_C_COST_PROOF=1 node --import tsx scripts/prove-router-group-c-room-payload.mjs
        if: steps.changes.outputs.run == 'true'
  server-suite:
    name: SERVER SUITE
    needs:
      - server-suite-shard
      - server-claim-latency
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'server-suite')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-control
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - name: Require every shard and the claim latency budget to pass
        env:
          SHARDS_RESULT: ${{ needs.server-suite-shard.result }}
          CLAIM_RESULT: ${{ needs.server-claim-latency.result }}
        run: |
          set -euo pipefail
          echo "SERVER SUITE SHARDS: $SHARDS_RESULT"
          echo "SERVER CLAIM LATENCY: $CLAIM_RESULT"
          test "$SHARDS_RESULT" = success
          test "$CLAIM_RESULT" = success
        if: steps.changes.outputs.run == 'true'
  server-integration:
    name: SERVER INTEGRATION
    needs:
      - server-suite-shard
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'server-integration' || inputs.suite == 'server-suite')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-control
    env:
      CI_TEST_WORKERS: "1"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.server-suite-shard.result }}
        run: |
          set -euo pipefail
          echo "SERVER INTEGRATION SHARD: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = success
        if: steps.changes.outputs.run == 'true'
  mobile-suite:
    name: MOBILE SUITE
    if: "!cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'mobile-suite')"
    runs-on:
      - self-hosted
      - Linux
      - X64
      - beeline-ci
      - beeline-ci-workspace
    env:
      CI_TEST_WORKERS: "2"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ !startsWith(runner.name, 'beeline-ci-squire-') }}
      - name: Decide in this checkout
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PATHS: ^apps/|^packages/
        run: |-
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA" && git diff --name-only "$CI_BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"; then
            run=false
            while IFS= read -r file; do
              if [[ "$file" =~ $CI_PATHS ]]; then run=true; break; fi
              if [[ "$file" == docs/* || "$file" == *.md ]]; then continue; fi
              if [[ ! "$file" =~ ^apps/(body|server|mobile)/ ]]; then run=true; break; fi
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "This job runs: $run"
