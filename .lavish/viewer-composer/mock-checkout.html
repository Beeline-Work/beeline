<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout flow · mock</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f2ede3;color:#211a22;font:16px/1.45 system-ui,sans-serif;padding:28px 21px}
  small{display:block;color:#a37b40;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}
  h1{font-size:26px;line-height:1.1;margin:0 0 12px}p{margin:0 0 27px}
  section{background:#fff;border:1px solid #e1d6c5;border-radius:16px;padding:20px;box-shadow:0 12px 25px #211a220d}
  label{display:block;margin:2px 0 7px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .field{height:45px;border:1px solid #d8c6af;border-radius:8px;color:#b3a4b4;padding:12px;margin-bottom:20px}
  button{width:100%;height:44px;border:0;border-radius:7px;background:#211a22;color:#fff;font-weight:700}
  footer{text-align:center;color:#aa9a8b;font-size:13px;padding-top:17px}
</style>
<small>Monarch / checkout</small><h1>Almost there.</h1><p>Review your details and finish your order.</p>
<section><label>Contact</label><div class="field">Email address</div><label>Payment</label><div class="field">Card number</div>
  <button>Continue</button><footer>A calm, secure final step.</footer></section>
</html>
