events {}

http {
  include /etc/nginx/mime.types;
  # Docker's embedded DNS resolves the short-lived cutover candidate.  The
  # upstream selector below is a variable, so nginx resolves it here at
  # request time instead of retaining an old container IP after a reload.
  resolver 127.0.0.11 ipv6=off valid=5s;
  include /etc/beeline-front/materializer-upstream.conf;

  # STOPGAP: default 1M rejected large agent activity/response events with 413,
  # truncating agent output mid-stream. Raise generously. Revisit alongside the
  # daemon activity-projection sizing (task buzzy-daemon-ws-push follow-ups).
  client_max_body_size 25m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # The public landing page shares `/` with the Nostr relay. Browser navigation
  # stays static; websocket upgrades and NIP-11 metadata reads keep flowing to
  # the relay exactly as they did before the landing page existed.
  map "$http_upgrade:$http_accept" $root_is_relay_request {
    default 0;
    ~*^websocket: 1;
    ~*application/nostr\+json 1;
  }

  # The product origin may display only inert raster images inline. Everything
  # else is downloadable there; active/browser-rendered files use the isolated
  # preview server below.
  map $upstream_http_content_type $product_media_disposition {
    "~^image/(?:png|jpeg|gif|webp)(?:;|$)" "";
    default "attachment";
  }

  server {
    listen 3000;
    server_name _;

    # The production cutover operator atomically replaces this include and
    # reloads nginx.  The tracked file is inert; the active form installs an
    # exact /events maintenance response without disturbing RoomView reads.
    include /etc/beeline-front/cutover-write-freeze.conf;

    location = /.well-known/apple-app-site-association {
      root /usr/share/nginx/html;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
      root /usr/share/nginx/html;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /install {
      alias /usr/share/nginx/html/install.sh;
      default_type text/x-shellscript;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Public product landing page and its self-hosted assets. Exact routes keep
    # the relay's websocket/API catch-all intact for every other path.
    location = / {
      error_page 418 = @relay_root;
      if ($root_is_relay_request = 1) { return 418; }
      root /usr/share/nginx/html;
      default_type text/html;
      try_files /index.html =404;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location @relay_root {
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    location = /index.html {
      root /usr/share/nginx/html;
      default_type text/html;
      try_files /index.html =404;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /assets/landing/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Public, static store-policy page.  Keep this exact route ahead of the
    # relay proxy below: the checked-in web tree is the deployable authority.
    location = /privacy {
      root /usr/share/nginx/html;
      default_type text/html;
      try_files /privacy/index.html =404;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location = /privacy/ {
      root /usr/share/nginx/html;
      default_type text/html;
      try_files /privacy/index.html =404;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /dl/ {
      root /usr/share/nginx/html;
      default_type application/octet-stream;
      # no-store: installer bundles change in place; never let a CDN serve a stale
      # bundle against a fresh checksum (that fails the installer with a mismatch).
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location = /join/invite.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location ~ "^/join/bzi_[0-9a-f]{64}/?$" {
      root /usr/share/nginx/html;
      default_type text/html;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      try_files /join/index.html =404;
    }

    location /push/ {
      # The trailing slash on proxy_pass strips /push/ so the gateway receives
      # its native /registrations and /health routes. Registration and the
      # Postgres-tail sender live in this one Compose service; there is no
      # second host gateway and no host bridge/firewall dependency.
      rewrite ^/push/(.*)$ /$1 break;
      proxy_pass http://$roomview_upstream:8788;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location ~ "^/(?:workspaces|workspace/[0-9a-f-]+(?:/chats|/agents/[0-9a-f]{64})?|room/[0-9a-f-]+(?:/corners|/messages)?|invite/resolve|agent-pairing/claim)$" {
      # Preserve the full path because it is part of the exact NIP-98 proof.
      # Surface responses are private and never cached by relay-front.
      proxy_pass http://$roomview_upstream:8788;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_no_cache 1;
      add_header Referrer-Policy "no-referrer" always;
    }

    location /auth/ {
      proxy_pass http://auth:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location /nip05/ {
      proxy_pass http://auth:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location = /.well-known/nostr.json {
      proxy_pass http://auth:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location ^~ /media/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_hide_header Content-Disposition;
      add_header Content-Disposition $product_media_disposition always;
      add_header X-Content-Type-Options "nosniff" always;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  # Cookie-less active-file renderer. This hostname exposes no relay, auth,
  # upload, or app route: only read-only media GET/HEAD. DNS and TLS termination
  # are operator-provisioned at the tunnel/edge; this container owns neither.
  server {
    listen 3000;
    server_name preview.usebeeline.app;

    location ^~ /media/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_hide_header Content-Disposition;
      proxy_hide_header Set-Cookie;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host usebeeline.app;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "sandbox allow-scripts; default-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / { return 404; }
  }
}
