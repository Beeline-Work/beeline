events {}

http {
  include /etc/nginx/mime.types;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $upstream_http_content_type $product_media_disposition {
    "~^image/(?:png|jpeg|gif|webp)(?:;|$)" "";
    default "attachment";
  }

  server {
    listen 3000;
    server_name _;

    location = /.well-known/apple-app-site-association {
      root /usr/share/nginx/html;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
      root /usr/share/nginx/html;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /install {
      alias /usr/share/nginx/html/install.sh;
      default_type text/x-shellscript;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /dl/ {
      root /usr/share/nginx/html;
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location = /join/invite.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location ~ "^/join/bzi_[0-9a-f]{64}/?$" {
      root /usr/share/nginx/html;
      default_type text/html;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      try_files /join/index.html =404;
    }

    location /auth/ {
      proxy_pass http://auth:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location ^~ /media/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_hide_header Content-Disposition;
      add_header Content-Disposition $product_media_disposition always;
      add_header X-Content-Type-Options "nosniff" always;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    # The trailing slash on proxy_pass strips /push/ so the gateway receives
    # its native /registrations and /health routes.
    location /push/ {
      proxy_pass http://push-gateway:8788/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location /nip05/ {
      proxy_pass http://auth:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location = /.well-known/nostr.json {
      proxy_pass http://auth:8789;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  server {
    listen 3000;
    server_name preview.usebeeline.app;

    location ^~ /media/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_hide_header Content-Disposition;
      proxy_hide_header Set-Cookie;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host usebeeline.app;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "sandbox allow-scripts; default-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / { return 404; }
  }

  # Keep the permanent push.buzzrouter.com alias on the same containerized
  # gateway. The tunnel for this hostname targets relay-front, not port 8788.
  server {
    listen 3000;
    server_name push.buzzrouter.com;

    location / {
      proxy_pass http://push-gateway:8788;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
    }
  }
}
