appId: app.usebeeline
name: Monolith review sign-in and Room read
env:
  BEELINE_REVIEW_SECRET: ${BEELINE_REVIEW_SECRET}
  SMOKE_ROOM_ID: ${SMOKE_ROOM_ID}
---
- openLink: beeline://review/${BEELINE_REVIEW_SECRET}
- extendedWaitUntil:
    visible:
      id: room-list
    timeout: 20000
- openLink: beeline://beeline/chat/${SMOKE_ROOM_ID}
- extendedWaitUntil:
    visible:
      id: chat-messages
    timeout: 20000
