# Each job prepares itself. Squire checkouts retain lockfile-keyed installations and Turbo outputs.
name: Reuse CI workspace
description: Prepare this runner’s dependencies and exact-commit workspace builds
inputs:
  mobile:
    description: Install the isolated mobile dependency tree
    default: "false"
runs:
  using: composite
  steps:
    - if: startsWith(runner.name, 'beeline-ci-squire-')
      shell: bash
      run: echo "$GITHUB_ACTION_PATH/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check runner-local root dependencies
      id: local-root
      if: startsWith(runner.name, 'beeline-ci-squire-')
      shell: bash
      env:
        CI_DEPENDENCY_INPUTS: ci-root-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.npmrc') }}
      run: |-
        if [ -f ./node_modules/.ci-inputs ] && [ "$(cat ./node_modules/.ci-inputs)" = "$CI_DEPENDENCY_INPUTS" ]; then
          echo 'ready=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache@v4
      id: root
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          !apps/mobile/node_modules
        key: ci-root-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.npmrc') }}
      if: "!startsWith(runner.name, 'beeline-ci-squire-')"
    - if: steps.root.outputs.cache-hit != 'true' && steps.local-root.outputs.ready != 'true'
      shell: bash
      env:
        npm_config_jobs: "1"
        UV_THREADPOOL_SIZE: "1"
        CI_DEPENDENCY_INPUTS: ci-root-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.npmrc') }}
      run: |-
        npm ci --no-audit --no-fund --prefer-offline
        printf '%s' "$CI_DEPENDENCY_INPUTS" > ./node_modules/.ci-inputs
    - uses: actions/cache/restore@v4
      id: builds
      with:
        path: |
          packages/*/dist/**
          apps/*/dist/**
          .beeline-ci-build.json
        key: ci-build-v3-${{ runner.os }}-node22-${{ github.sha }}
      if: "!startsWith(runner.name, 'beeline-ci-squire-')"
    - uses: actions/cache@v4
      if: "!startsWith(runner.name, 'beeline-ci-squire-') && (steps.builds.outputs.cache-hit != 'true' || contains(fromJSON('[\"typecheck\",\"dead-code\"]'), github.job))"
      with:
        path: .turbo/cache
        key: ci-turbo-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ci-turbo-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.job }}-
          ci-turbo-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'turbo.json') }}-
    - uses: actions/cache@v4
      if: "!startsWith(runner.name, 'beeline-ci-squire-') && (inputs.mobile == 'true' && github.job == 'typecheck')"
      with:
        path: |
          apps/mobile/tsconfig.tsbuildinfo
          apps/*/.typecheck*.tsbuildinfo
          packages/*/.typecheck*.tsbuildinfo
          tsconfig.scripts.tsbuildinfo
        key: ci-ts-state-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/tsconfig.json') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ci-ts-state-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/tsconfig.json') }}-${{ github.job }}-
          ci-ts-state-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/tsconfig.json') }}-
    - if: steps.builds.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # The cache can disappear after preparation, including before a failed
        # job is rerun. Rebuild this checkout instead of requiring its survival.
        npm run build -- --concurrency=1
    - name: Record exact-head compiled output provenance
      if: steps.builds.outputs.cache-hit != 'true'
      shell: bash
      env:
        CI_BUILD_SHA: ${{ github.sha }}
      run: node scripts/ci-build-provenance.mjs write "$CI_BUILD_SHA"
    - name: Verify exact-head compiled output provenance
      shell: bash
      env:
        CI_BUILD_SHA: ${{ github.sha }}
      run: node scripts/ci-build-provenance.mjs verify "$CI_BUILD_SHA"
    - name: Verify compiled API exports
      id: verify-builds
      shell: bash
      run: |
        node --input-type=module <<'JS'
        import { readFileSync, existsSync } from 'node:fs';
        import { resolve } from 'node:path';
        const directory = resolve('packages/api-contract');
        const manifest = JSON.parse(readFileSync(resolve(directory, 'package.json'), 'utf8'));
        function verify(value) {
          if (typeof value === 'string' && value.startsWith('./dist/') && !value.includes('*')) {
            if (!existsSync(resolve(directory, value))) throw new Error(`Missing compiled API export: ${value}`);
          } else if (value && typeof value === 'object') {
            for (const entry of Object.values(value)) verify(entry);
          }
        }
        verify(manifest.exports);
        JS
    - uses: actions/cache/save@v4
      if: "!startsWith(runner.name, 'beeline-ci-squire-') && (steps.builds.outputs.cache-hit != 'true')"
      with:
        path: |
          packages/*/dist/**
          apps/*/dist/**
          .beeline-ci-build.json
        key: ${{ steps.builds.outputs.cache-primary-key }}
    - name: Check runner-local mobile dependencies
      id: local-mobile
      if: inputs.mobile == 'true' && startsWith(runner.name, 'beeline-ci-squire-')
      shell: bash
      env:
        CI_DEPENDENCY_INPUTS: ci-mobile-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/package.json', 'apps/mobile/patches/**', 'apps/mobile/scripts/patch-livekit-abort.cjs') }}
      run: |-
        if [ -f apps/mobile/node_modules/.ci-inputs ] && [ "$(cat apps/mobile/node_modules/.ci-inputs)" = "$CI_DEPENDENCY_INPUTS" ]; then
          echo 'ready=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache@v4
      if: "!startsWith(runner.name, 'beeline-ci-squire-') && (inputs.mobile == 'true')"
      id: mobile
      with:
        path: |
          apps/mobile/node_modules
          apps/mobile/public/canvaskit.wasm
        key: ci-mobile-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/package.json', 'apps/mobile/patches/**', 'apps/mobile/scripts/patch-livekit-abort.cjs') }}
    - if: inputs.mobile == 'true' && steps.mobile.outputs.cache-hit != 'true' && steps.local-mobile.outputs.ready != 'true'
      shell: bash
      env:
        npm_config_jobs: "1"
        UV_THREADPOOL_SIZE: "1"
        CI_DEPENDENCY_INPUTS: ci-mobile-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/package.json', 'apps/mobile/patches/**', 'apps/mobile/scripts/patch-livekit-abort.cjs') }}
      run: |-
        npm ci --prefix apps/mobile --no-audit --no-fund --prefer-offline
        printf '%s' "$CI_DEPENDENCY_INPUTS" > apps/mobile/node_modules/.ci-inputs
