name: Server function coverage
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-suite:
    name: Full server coverage ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BEELINE_FUNCTION_COVERAGE_DIR: ${{ github.workspace }}/coverage/function-packets
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-workspace
      - name: Run every ordinary and isolated suite
        working-directory: apps/server
        run: node scripts/run-ci-shard.mjs ${{ matrix.shard }}/4
      - name: Run every integration batch
        working-directory: apps/server
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          node scripts/run-integration-shard.mjs "$SHARD/8" || status=1
          node scripts/run-integration-shard.mjs "$((SHARD + 4))/8" || status=1
          exit "$status"
      - name: Include separately gated corpus and latency suites
        if: matrix.shard == 1
        working-directory: apps/server
        run: >-
          npx vitest run --config vitest.function-coverage.config.ts
          src/agent-command.scaling.test.ts src/production-corpus-hot-reads.test.ts
          --maxWorkers=1 --minWorkers=1
      - uses: actions/upload-artifact@v4
        with:
          name: function-packets-${{ matrix.shard }}
          path: coverage/function-packets/*.json
          if-no-files-found: error
          retention-days: 2
  publish:
    name: Publish complete coverage map
    needs: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: function-packets-*
          path: coverage/function-packets
          merge-multiple: true
      - run: node apps/server/scripts/select-ci-tests.mjs merge coverage/function-packets coverage/coverage-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: server-function-coverage-${{ github.sha }}
          path: coverage/coverage-index.json
          retention-days: 7
          if-no-files-found: error
