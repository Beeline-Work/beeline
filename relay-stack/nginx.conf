events {}

http {
  include /etc/nginx/mime.types;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 3000;
    server_name _;

    location = /.well-known/apple-app-site-association {
      root /usr/share/nginx/html;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
      root /usr/share/nginx/html;
      default_type application/json;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /install {
      alias /usr/share/nginx/html/install.sh;
      default_type text/x-shellscript;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /dl/ {
      root /usr/share/nginx/html;
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location = /join/invite.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location ~ "^/join/bzi_[0-9a-f]{64}/?$" {
      root /usr/share/nginx/html;
      default_type text/html;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      try_files /join/index.html =404;
    }

    location / {
      proxy_pass http://relay:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
