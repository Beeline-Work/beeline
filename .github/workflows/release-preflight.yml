name: Release preflight
on:
  workflow_dispatch:
    inputs:
      production:
        description: Probe production runner
        type: boolean
        default: true
      android:
        description: Probe Android runner
        type: boolean
        default: true
      ios:
        description: Probe iOS runner
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runners.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: runners
        with:
          script: core.setOutput('matrix', JSON.stringify(require('./scripts/release-preflight.cjs').runnerMatrix(context.payload.inputs)));
  runner:
    needs: select
    if: needs.select.outputs.matrix != '[]'
    name: Runner probe ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node -v
  runners_online:
    needs: runner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: await require('./scripts/release-preflight.cjs').validateRunnerResults({github, context, core});
  native:
    if: inputs.android || inputs.ios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Expo's fingerprint tool requires the mobile build toolchain's Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/mobile
      - name: Validate committed native fingerprints
        run: npm run fingerprint:check --prefix apps/mobile
      - name: Compare against each platform's last released native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight-native.mjs
