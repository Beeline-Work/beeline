# Daemon leg of the unified release (was .github/workflows/beeline-bundle.yml).
# unified-release.yml calls it twice from the self-hosted production host:
# phase=build builds and install-verifies the exact linux-x64 bundle,
# phase=promote publishes it into the host-local /dl/ store
# (docs/cli-bundle-channel.md) and waits for every helper to restart READY on
# the exact release. The caller checks out the release SHA first and owns
# runner and timeout (promote needs 40 minutes, see the confirm step).
name: Beeline daemon release leg
description: Build the exact daemon artifact or publish it and await updater READY proof

inputs:
  phase:
    description: build | promote
    required: true
  release_sha:
    required: true
  release_version:
    required: true

runs:
  using: composite
  steps:
    # ---- build -------------------------------------------------------------
    - name: Find a downloadable daemon artifact for this exact release SHA
      if: inputs.phase == 'build'
      id: reuse
      uses: actions/github-script@v7
      with:
        script: |
          const name = `daemon-artifact-${{ inputs.release_sha }}`;
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
          });
          const artifact = artifacts
            .filter((candidate) => candidate.name === name && !candidate.expired && candidate.workflow_run?.id)
            .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
          if (artifact) {
            try {
              await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: artifact.id, archive_format: 'zip',
              });
              core.setOutput('run_id', String(artifact.workflow_run.id));
            } catch (error) {
              core.info(`Artifact ${artifact.id} is no longer downloadable: ${error.message}`);
            }
          }
    - name: Reuse the exact daemon artifact
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: daemon-artifact-${{ inputs.release_sha }}
        path: ${{ runner.temp }}/daemon-release
        run-id: ${{ steps.reuse.outputs.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/setup-node@v4
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      with:
        node-version: '20.19'
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
    - if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: npm ci
    - name: Build and verify the exact daemon bundle
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: npm run bundle:beeline -- --platform linux-x64
      env:
        BEELINE_BUNDLE_COMMIT: ${{ inputs.release_sha }}
        BEELINE_BUNDLE_VERSION: ${{ inputs.release_version }}
    - name: Collect daemon artifact
      if: inputs.phase == 'build' && steps.reuse.outputs.run_id == ''
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/daemon-release"
        cp relay-stack/web/dl/beeline-linux-x64.tar.gz "$RUNNER_TEMP/daemon-release/"
        cp relay-stack/web/dl/beeline-linux-x64.tar.gz.sha256 "$RUNNER_TEMP/daemon-release/"
        cp relay-stack/web/dl/manifest.json "$RUNNER_TEMP/daemon-release/"
    - if: inputs.phase == 'build'
      uses: actions/upload-artifact@v4
      with:
        name: daemon-artifact-${{ inputs.release_sha }}
        path: ${{ runner.temp }}/daemon-release/
        if-no-files-found: error
        retention-days: 7

    # ---- promote -----------------------------------------------------------
    - if: inputs.phase == 'promote'
      uses: actions/download-artifact@v4
      with:
        name: daemon-artifact-${{ inputs.release_sha }}
        path: bundle/linux-x64
    - name: Publish daemon artifact through the boring updater
      if: inputs.phase == 'promote'
      shell: bash
      run: node scripts/publish-beeline-dl.mjs --dir bundle --output-dir "$BEELINE_DL_ROOT" --keep 5
      env:
        GITHUB_SHA: ${{ inputs.release_sha }}
        BEELINE_DL_ROOT: /home/lunchbox/buzz-router-relay-prod/relay-front/web/dl
    - name: Confirm every daemon restarted READY on the exact release
      if: inputs.phase == 'promote'
      shell: bash
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        set -euo pipefail
        # Wait at least the helper's drain budget plus margin: a helper with a
        # turn in flight restarts at its absolute drain deadline, then systemd
        # restart backoff and the successor's functional probe follow.
        wait_minutes=35
        deadline=$((SECONDS + wait_minutes * 60))
        next_report=0
        : > "$RUNNER_TEMP/release-readiness-error.txt"
        readiness_table() {
          # shellcheck disable=SC2016 # JavaScript template literals, not shell expansion
          node -e '
            const status = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            for (const daemon of status.daemons ?? []) {
              console.log(
                `  ${String(daemon.agentPubkey ?? "<unknown>").slice(0, 12)}  ` +
                  `${String(daemon.state ?? "<missing-state>").padEnd(10)}  ` +
                  `${daemon.version ?? "-"}@${String(daemon.sha ?? "-").slice(0, 8)}`,
              );
            }
          ' "$RUNNER_TEMP/release-readiness.json" 2>/dev/null || echo "  (no readiness payload yet)"
        }
        while (( SECONDS < deadline )); do
          if curl -fsS --max-time 15 \
            https://server.usebeeline.app/v1/releases/daemon-readiness \
            -o "$RUNNER_TEMP/release-readiness.json" \
            2> "$RUNNER_TEMP/release-readiness-error.txt" \
            && node scripts/unified-release.mjs assert-daemons \
              --status "$RUNNER_TEMP/release-readiness.json" \
              --version "$RELEASE_VERSION" \
              --sha "$RELEASE_SHA" \
              2> "$RUNNER_TEMP/release-readiness-error.txt"
          then
            cat "$RUNNER_TEMP/release-readiness.json"
            exit 0
          fi
          # One readiness table per minute, so a helper stuck on the old
          # release is visible in the job log while the wait is still running.
          if (( SECONDS >= next_report )); then
            echo "daemon readiness at $(date -u +%FT%TZ); waiting up to $(( (deadline - SECONDS + 59) / 60 ))m more for $RELEASE_VERSION ($RELEASE_SHA)"
            readiness_table
            next_report=$((SECONDS + 60))
          fi
          sleep 5
        done
        echo "daemon fleet did not confirm $RELEASE_VERSION ($RELEASE_SHA) within $wait_minutes minutes" >&2
        cat "$RUNNER_TEMP/release-readiness-error.txt" >&2 || true
        readiness_table >&2
        exit 1
