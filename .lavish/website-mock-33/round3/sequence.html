<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beeline · Round 3 animation frame sequence</title><link rel="stylesheet" href="../site/style.css"><style>body{padding:25px 20px}main{max-width:1380px;margin:auto}h1{font:500 30px var(--display);margin:10px 0}p{font-size:13px;color:var(--quiet);margin:10px 0 20px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{min-height:44px;background:var(--slab);color:var(--bone);border:1px solid #75603d;padding:10px 14px;font:12px var(--sans)}#frame-wrap{max-height:83vh;overflow:auto;border:1px solid var(--hair);margin:auto}img{display:block;width:100%;height:auto}#caption{font:11px/1.7 var(--mono);color:var(--brass);margin:15px 0}a{color:var(--brass);font-size:11px;overflow-wrap:anywhere}#progress{accent-color:#b08a4a;width:min(300px,100%)}@media(max-width:700px){h1{font-size:25px}body{padding:20px 12px}.controls{gap:8px}button,select{font-size:10px;padding:10px}#caption{font-size:10px}}</style></head><body><main><div class="eyebrow">ROUND 3 / ORIGINAL BROWSER FRAMES</div><h1>A Room at the center.</h1><p>Seven moments from the working animation, captured at desktop 1440px and phone 390px. The active avatar and its connector light up before a message or card arrives.</p><div class="controls"><select id="device" aria-label="Screen size"><option value="desktop">Desktop · 1440</option><option value="phone">Phone · 390</option></select><button id="play">Play sequence ▷</button><button id="previous">← Previous</button><button id="next">Next →</button><input type="range" id="progress" aria-label="Animation frame" min="0" max="6" value="2"></div><div id="caption" role="status"></div><div id="frame-wrap"><img id="frame" alt="Beeline Room animation frame"></div><p><a id="full" target="_self">Open this original frame</a></p></main><script>
const phases=[0,2,3,6,7,10,12],labels=['Alan is typing; avatar and connector light up','grok bot works on the feedback request','The reply and feedback list appear','Alan types the decision','Codex and Claude Code open corners; both connections light up','Hermes works on the video and announcement','A report card appears in the transcript'];let index=2,playing=false,timer;
const device=document.querySelector('#device');if(innerWidth<701)device.value='phone';function render(){const name=device.value+'-frame-'+String(phases[index]).padStart(2,'0')+'.png';document.querySelector('#frame').src=name;document.querySelector('#frame').alt=labels[index];document.querySelector('#caption').textContent=String(index+1).padStart(2,'0')+' / 07 · '+labels[index];document.querySelector('#progress').value=index;document.querySelector('#full').href='https://rides-analyses-ecommerce-gospel.trycloudflare.com/artifact/617a34f50233f5cc/round3/'+name;document.querySelector('#frame-wrap').style.maxWidth=device.value==='phone'?'390px':'1440px';document.querySelector('#play').textContent=playing?'Pause Ⅱ':'Play sequence ▷';}function schedule(){clearInterval(timer);if(playing)timer=setInterval(()=>{index=(index+1)%7;render();},2000);}device.onchange=render;document.querySelector('#play').onclick=()=>{playing=!playing;render();schedule();};document.querySelector('#next').onclick=()=>{index=(index+1)%7;render();};document.querySelector('#previous').onclick=()=>{index=(index+6)%7;render();};document.querySelector('#progress').oninput=e=>{index=Number(e.target.value);render();};render();</script></body></html>
