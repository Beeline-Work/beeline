# Manual recovery only: redeploy a known-good Fly image. This never releases
# current main.
#
# The target comes from real systems, never from a run artifact: Fly says which
# image each Machine runs, and the newest published GitHub Release's
# release.json names its server image and the one before it. If the Machines
# run an image from a later attempt that never published, the rollback returns
# to the newest published release; a split fleet is finished on it.
name: Server image rollback recovery (does not release current main)

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Optional registry.fly.io image ref; defaults to the release before the live one
        type: string
        required: false
      dry_run:
        description: Resolve and print the rollback without changing any Machine
        type: boolean
        default: true
        required: false

permissions:
  contents: read

# A rollback and a release never update the Machines at the same time.
concurrency:
  group: unified-production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/require-tools
        with:
          tools: flyctl gh git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and apply the rollback image
        env:
          EXPLICIT_IMAGE: ${{ inputs.image_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flyctl machine list --app beeline-server --json > "$RUNNER_TEMP/server-machines.json"
          record=()
          if node scripts/release-record.mjs previous --output "$RUNNER_TEMP/record/release.json"; then
            record=(--record "$RUNNER_TEMP/record/release.json")
          fi
          node scripts/release-record.mjs server-rollback-image "${record[@]}" \
            --machines "$RUNNER_TEMP/server-machines.json" --explicit "$EXPLICIT_IMAGE" | tee "$RUNNER_TEMP/target.txt"
          image_ref=$(sed -n 's/^image=//p' "$RUNNER_TEMP/target.txt")
          noop=$(sed -n 's/^noop=//p' "$RUNNER_TEMP/target.txt")
          mapfile -t machines < <(node -e '
            const rows=require(process.argv[1]);
            if(rows.length!==2) throw new Error("server rollback requires exactly two Machines, found "+rows.length);
            rows.map(row=>row.id).sort().forEach(id=>console.log(id));
          ' "$RUNNER_TEMP/server-machines.json")
          if [ "$noop" = true ]; then
            echo "Both Machines already run $image_ref; nothing to roll back." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = true ]; then
            printf '[dry-run] update:%s:%s -> update:%s:%s\n' "${machines[0]}" "$image_ref" "${machines[1]}" "$image_ref" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            flyctl auth whoami
            flyctl machine update "${machines[0]}" --app beeline-server --image "$image_ref" --wait-timeout 300 --yes
            flyctl machine update "${machines[1]}" --app beeline-server --image "$image_ref" --wait-timeout 300 --yes
            echo "Rolled both Machines back to $image_ref" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
