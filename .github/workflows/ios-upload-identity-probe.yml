# TEMPORARY read-only probe for the release-pipeline corner; removed before merge.
# Lists App Store Connect build uploads and their file names (GET only).
name: iOS upload identity probe (temporary)

on:
  push:
    branches: [feature/corner-22cec696f18b]
    paths: [.github/workflows/ios-upload-identity-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List recent build uploads and their files
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          node --input-type=module -e "
            import { appStoreClient } from './scripts/ios-store-build.mjs';
            const api = appStoreClient();
            const show = (label, value) => console.log(label, JSON.stringify(value, null, 1).slice(0, 6000));
            let page;
            try { page = await api('/v1/apps/6803948500/buildUploads?limit=200&sort=-uploadedDate'); console.log('sort=-uploadedDate OK'); }
            catch (error) { console.log('sort ERROR', error.message); page = await api('/v1/apps/6803948500/buildUploads?limit=200'); }
            console.log('uploads', page.data.length, 'next', page.links?.next ?? 'none');
            const rows = page.data.map((u) => ({ id: u.id, ...u.attributes })).sort((a, b) => String(b.uploadedDate).localeCompare(String(a.uploadedDate)));
            for (const u of rows.slice(0, 6)) {
              const files = await api('/v1/buildUploads/' + u.id + '/buildUploadFiles');
              console.log(u.cfBundleShortVersionString, u.cfBundleVersion, u.state?.state, u.uploadedDate, JSON.stringify(files.data.map((f) => f.attributes)).slice(0, 1500));
            }
          "
