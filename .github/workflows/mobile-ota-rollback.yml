# Manual recovery only: point the production channel back at the previous
# release's OTA branch. This never releases current main.
#
# The target comes from real systems, never from a run artifact: the
# production channel says which branch phones get now, and the newest
# published GitHub Release's release.json names its own OTA branch and the one
# before it. If production serves a branch from a later attempt that never
# published (it failed elsewhere), the rollback returns to the newest
# published release. Runtimes the current branch serves but the rollback
# branch lacks get a roll-back-to-embedded directive first, so no phone keeps
# the bad update.
name: Mobile OTA rollback recovery (does not release current main)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Optional EAS branch to point production at (for example release-v0.2.31); defaults to the release before the live one
        type: string
        required: false
      dry_run:
        description: Resolve and print the rollback without changing production
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# A rollback and a release never move the production pointer at the same time.
concurrency:
  group: unified-production-release
  cancel-in-progress: false

jobs:
  rollback:
    name: Point production at the previous release branch
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/require-tools
        with:
          tools: git gh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/eas-cli
      # EAS loads app.config.js and its local Expo plugins before any channel
      # or branch command.
      - name: Install mobile dependencies for EAS project context
        working-directory: apps/mobile
        run: bash ../../scripts/npm-ci-timed.sh
      - name: Resolve the rollback branch
        id: target
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN is unavailable' >&2; exit 2; }
          current=$(cd apps/mobile && node scripts/ota-release.mjs channel-branch --channel production)
          echo "production currently points at: $current"
          node scripts/release-record.mjs previous --output "$RUNNER_TEMP/record/release.json"
          node scripts/release-record.mjs ota-rollback-target --record "$RUNNER_TEMP/record/release.json" \
            --current "$current" --explicit "$EXPLICIT_BRANCH" | tee "$RUNNER_TEMP/target.txt"
          {
            echo "current=$current"
            grep -E '^(branch|noop)=' "$RUNNER_TEMP/target.txt"
          } >> "$GITHUB_OUTPUT"
      - name: Point production at the rollback branch
        if: steps.target.outputs.noop != 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TARGET: ${{ steps.target.outputs.branch }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: |
          set -euo pipefail
          args=(rollback --channel production --to-branch "$TARGET" --expected-current "$CURRENT" --output "$RUNNER_TEMP/rollback.json")
          if [ "${{ inputs.dry_run }}" = true ]; then args+=(--dry-run); fi
          node scripts/ota-release.mjs "${args[@]}"
          {
            echo "## Phone OTA rollback${{ inputs.dry_run && ' (dry run)' || '' }}"
            echo "- production: $CURRENT -> $TARGET"
            echo '```json'
            cat "$RUNNER_TEMP/rollback.json" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
