appId: app.usebeeline.mobile
name: Live agent mention sends once
env:
  LIVE_NSEC: ${LIVE_NSEC}
  LIVE_ROOM_ID: ${LIVE_ROOM_ID}
  LIVE_AGENT_HANDLE: ${LIVE_AGENT_HANDLE}
  LIVE_REPLY: ${LIVE_REPLY}
---
# This is intentionally a real relay + Body/ACP check. The caller provisions
# the throwaway identity, Room, and live agent, then supplies the three values.
- launchApp:
    clearState: true
- tapOn:
    id: onboarding-advanced
- tapOn:
    id: onboarding-secret-key
- inputText: ${LIVE_NSEC}
- pressKey: back
- tapOn:
    id: onboarding-import-key
- runFlow:
    when:
      visible:
        id: onboarding-person-name-step
    commands:
      - tapOn:
          id: onboarding-person-name-input
      - inputText: Live device
      - pressKey: back
      - tapOn:
          id: onboarding-enter-workspace
- extendedWaitUntil:
    visible:
      id: room-${LIVE_ROOM_ID}
    timeout: 20000
- tapOn:
    id: room-${LIVE_ROOM_ID}
- extendedWaitUntil:
    visible:
      id: chat-input
    timeout: 20000
- tapOn:
    id: chat-input
- inputText: "@"
- extendedWaitUntil:
    visible:
      id: mention-suggestions
    timeout: 5000
- tapOn:
    id: mention-suggestion-${LIVE_AGENT_HANDLE}
- inputText: " reply with exactly: ${LIVE_REPLY}"
- tapOn:
    id: chat-send
# Immediate focus and back navigation exercise the UI while the signed relay
# publish is in flight; a prior send storm left both controls unresponsive.
- tapOn:
    id: chat-input
- inputText: " still responsive"
- pressKey: back
- pressKey: back
- extendedWaitUntil:
    visible:
      id: room-list
    timeout: 3000
- tapOn:
    id: room-${LIVE_ROOM_ID}
- extendedWaitUntil:
    visible: ${LIVE_REPLY}
    timeout: 60000
