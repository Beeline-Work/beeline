# Beeline CLI bundle publishing ("latest from main" channel).
#
# Every push to main touching daemon/CLI bundle inputs builds the CLI bundle
# natively for linux-x64 on the SELF-HOSTED production-Linux runner (same
# labels as deploy-host.yml) and publishes the bundle set to its existing
# home: relay-stack/web/dl/, served statically at https://usebeeline.app/dl/
# — exactly where apps/body/src/self-update-manifest.ts reads it
# (DEFAULT_UPDATE_MANIFEST_URL). Tagged releases (`v0.2.x`) and the
# from-source installer are untouched.
#
# The darwin-arm64 leg is DISABLED (captain decision, 2026-08): no real Mac
# consumer has ever downloaded the bundle, and macOS runners bill 10x. The
# commented matrix entry below is ready to re-enable if a Mac consumer appears;
# scripts/build-beeline-bundle.mjs and install.sh still support darwin for
# local/cross builds.
#
# ---------------------------------------------------------------------------
# Manifest contract (consumed by apps/body/src/self-update-manifest.ts):
#
#   schemaVersion : 1
#   sourceCommit  : full SHA of the main commit built into these bundles
#                   (primary update-comparison identity)
#   version       : comparable version (`0.0.<run_number>`; GitHub's monotonic
#                   per-workflow counter — a larger number is always newer)
#   bundles[<platform>] : { file, sha256, bytes, node, commit, version,
#                           verified } where verified is true only when that
#                   platform's install probe ran on a native runner.
#
# Publish safety: filenames stay stable (beeline-<platform>.tar.gz); the whole
# set lands as ONE git commit so consumers can never see a manifest pointing at
# a missing tarball; same-commit re-runs no-op; the publisher's own commit
# carries a [beeline-bundle-publish] marker and does not re-trigger this
# workflow.
# ---------------------------------------------------------------------------
name: Beeline CLI bundle

on:
  push:
    branches:
      - main
    # Only daemon/CLI bundle inputs: the input closure of
    # scripts/build-beeline-bundle.mjs (the workspaces it builds — body, gate,
    # buzz-client, nostr — plus the bundle/publish/verify tooling and the
    # installer the probe drives) and this workflow itself. Mobile-app-only,
    # auth, or docs-only merges must not spend runner time.
    paths:
      - '.github/workflows/beeline-bundle.yml'
      - 'apps/body/**'
      - 'apps/gate/**'
      - 'packages/buzz-client/**'
      - 'packages/nostr/**'
      - 'scripts/build-beeline-bundle.mjs'
      - 'scripts/publish-beeline-dl.mjs'
      - 'scripts/verify-beeline-install.mjs'
      - 'relay-stack/web/install.sh'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: beeline-bundle-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} bundle
    # The publisher commits back with a dedicated bot identity; never
    # re-trigger on our own publishes. (The `matrix` context is NOT available
    # in a job-level `if` — referencing it makes the whole workflow file
    # invalid and every push mints an instant failure run, which is exactly
    # what happened. Disabled legs are commented out instead.)
    if: github.event.head_commit.author.username != 'beeline-bundle-bot'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            # Same labels deploy-host.yml targets: the production Linux host.
            runner: [self-hosted, beeline-prod-host]
          # darwin leg disabled: no Mac consumers yet. Re-enable by
          # uncommenting — never with a `matrix.*` job-level `if` guard.
          # - platform: darwin-arm64
          #   runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build and verify ${{ matrix.platform }} bundle
        run: npm run bundle:beeline -- --platform ${{ matrix.platform }}
        env:
          BEELINE_BUNDLE_COMMIT: ${{ github.sha }}
          BEELINE_BUNDLE_VERSION: 0.0.${{ github.run_number }}
          BEELINE_BUNDLE_CREATED_AT: ${{ github.event.head_commit.timestamp }}
      # The build merges its bundle into the committed dl/manifest.json, which
      # may already carry another platform's entry; extract exactly this
      # platform so each artifact is a clean single-platform partial.
      - name: Collect build outputs
        run: |
          mkdir -p out/${{ matrix.platform }}
          cp relay-stack/web/dl/beeline-${{ matrix.platform }}.tar.gz out/${{ matrix.platform }}/
          cp relay-stack/web/dl/beeline-${{ matrix.platform }}.tar.gz.sha256 out/${{ matrix.platform }}/
          node -e "const fs=require('fs');const p='${{ matrix.platform }}';const m=JSON.parse(fs.readFileSync('relay-stack/web/dl/manifest.json','utf8'));if(!m.bundles[p]||m.bundles[p].verified!==true)throw new Error(p+' missing or unverified in built manifest');fs.writeFileSync('out/'+p+'/manifest.json',JSON.stringify({schemaVersion:m.schemaVersion??1,sourceCommit:m.sourceCommit,version:m.version,bundles:{[p]:m.bundles[p]}},null,2)+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    name: Publish bundle set to relay-stack/web/dl
    needs: build
    if: github.event.head_commit.author.username != 'beeline-bundle-bot'
    # Self-hosted too, so the whole pipeline costs zero paid GitHub minutes.
    runs-on: [self-hosted, beeline-prod-host]
    steps:
      # Rebasing the publish commit needs history beyond checkout's default
      # single commit once main advances during the build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      # Re-runs of this job replay the original commit, whose checked-out tree
      # predates the publisher's own commit; consult the REMOTE ref instead so
      # a same-commit re-run is a true no-op.
      - name: Skip if this commit is already published
        run: |
          git fetch origin main
          if git show "FETCH_HEAD:relay-stack/web/dl/manifest.json" 2>/dev/null | grep -q '"sourceCommit": "'"${GITHUB_SHA}"'"'; then
            echo "already published by a previous run for ${GITHUB_SHA}"
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Assemble and publish the bundle set
        if: env.SKIP_PUBLISH != 'true'
        run: node scripts/publish-beeline-dl.mjs --dir bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
      - name: Commit and publish the bundle set to main
        if: env.SKIP_PUBLISH != 'true'
        run: |
          git config user.name "beeline-bundle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add relay-stack/web/dl
          if git diff --cached --quiet; then
            echo "bundle set already current; nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): publish beeline CLI bundle [beeline-bundle-publish]" \
            -m "sourceCommit: ${GITHUB_SHA}"
          for attempt in 1 2 3; do
            echo "publish attempt ${attempt}/3"
            git fetch origin main
            # The workflow retains a temporary feature-branch trigger. On the
            # first attempt, move only the generated publish commit onto main,
            # never the triggering branch's commits. Later attempts already
            # have that isolated commit based on main.
            if [ "${attempt}" -eq 1 ]; then
              rebase_args=(--onto origin/main "${GITHUB_SHA}" HEAD)
            else
              rebase_args=(origin/main)
            fi
            if ! git rebase "${rebase_args[@]}"; then
              git rebase --abort || true
              echo "::error::bundle publish commit conflicts with the latest main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::bundle publish push failed after 3 attempts"
              exit 1
            fi
            echo "::warning::bundle publish push was rejected; refreshing main before retry"
          done
      # GITHUB_TOKEN pushes do not emit another workflow run. Dispatch the
      # deploy explicitly after a successful push (or an idempotent re-run
      # that confirms this source commit is already published).
      - name: Deploy the published bundle set
        run: gh workflow run deploy-host.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
