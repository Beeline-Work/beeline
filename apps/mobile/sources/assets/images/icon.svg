<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Beeline app icon — the Alloy on a brass tile</title>
  <defs>
    <!-- Speakeasy brass tile, 150deg: #f0b95a -> #E5A645 (55%) -> #C48A33 -->
    <linearGradient id="brass-tile" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0.5" y2="0.866">
      <stop offset="0" stop-color="#f0b95a"/>
      <stop offset="0.55" stop-color="#E5A645"/>
      <stop offset="1" stop-color="#C48A33"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#brass-tile)"/>
  <!-- THE ALLOY — canonical geometry, do not redesign (see mark.svg). Ink mark at 64% of the tile.
       The canonical translate(-9,0) group is preserved verbatim inside the canvas-centering transform. -->
  <g transform="translate(512 512) scale(3.28)">
    <g transform="translate(-9,0)">
      <path fill="#14091A" fill-rule="evenodd" d="M 0 -100 A 100 100 0 0 0 0 100 L 100 100 L 100 -100 Z M 9 -58 L 67 42 L -49 42 Z"/>
    </g>
  </g>
</svg>
