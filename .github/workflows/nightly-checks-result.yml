name: Nightly Checks result
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: nightly-result-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  result:
    if: github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.display_title, 'Nightly Checks ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use trusted default-branch code, never code or artifacts from the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify the completed attempt and request at most one rerun
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: workflow_run
        run: node scripts/nightly-checks.mjs
      - name: Publish nightly result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-checks-result
          path: nightly-checks.json
          if-no-files-found: ignore
          retention-days: 30
