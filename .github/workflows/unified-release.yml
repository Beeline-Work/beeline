# The one production release button. It plans from the newest published
# GitHub Release, runs only affected components, and carries every other
# component into one new release record. A merge to main never releases.
#
# MEMORY: the permanent GitHub Release is the pipeline's only memory. Each
# published release carries one `release.json` (component commits, server
# image, phone OTA branch, desktop updater counter, store builds). No Actions
# artifact, cache or run lookup carries state between jobs or runs; jobs talk
# through job outputs, and scripts/release-artifact-allowlist.mjs fails CI if a
# release workflow uploads or downloads anything but build outputs.
#
# RERUNS: a rerun of the same commit reuses its draft identity, and each leg
# asks its own system what already shipped (Fly Machine images, the EAS release
# branch and channel pointers, the Pages manifest, npm, the GitHub Release).
#
# RELEASE POLICY (consent gates):
# - The default release is OTA-ONLY. The OTA goes to every runtime live in the
#   stores today. A runtime-pin change never fails a release and never adds a
#   store submission; the new runtime waits for a store release.
# - Store publishing (store_track != none) happens ONLY on the operator's
#   explicit dispatch choice.
# - The emulator device proof (run_release_proof=true) is opt-in: it never runs
#   by default. An OTA promoted without it is recorded as UNPROVEN in the
#   release record.
#
# Jobs that need production host tools (flyctl, docker, Android SDK) run on the
# beeline-prod-host pool, which has two runners, so server and mobile OTA run
# side by side. Planning and the release record run on GitHub-hosted runners.
name: Unified production release
run-name: "Production release · @${{ fromJSON(inputs.dispatched_by || '{}').handle || 'unknown' }} · ${{ fromJSON(inputs.dispatched_by || '{}').auditMessageId }}"

on:
  workflow_dispatch:
    inputs:
      dispatched_by:
        description: Server-recorded agent, place, human command and audit receipt
        type: string
        required: true
      release_sha:
        description: Recovery only - pinned SHA from main
        type: string
        required: false
      release_version:
        description: Recovery only - existing vX.Y.Z identity
        type: string
        required: false
      selection:
        description: Recovery only - routine releases keep auto
        type: string
        default: auto
        required: true
      store_track:
        description: Recovery only - routine releases keep none
        type: choice
        default: none
        options:
          - none
          - internal
          - beta
          - production
        required: true
      run_release_proof:
        description: Opt-in only - run the emulator device proof before OTA promotion; default off (OTA promotes without it, release recorded UNPROVEN)
        type: boolean
        default: false
        required: false
      allow_pin_restore:
        description: No longer needed - a runtime-pin change never blocks an OTA-only release; kept so older dispatchers still validate
        type: boolean
        default: false
        required: false
      mobile_store_minimum:
        description: 'Explicit store minimums as JSON, e.g. {"android":{"minVersion":"0.2.24","reason":"This version can no longer sign in."}}; empty leaves both unchanged'
        type: string
        required: false
      publish_listing:
        description: Explicitly upload changed Play listing text and images (default releases upload only the build)
        type: boolean
        default: false
        required: false

# Public ingestion configuration; auth tokens stay in the Squire vault.
env:
  BEELINE_HELPER_SENTRY_DSN: ${{ vars.BEELINE_HELPER_SENTRY_DSN }}
  EXPO_PUBLIC_SENTRY_DSN: ${{ vars.BEELINE_MOBILE_SENTRY_DSN }}

permissions:
  actions: write
  contents: write
  issues: write
  packages: read

concurrency:
  group: unified-production-release
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
      release_version: ${{ steps.identity.outputs.version }}
      release_id: ${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.release_sha }}
      trigger_epoch: ${{ steps.clock.outputs.trigger_epoch }}
      release_state: ${{ steps.plan.outputs.release_state }}
      ota_memory: ${{ steps.plan.outputs.ota_memory }}
      previous_record: ${{ steps.plan.outputs.previous_record }}
      no_op: ${{ steps.plan.outputs.no_op }}
      run_server: ${{ steps.plan.outputs.run_server }}
      run_helper: ${{ steps.plan.outputs.run_helper }}
      run_mobile_ota: ${{ steps.plan.outputs.run_mobile_ota }}
      run_mobile_native: ${{ steps.plan.outputs.run_mobile_native }}
      run_desktop: ${{ steps.plan.outputs.run_desktop }}
      run_website: ${{ steps.plan.outputs.run_website }}
      native_android: ${{ steps.plan.outputs.native_android }}
      native_ios: ${{ steps.plan.outputs.native_ios }}
      native_app_version: ${{ steps.native_version.outputs.version }}
      release_marker: ${{ steps.store_shipped.outputs.release_marker }}
      android_shipped: ${{ steps.store_shipped.outputs.android_shipped }}
      android_version_code: ${{ steps.store_shipped.outputs.android_version_code }}
      ios_shipped: ${{ steps.store_shipped.outputs.ios_shipped }}
      ios_build_number: ${{ steps.store_shipped.outputs.ios_build_number }}
      runtime_pin_changed: ${{ steps.plan.outputs.runtime_pin_changed }}
      desktop_version: ${{ steps.plan.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release dispatch attribution
        uses: actions/github-script@v7
        env:
          DISPATCHED_BY: ${{ inputs.dispatched_by }}
        with:
          script: |
            const provenance = JSON.parse(process.env.DISPATCHED_BY || '{}');
            for (const key of ['agentId', 'handle', 'place', 'humanCommandMessageId', 'auditMessageId']) {
              if (typeof provenance[key] !== 'string' || !provenance[key]) {
                throw new Error(`Production release requires dispatch attribution: ${key}`);
              }
            }
            await core.summary.addHeading('Release dispatch').addCodeBlock(JSON.stringify(provenance, null, 2), 'json').write();
      - name: Record dispatch clock
        id: clock
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            core.setOutput('trigger_epoch', String(Math.floor(Date.parse(run.data.created_at) / 1000)));
      # GitHub Releases are the only memory: the newest published release's
      # release.json is the previous release, and a draft at this commit is an
      # earlier attempt of this same identity, reused so its legs can see what
      # already shipped. Drafts at other commits never block a dispatch.
      - name: Read the previous release and assign this release's identity
        id: identity
        env:
          REQUESTED_SHA: ${{ inputs.release_sha || '' }}
          REQUESTED_VERSION: ${{ inputs.release_version || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . scripts/gh-release-retry.sh
          release_sha=$(git rev-parse --verify "${REQUESTED_SHA:-$GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "release SHA is not a commit on main: $release_sha" >&2; exit 1;
          }
          node scripts/release-record.mjs identity --sha "$release_sha" --requested "$REQUESTED_VERSION" \
            --previous "$RUNNER_TEMP/previous/release.json" > "$RUNNER_TEMP/identity.txt"
          cat "$RUNNER_TEMP/identity.txt"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/identity.txt")
          has_release=$(sed -n 's/^has_release=//p' "$RUNNER_TEMP/identity.txt")
          if [ "$has_release" != true ]; then
            # Reserve the identity at once, so a failed attempt's version is
            # never handed to a different commit.
            ghr_create "$version" --target "$release_sha" --title "$version" --notes 'Release in progress.' --draft
          fi
          {
            echo "release_sha=$release_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Produce the inspectable release plan
        id: plan
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SELECTION: ${{ inputs.selection || 'auto' }}
          STORE_TRACK: ${{ inputs.store_track || 'none' }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous/release.json"
          if [ -f "$previous" ]; then
            node scripts/unified-release.mjs component-paths \
              --previous "$previous" --sha "$RELEASE_SHA" \
              --output "$RUNNER_TEMP/release-component-paths.json" \
              --paths-output "$RUNNER_TEMP/release-paths.txt"
          else
            git ls-tree -r --name-only "$RELEASE_SHA" > "$RUNNER_TEMP/release-paths.txt"
            node - "$RUNNER_TEMP/release-paths.txt" "$RUNNER_TEMP/release-component-paths.json" <<'NODE'
          const fs = require('node:fs');
          const [pathsPath, outputPath] = process.argv.slice(2);
          const paths = fs.readFileSync(pathsPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const components = ['server', 'helper', 'mobile-ota', 'mobile-native', 'desktop', 'website'];
          fs.writeFileSync(outputPath, `${JSON.stringify(Object.fromEntries(components.map((component) => [component, paths])), null, 2)}\n`);
          NODE
          fi
          args=(plan --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
            --paths "$RUNNER_TEMP/release-paths.txt" --component-paths "$RUNNER_TEMP/release-component-paths.json"
            --selection "$SELECTION" --store-track "$STORE_TRACK"
            --state "$RUNNER_TEMP/unified-release.json" --summary "$RUNNER_TEMP/release-plan.json"
            --outputs "$GITHUB_OUTPUT")
          if [ -f "$previous" ]; then args+=(--previous "$previous"); fi
          node scripts/unified-release.mjs "${args[@]}"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/release-plan.json"
      # A rerun of this release asks the stores what it already shipped. The
      # Play release name and the TestFlight "What to Test" text carry the
      # release marker, so a shipped platform skips its build and upload.
      - name: Mint a Play token to read this release's store builds
        id: play_read
        if: >-
          steps.plan.outputs.run_mobile_native == 'true' && steps.plan.outputs.native_android == 'true' &&
          inputs.store_track != '' && inputs.store_track != 'none'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-token.mjs
      - name: Find this release's store builds
        id: store_shipped
        if: steps.plan.outputs.run_mobile_native == 'true'
        env:
          STORE_TRACK: ${{ inputs.store_track }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
          NATIVE_ANDROID: ${{ steps.plan.outputs.native_android }}
          NATIVE_IOS: ${{ steps.plan.outputs.native_ios }}
          ACCESS_TOKEN: ${{ steps.play_read.outputs.access_token }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          marker="$RELEASE_VERSION@${RELEASE_SHA:0:12}"
          echo "release_marker=$marker" >> "$GITHUB_OUTPUT"
          # Without a store track nothing is uploaded, so nothing can have shipped.
          if [ -z "$STORE_TRACK" ] || [ "$STORE_TRACK" = none ]; then exit 0; fi
          args=(find --marker "$marker" --outputs "$GITHUB_OUTPUT")
          if [ "$NATIVE_ANDROID" = true ]; then args+=(--android); fi
          if [ "$NATIVE_IOS" = true ]; then args+=(--ios); fi
          node scripts/store-shipped.mjs "${args[@]}"
      - name: Resolve the shared native store version before building
        id: native_version
        if: steps.plan.outputs.run_mobile_native == 'true'
        env:
          STORE_TRACK: ${{ inputs.store_track }}
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
          SHIPPED_VERSION: ${{ steps.store_shipped.outputs.shipped_version }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          git show "$RELEASE_SHA:apps/mobile/package.json" > "$RUNNER_TEMP/mobile-package.json"
          if [ -n "$SHIPPED_VERSION" ]; then
            # A platform already shipped this release: the other one must match it.
            version="$SHIPPED_VERSION"
          elif [ "$STORE_TRACK" = production ]; then
            version=$(node scripts/ios-store-build.mjs resolve-version "$RUNNER_TEMP/mobile-package.json")
          else
            version=$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/mobile-package.json")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server:
    needs: initialize
    if: needs.initialize.outputs.run_server == 'true'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 15
    concurrency:
      group: deploy-beeline-server
      cancel-in-progress: false
    outputs:
      image_ref: ${{ steps.leg.outputs.image_ref }}
      previous_image_ref: ${{ steps.leg.outputs.previous_image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/require-tools
        with:
          tools: flyctl docker git curl
      - name: Log in to GHCR for the pinned server base image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the server migration CLI once
        run: |
          set -euo pipefail
          bash scripts/npm-ci-timed.sh
          npm run build -w @beeline/nostr
          npm run build -w @beeline/api-contract
          npm run build -w @beeline/buzz-client
          npm run build -w @beeline/body
          npm run build -w @beeline/auth
          npm run build -w @beeline/server
      - uses: ./.github/actions/server-leg
        id: leg
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          # Unset = the Welcome Workspace is left alone. The release owner arms
          # its one-shot retirement (docs/welcome-retirement.md) by setting
          # this repository variable to the exact Greeter agent id.
          BEELINE_RETIRE_WELCOME_GREETER_ID: ${{ vars.BEELINE_RETIRE_WELCOME_GREETER_ID }}
          SERVER_CANARY_REVIEW_SECRET: ${{ secrets.SERVER_CANARY_REVIEW_SECRET }}
          SERVER_CANARY_PHONE_TOKEN: ${{ secrets.SERVER_CANARY_PHONE_TOKEN }}
          SERVER_CANARY_ROOM_ID: ${{ secrets.SERVER_CANARY_ROOM_ID }}
        with:
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}

  helper_macos:
    name: HELPER BUILD (${{ matrix.platform }})
    needs: initialize
    if: needs.initialize.outputs.run_helper == 'true'
    runs-on: ${{ matrix.runs_on }}
    # An unchanged Mac bundle is carried from the published helper channel;
    # every failed lookup, download or verification falls through to the cold
    # build.
    timeout-minutes: 35
    outputs:
      shipped: ${{ steps.shipped.outputs.shipped }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            machine_arch: arm64
            runs_on: macos-15
          # GitHub-hosted Intel: never queues behind iOS store builds on the
          # shared self-hosted Mac.
          - platform: darwin-x64
            machine_arch: x86_64
            runs_on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pages is the helper's system of record: a rerun whose release already
      # serves there builds nothing.
      - name: Ask Pages whether this helper already shipped
        id: shipped
        env:
          MANIFEST_URL: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
        run: |
          shipped=false
          if manifest=$(curl -fsSL --max-time 15 "$MANIFEST_URL"); then
            shipped=$(printf '%s' "$manifest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);process.stdout.write(String(m.version===process.env.RELEASE_VERSION&&m.sourceCommit===process.env.RELEASE_SHA))})' || echo false)
          fi
          echo "shipped=$shipped" | tee -a "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.shipped.outputs.shipped != 'true'
      - run: bash scripts/npm-ci-timed.sh
        if: steps.shipped.outputs.shipped != 'true'
      - name: Require the native build architecture
        if: steps.shipped.outputs.shipped != 'true'
        run: test "$(uname -m)" = "${{ matrix.machine_arch }}"
      - name: Download the published helper channel
        id: previous_bundle
        if: steps.shipped.outputs.shipped != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHANNEL_DIR: ${{ runner.temp }}/previous-mac-bundle
        with:
          script: |
            const { downloadPagesChannel } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-channel.mjs`);
            await downloadPagesChannel({ github, repo: context.repo, directory: process.env.CHANNEL_DIR });
      - name: Carry the verified Mac payload into this release
        id: carry_bundle
        if: steps.shipped.outputs.shipped != 'true' && steps.previous_bundle.outcome == 'success'
        continue-on-error: true
        run: npm run bundle:beeline -- --platform "${{ matrix.platform }}" --carry-forward "$RUNNER_TEMP/previous-mac-bundle"
        env:
          BEELINE_BUNDLE_COMMIT: ${{ needs.initialize.outputs.release_sha }}
          BEELINE_BUNDLE_VERSION: ${{ needs.initialize.outputs.release_version }}
      - uses: ./.github/actions/buzz-agent-cache
        if: steps.shipped.outputs.shipped != 'true' && steps.carry_bundle.outcome != 'success'
        with:
          platform: ${{ matrix.platform }}
      - name: Build and install-verify the native helper
        if: steps.shipped.outputs.shipped != 'true' && steps.carry_bundle.outcome != 'success'
        run: npm run bundle:beeline -- --platform "${{ matrix.platform }}"
        env:
          BEELINE_BUNDLE_COMMIT: ${{ needs.initialize.outputs.release_sha }}
          BEELINE_BUNDLE_VERSION: ${{ needs.initialize.outputs.release_version }}
      # Build output handed to the helper job in this same run.
      - uses: actions/upload-artifact@v4
        if: steps.shipped.outputs.shipped != 'true'
        with:
          name: daemon-${{ matrix.platform }}-${{ needs.initialize.outputs.release_id }}
          path: |
            web/dl/beeline-${{ matrix.platform }}.tar.gz
            web/dl/beeline-${{ matrix.platform }}.tar.gz.sha256
            web/dl/manifest.json
            web/dl/mac-helper-inputs.json
            web/dl/beeline-bootstrap.mjs
            web/dl/beeline-bootstrap.mjs.sha256
          if-no-files-found: error
          retention-days: 1

  helper:
    needs: [initialize, helper_macos]
    if: >-
      !cancelled() && needs.initialize.outputs.run_helper == 'true' &&
      needs.helper_macos.result == 'success'
    runs-on: [self-hosted, beeline-prod-host]
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: usebeeline-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/require-tools
        with:
          tools: git curl tar
      - uses: dtolnay/rust-toolchain@stable
        if: needs.helper_macos.outputs.shipped != 'true'
      - run: bash scripts/npm-ci-timed.sh
      - uses: ./.github/actions/buzz-agent-cache
        if: needs.helper_macos.outputs.shipped != 'true'
        with:
          platform: linux-x64
      - uses: actions/download-artifact@v4
        if: needs.helper_macos.outputs.shipped != 'true'
        with:
          name: daemon-darwin-arm64-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/daemon-darwin-arm64
      - uses: actions/download-artifact@v4
        if: needs.helper_macos.outputs.shipped != 'true'
        with:
          name: daemon-darwin-x64-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/daemon-darwin-x64
      - uses: ./.github/actions/daemon-leg
        if: needs.helper_macos.outputs.shipped != 'true'
        with:
          phase: build
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          darwin_arm64_bundle_dir: ${{ format('{0}/daemon-darwin-arm64', runner.temp) }}
          darwin_x64_bundle_dir: ${{ format('{0}/daemon-darwin-x64', runner.temp) }}
      # The Pages update proof and the CLI package both build from these.
      - name: Build the helper CLI packages
        run: |
          set -euo pipefail
          npm run build -w @beeline/nostr
          npm run build -w @beeline/api-contract
          npm run build -w @beeline/buzz-client
          npm run build -w @beeline/body
          npm run build -w usebeeline
      - uses: ./.github/actions/daemon-leg
        if: needs.helper_macos.outputs.shipped != 'true'
        with:
          phase: promote
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          pages_manifest_url: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
      - name: Publish the exact helper CLI package
        run: |
          set -euo pipefail
          npm install --global npm@^11.15.0
          version="${{ needs.initialize.outputs.release_version }}"
          npm version "${version#v}" --allow-same-version --no-git-tag-version --workspace usebeeline
          npm view "usebeeline@${version#v}" version >/dev/null 2>&1 || npm publish --no-provenance --workspace usebeeline
      # The Pages leg already proved the live manifest serves this release.
      - name: Smoke the exact helper package
        env:
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
        run: node scripts/npm-package-visibility.mjs usebeeline "${RELEASE_VERSION#v}"

  release_proof:
    # The emulator proof is a release gate, not a check: a blank-screen build
    # must never promote its OTA (the failure class it exists to catch). It
    # drives the rig emulator under /tmp/emulator-5554.lock through
    # apps/mobile/scripts/release-proof.mjs, which never starts, stops, or
    # restarts the emulator itself. The rig AVD and its signed-in session live
    # on the beeline-android pool hosts; a host without them fails the lane
    # loudly instead of passing vacuously.
    # consent-gated (run_release_proof=true): OTA promotion never depends on
    # the proof.
    needs: [initialize, mobile_native_android]
    if: >-
      always() && needs.initialize.result == 'success' &&
      inputs.run_release_proof == true &&
      needs.initialize.outputs.run_mobile_ota == 'true' &&
      needs.mobile_native_android.result != 'failure'
    runs-on: [self-hosted, beeline-android]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      # The proof builds its own sideload APK when the native build was
      # carried, and that build runs Metro. Without this the job inherits the
      # runner's system node, which is older than metro-config's use of
      # Array.prototype.toReversed, so `createBundleReleaseJsAndAssets` dies
      # with "configs.toReversed is not a function" and NO release whose
      # Android build was carried can ever be proven. Same version and cache
      # as mobile_native_android so both legs bundle on identical node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve the Android SDK
        run: |
          set -euo pipefail
          # A value written to $GITHUB_ENV reaches LATER steps, never this
          # shell, so the guard has to read what the loop resolved rather
          # than $ANDROID_HOME. Checking the env var made a runner whose
          # SDK was found but whose ANDROID_HOME was unset (the rig's own
          # beeline-runner account) fail as 'SDK missing'.
          resolved=""
          for candidate in "${ANDROID_HOME:-}" "$HOME/Android/Sdk" /home/lunchbox/android-sdk /opt/android-sdk; do
            if [ -n "$candidate" ] && [ -d "$candidate/platform-tools" ]; then
              resolved="$candidate"
              break
            fi
          done
          test -n "$resolved" || { echo 'Android SDK missing on runner' >&2; exit 1; }
          echo "ANDROID_HOME=$resolved" >> "$GITHUB_ENV"
          echo "$resolved/platform-tools" >> "$GITHUB_PATH"
      # `native_android` says android is one of this release's platforms, NOT
      # that a native build ran in THIS run. When the native component is
      # carried forward from an earlier release, the AAB artifact lives in
      # that older run and cannot be downloaded here. The binary under proof
      # therefore follows whether the native job actually ran and succeeded.
      - name: Download the native AAB under proof
        if: needs.mobile_native_android.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mobile-native-android-build-${{ needs.initialize.outputs.release_id }}
          path: ${{ runner.temp }}/proof-binary
      - name: Build the sideload APK under proof (no native build in this run)
        if: needs.mobile_native_android.outputs.built != 'true'
        working-directory: apps/mobile
        env:
          ANDROID_SIDELOAD_KEYSTORE_B64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_B64 }}
          ANDROID_SIDELOAD_KEY_ALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}
          ANDROID_SIDELOAD_STORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_STORE_PASSWORD }}
          ANDROID_SIDELOAD_KEY_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEY_PASSWORD }}
          # The emulator is a shared rig: the build's teardown must neither kill
          # it nor the adb server the proof itself is about to use.
          BEELINE_ANDROID_KEEP_DEVICE: '1'
        run: |
          set -euo pipefail
          bash ../../scripts/npm-ci-timed.sh
          # Metro resolves @beeline/* to their built dist/; build them like
          # the OTA leg's eas-build-post-install does.
          npm run eas-build-post-install
          bash scripts/android-build.sh
      - name: Run the emulator release proof
        id: proof
        env:
          ANDROID_SIDELOAD_KEYSTORE_B64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_B64 }}
          ANDROID_SIDELOAD_KEY_ALIAS: ${{ secrets.ANDROID_SIDELOAD_KEY_ALIAS }}
          ANDROID_SIDELOAD_STORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_STORE_PASSWORD }}
          ANDROID_SIDELOAD_KEY_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEY_PASSWORD }}
          # Lets the proof sign itself in via the /review bypass after the
          # install wipes the app, so it no longer needs a persisted GitHub session.
          BEELINE_REVIEW_SECRET: ${{ secrets.BEELINE_REVIEW_SECRET }}
        run: |
          set -euo pipefail
          if [ "${{ needs.mobile_native_android.outputs.built }}" = 'true' ]; then
            node apps/mobile/scripts/release-proof.mjs --aab "$RUNNER_TEMP/proof-binary/beeline.aab"
          else
            node apps/mobile/scripts/release-proof.mjs --apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          fi
      # Only demand evidence when the proof itself ran; a proof that never
      # started has nothing to preserve and must not fail twice for it.
      - name: Preserve release-proof evidence
        if: always() && steps.proof.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ needs.initialize.outputs.release_id }}
          path: apps/mobile/release-proof-out/
          if-no-files-found: error
          retention-days: 90


  # The OTA never waits for a store binary: production moves by channel
  # pointer, so rollback needs no embedded anchor. It waits only for an
  # explicitly requested device proof (mobile_ota_after_proof below).
  mobile_ota:
    needs: initialize
    if: >-
      needs.initialize.outputs.run_mobile_ota == 'true' && inputs.run_release_proof != true
    runs-on: [self-hosted, beeline-prod-host]
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
    # Export once per platform; every live runtime shares those exports.
    timeout-minutes: 18
    outputs:
      completed_at: ${{ steps.ota.outputs.completed_at }}
      ota_branch: ${{ steps.ota.outputs.ota_branch }}
      ota_targets: ${{ steps.ota.outputs.ota_targets }}
      store_runtime: ${{ steps.ota.outputs.store_runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: ./.github/actions/require-tools
        with:
          tools: git
      - uses: ./.github/actions/eas-cli
      - uses: ./.github/actions/mobile-ota-leg
        id: ota
        with:
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          ota_memory: ${{ needs.initialize.outputs.ota_memory }}

  mobile_ota_after_proof:
    needs: [initialize, release_proof]
    if: >-
      always() && needs.initialize.result == 'success' &&
      needs.initialize.outputs.run_mobile_ota == 'true' && inputs.run_release_proof == true
    runs-on: [self-hosted, beeline-prod-host]
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
    timeout-minutes: 18
    outputs:
      completed_at: ${{ steps.ota.outputs.completed_at }}
      ota_branch: ${{ steps.ota.outputs.ota_branch }}
      ota_targets: ${{ steps.ota.outputs.ota_targets }}
      store_runtime: ${{ steps.ota.outputs.store_runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # Nothing is published unless the requested proof passed.
      - name: Refuse promotion unless the release proof succeeded
        if: needs.release_proof.result != 'success'
        run: |
          echo "The emulator release proof did not succeed (result: ${{ needs.release_proof.result }})." >&2
          echo 'A proof that did not run is not a proof: OTA promotion is blocked.' >&2
          echo 'If the proof ran and failed, see the release-proof-<id> artifact for screenshots and logs.' >&2
          echo 'The proof was explicitly requested for this release, so promotion stays blocked.' >&2
          exit 1
      - uses: ./.github/actions/require-tools
        with:
          tools: git
      - uses: ./.github/actions/eas-cli
      - uses: ./.github/actions/mobile-ota-leg
        id: ota
        with:
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          ota_memory: ${{ needs.initialize.outputs.ota_memory }}

  desktop_installers:
    needs: initialize
    if: needs.initialize.outputs.run_desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      variant: production
      release_sha: ${{ needs.initialize.outputs.release_sha }}
      release_version: ${{ needs.initialize.outputs.release_version }}
      desktop_version: ${{ needs.initialize.outputs.desktop_version }}
    secrets: inherit

  website:
    needs: initialize
    if: needs.initialize.outputs.run_website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: usebeeline-pages-${{ needs.initialize.outputs.run_helper == 'true' && github.run_id || 'deploy' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Install once and build the shared packages Metro and the Pages build read
        run: |
          set -euo pipefail
          bash scripts/npm-ci-timed.sh
          npm run build -w @beeline/nostr && npm run build -w @beeline/api-contract && npm run build -w @beeline/buzz-client
      - uses: ./.github/actions/eas-cli
      - uses: ./.github/actions/pages-leg
        if: needs.initialize.outputs.run_helper != 'true'
        with:
          manifest_url: ${{ vars.BEELINE_PAGES_MANIFEST_URL || 'https://beeline-work.github.io/beeline/dl/manifest.json' }}
      - uses: ./.github/actions/web-app-leg
        with:
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          expo_token: ${{ secrets.EXPO_TOKEN }}
          release_sha: ${{ needs.initialize.outputs.release_sha }}
          release_version: ${{ needs.initialize.outputs.release_version }}

  mobile_native_android:
    needs: initialize
    if: >-
      needs.initialize.outputs.run_mobile_native == 'true' &&
      ((inputs.store_track != '' && inputs.store_track != 'none') ||
       (inputs.selection != '' && inputs.selection != 'auto')) &&
      needs.initialize.outputs.native_android == 'true'
    # Local EAS build on a self-hosted Linux runner (Android SDK + JDK 17 live
    # there): Expo's cloud build needs credits the free plan ran out of. The
    # keystore still comes from Expo's credential store via EXPO_TOKEN.
    # `beeline-android` is a POOL label: the production host and the Chad box both
    # carry it, so the job lands on whichever is online and free, and falls back
    # to the production host on its own when Chad is offline.
    runs-on: [self-hosted, beeline-android]
    timeout-minutes: 60
    outputs:
      version_code: ${{ steps.play-upload.outputs.version_code || needs.initialize.outputs.android_version_code }}
      built: ${{ steps.android_build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: ./.github/actions/require-tools
        with:
          tools: git java unzip sha256sum
      - uses: ./.github/actions/eas-cli
      - name: Require native release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN is required for a native release' >&2; exit 1; }
      - name: Apply the resolved native store version
        working-directory: apps/mobile
        env:
          NATIVE_APP_VERSION: ${{ needs.initialize.outputs.native_app_version }}
        run: |
          node scripts/check-release-version.cjs
          node -e 'const fs=require("node:fs");const p=require("./package.json");p.version=process.env.NATIVE_APP_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Report an Android build this release already shipped
        if: needs.initialize.outputs.android_shipped == 'true'
        run: echo "::notice::Android versionCode ${{ needs.initialize.outputs.android_version_code }} already shipped for ${{ needs.initialize.outputs.release_marker }}; no build or upload"
      - name: Build immutable Android store binary locally
        id: android_build
        if: needs.initialize.outputs.android_shipped != 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
        run: |
          set -euo pipefail
          # Each pooled runner keeps its SDK in a different place; take the runner's
          # own ANDROID_HOME when it is set, else the first known layout that exists.
          for candidate in "${ANDROID_HOME:-}" /home/lunchbox/android-sdk "$HOME/Android/Sdk" /opt/android-sdk; do
            if [ -n "$candidate" ] && [ -d "$candidate/platform-tools" ]; then export ANDROID_HOME="$candidate"; break; fi
          done
          test -d "${ANDROID_HOME:-}/platform-tools" || { echo "Android SDK missing on runner $(hostname)" >&2; exit 1; }
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME on $(hostname)"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash ../../scripts/npm-ci-timed.sh
          "$EAS_CLI_PATH" build --local --platform android --profile production-ci --non-interactive --output "$RUNNER_TEMP/beeline.aab"
          test -s "$RUNNER_TEMP/beeline.aab" || { echo 'local EAS build did not produce a non-empty aab' >&2; exit 1; }
          unzip -p "$RUNNER_TEMP/beeline.aab" BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map > "$RUNNER_TEMP/mapping.txt"
          test -s "$RUNNER_TEMP/mapping.txt" || { echo 'R8 mapping missing from AAB' >&2; exit 1; }
          sha256=$(sha256sum "$RUNNER_TEMP/beeline.aab" | awk '{print $1}')
          node - "$RUNNER_TEMP/android-build.json" "$RUNNER_TEMP/beeline.aab" "$sha256" <<'NODE'
          const fs = require('node:fs');
          const [output, path, sha256] = process.argv.slice(2);
          fs.writeFileSync(output, JSON.stringify({source:'local',status:'FINISHED',id:`local-${sha256}`,artifacts:{path},sha256})+'\n');
          NODE
      - name: Resolve the store-facing app version
        id: native_version
        working-directory: apps/mobile
        env:
          NATIVE_APP_VERSION: ${{ needs.initialize.outputs.native_app_version }}
        run: echo "version=$NATIVE_APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Hand the AAB to the release proof in this run
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-native-android-build-${{ needs.initialize.outputs.release_id }}
          # The release-proof lane installs the exact store binary (bundletool
          # re-signs it with the sideload key) instead of rebuilding an APK.
          path: |
            ${{ runner.temp }}/android-build.json
            ${{ runner.temp }}/beeline.aab
            ${{ runner.temp }}/mapping.txt
          if-no-files-found: error
          retention-days: 1
      - name: Authenticate to Google Play
        if: inputs.store_track != 'none'
        id: play-auth
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-token.mjs
      - name: Upload Android to the selected Play track
        id: play-upload
        if: inputs.store_track != 'none' && steps.android_build.outcome == 'success'
        env:
          MAPPING_ARCHIVE_DIR: ${{ runner.temp }}/android-mappings
          MAPPING_PATH: ${{ runner.temp }}/mapping.txt
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PUBLISH_LISTING: ${{ inputs.publish_listing && 'true' || 'false' }}
          PLAY_DEFER_COMMIT: '1'
          PLAY_LISTING_BASELINE: ${{ runner.temp }}/play-listing-before-build.json
          TRACK: ${{ inputs.store_track }}
          # scripts/play-api.sh refuses to run without the Play package name (release
          # run 34800657127 failed here after the first local Android build; the line
          # was then lost in #1241's conflict resolution and run 34873052609 failed the
          # same way). Same value as androidPackage in apps/mobile/app.config.js.
          PACKAGE_NAME: app.usebeeline
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/beeline.aab" || { echo 'no local aab to upload' >&2; exit 1; }
          # The release marker in the name lets a rerun find this build on Play.
          AAB_PATH="$RUNNER_TEMP/beeline.aab" RELEASE_NAME="${{ steps.native_version.outputs.version }} (${{ needs.initialize.outputs.release_marker }})" \
            RELEASE_STATUS=completed bash scripts/play-publish.sh
      - name: Enforce the Play listing lock before committing the build
        if: inputs.store_track != 'none' && steps.play-upload.outputs.edit_id != ''
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PACKAGE_NAME: app.usebeeline
          PLAY_EDIT_ID: ${{ steps.play-upload.outputs.edit_id }}
          PLAY_LISTING_BASELINE: ${{ runner.temp }}/play-listing-before-build.json
          PUBLISH_LISTING: ${{ inputs.publish_listing && 'true' || 'false' }}
        run: bash scripts/play-commit-build.sh
      - name: Publish the Play listing only when explicitly requested
        if: inputs.store_track != 'none' && inputs.publish_listing
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PACKAGE_NAME: app.usebeeline
          METADATA_DIR: apps/mobile/fastlane/metadata/android
          LANGUAGE: en-US
        run: bash scripts/play-publish-listing.sh
      - name: Check the Play listing without uploading
        if: ${{ inputs.store_track != 'none' && !inputs.publish_listing }}
        env:
          ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PACKAGE_NAME: app.usebeeline
          METADATA_DIR: apps/mobile/fastlane/metadata/android
          LANGUAGE: en-US
          PLAY_LISTING_CHECK_ONLY: '1'
        run: |
          status=0
          bash scripts/play-publish-listing.sh || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::warning::Could not compare the Play listing; listing was not uploaded"
          fi
      - name: Retain R8 mapping by Play version code
        if: always() && steps.play-upload.outputs.version_code != '' && steps.play-upload.outputs.already_shipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping-${{ steps.play-upload.outputs.version_code }}
          path: ${{ runner.temp }}/android-mappings/${{ steps.play-upload.outputs.version_code }}/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Remove Android build output
        if: always()
        run: rm -rf "$RUNNER_TEMP/beeline.aab" apps/mobile/android/app/build apps/mobile/android/build 2>/dev/null || true

  mobile_native_ios:
    needs: initialize
    if: >-
      needs.initialize.outputs.run_mobile_native == 'true' &&
      ((inputs.store_track != '' && inputs.store_track != 'none') ||
       (inputs.selection != '' && inputs.selection != 'auto')) &&
      needs.initialize.outputs.native_ios == 'true'
    runs-on: [self-hosted, macOS, X64, ios-builder]
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.ios_identity.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: ./.github/actions/eas-cli
      - name: Isolate the iOS signing keychain
        run: |
          set -euo pipefail
          security list-keychains -d user > "$RUNNER_TEMP/user-keychains.txt"
          security default-keychain -d user > "$RUNNER_TEMP/user-default-keychain.txt"
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db
      - name: Require iOS release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # Keep Apple's openrsync ahead of Homebrew rsync during Xcode IPA export.
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          for name in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_ASC_API_KEY_P8; do
            test -n "${!name}" || { echo "$name is required for an iOS store release" >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          printf '%s' "$EXPO_ASC_API_KEY_P8" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$EXPO_ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$EXPO_ASC_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=89KT3SWYAF"
            echo "EXPO_NO_CAPABILITY_SYNC=1"
            echo "EAS_SKIP_AUTO_FINGERPRINT=1"
            echo "EXPO_TOKEN=$EXPO_TOKEN"
          } >> "$GITHUB_ENV"
      - name: Apply the resolved native store version
        working-directory: apps/mobile
        env:
          NATIVE_APP_VERSION: ${{ needs.initialize.outputs.native_app_version }}
        run: |
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          node -e 'const fs=require("node:fs");const p=require("./package.json");p.version=process.env.NATIVE_APP_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Reuse the iOS build this release already shipped
        if: needs.initialize.outputs.ios_shipped == 'true'
        run: |
          set -euo pipefail
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          node scripts/store-shipped.mjs ios-evidence --marker "${{ needs.initialize.outputs.release_marker }}" --output "$RUNNER_TEMP/ios-build.json"
      - name: Build immutable iOS store binary locally
        if: needs.initialize.outputs.ios_shipped != 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Keep Apple's openrsync ahead of Homebrew rsync during Xcode IPA export.
          # The pinned eas-cli runs by its absolute path, never through npm exec,
          # which would prepend a global eas-cli's bin dir (/usr/local/bin) to PATH.
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          bash ../../scripts/npm-ci-timed.sh
          "$EAS_CLI_PATH" build --local --platform ios --profile production-ci --non-interactive --output "$RUNNER_TEMP/beeline-ios.ipa"
          test -s "$RUNNER_TEMP/beeline-ios.ipa" || { echo 'local EAS build did not produce a non-empty ipa' >&2; exit 1; }
          python3 ../../scripts/ios-build-evidence.py "$RUNNER_TEMP/beeline-ios.ipa" "$RUNNER_TEMP/ios-build.json"
          # verify writes this marker into the build's What to Test text.
          node -e 'const fs=require("node:fs");const p=process.argv[1];fs.writeFileSync(p,JSON.stringify({...JSON.parse(fs.readFileSync(p,"utf8")),releaseMarker:process.argv[2]})+"\n")' \
            "$RUNNER_TEMP/ios-build.json" "${{ needs.initialize.outputs.release_marker }}"
      - name: Submit iOS build to TestFlight for a selected store track
        if: inputs.store_track != 'none' && needs.initialize.outputs.ios_shipped != 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Keep Apple's openrsync ahead of Homebrew rsync during Xcode IPA export.
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          # Verify the actual IPA targets this App Store app and a new build
          # number before accepting Apple's transport receipt.
          node ../../scripts/ios-store-build.mjs prepare "$RUNNER_TEMP/ios-build.json"
          # Upload with Apple's own altool, not `eas submit`: EAS Submit is Expo's cloud
          # queue, and on this account its wait grew from 7 min to 54 min and then past
          # the job's 90-minute timeout (run 34863479172: build done in 19 min, then
          # "in queue" for 71 min). altool talks to App Store Connect directly with the
          # same API key; it finds the .p8 under ./private_keys of its working directory.
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$EXPO_ASC_API_KEY_PATH" "$RUNNER_TEMP/private_keys/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          (cd "$RUNNER_TEMP" && xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/beeline-ios.ipa" \
            --apiKey "$EXPO_ASC_KEY_ID" --apiIssuer "$EXPO_ASC_ISSUER_ID" --output-format json) | tee "$RUNNER_TEMP/ios-upload.json"
          # altool success only confirms transport. Processing can still fail
          # (90683 rejected build 87 after a successful upload). Require the
          # exact delivery to finish and a new VALID build in our App Store app.
          node ../../scripts/ios-store-build.mjs verify "$RUNNER_TEMP/ios-build.json" "$RUNNER_TEMP/ios-upload.json"
      - name: Send production iOS version to App Review
        if: inputs.store_track == 'production'
        run: |
          set -euo pipefail
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          node scripts/ios-store-build.mjs submit "$RUNNER_TEMP/ios-build.json"
      - name: Report the uploaded iOS build number to the release record
        id: ios_identity
        if: inputs.store_track != 'none'
        run: |
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin"
          export PATH
          echo "build_number=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).buildNumber' "$RUNNER_TEMP/ios-build.json")" >> "$GITHUB_OUTPUT"
      - name: Remove iOS credentials and build output
        if: always()
        # Also the local EAS build tree (under $TMPDIR, ~4 GB per attempt) and Xcode
        # DerivedData: a cancelled attempt leaves both behind, and five of them filled
        # the Mac runner's disk (run 34860249069: pod install "No space left on device").
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_${{ secrets.EXPO_ASC_KEY_ID }}.p8" "$RUNNER_TEMP/beeline-ios.ipa" "$RUNNER_TEMP/ios-upload.json"
          rm -rf "$RUNNER_TEMP/private_keys" "${TMPDIR:-/tmp}/eas-build-local-nodejs" ~/Library/Developer/Xcode/DerivedData
          df -h / | tail -1
      - name: Restore the runner user keychains
        if: always()
        run: |
          xargs security list-keychains -d user -s < "$RUNNER_TEMP/user-keychains.txt"
          xargs security default-keychain -d user -s < "$RUNNER_TEMP/user-default-keychain.txt"


  release_result:
    # !cancelled(), not always(): a run superseded by cancel-in-progress must not
    # classify itself as a failed attempt.
    if: "!cancelled() && needs.initialize.result == 'success'"
    needs: [initialize, server, helper_macos, helper, mobile_ota, mobile_ota_after_proof, mobile_native_android, mobile_native_ios, desktop_installers, website, release_proof]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      issues: write
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      failure_class: ${{ steps.result.outputs.failure_class }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record each component job's result and classify the attempt
        id: result
        env:
          TRIGGER_EPOCH: ${{ needs.initialize.outputs.trigger_epoch }}
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_STATE: ${{ needs.initialize.outputs.release_state }}
          PREVIOUS_RECORD: ${{ needs.initialize.outputs.previous_record }}
          NO_OP: ${{ needs.initialize.outputs.no_op }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          RELEASE_ID: ${{ needs.initialize.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/previous"
          state="$RUNNER_TEMP/release/release.json"
          printf '%s' "$RELEASE_STATE" > "$state"
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          if [ -n "${PREVIOUS_RECORD:-}" ]; then printf '%s' "$PREVIOUS_RECORD" > "$RUNNER_TEMP/previous/release.json"; fi
          node scripts/unified-release.mjs job-checkpoints --needs "$RUNNER_TEMP/needs.json" \
            --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --release-id "$RELEASE_ID" \
            --output "$RUNNER_TEMP/checkpoints.json"
          node scripts/unified-release.mjs apply-checkpoints --state "$state" --checkpoints "$RUNNER_TEMP/checkpoints.json" --summary "$RUNNER_TEMP/run-plan.json"
          facts=(apply-facts --state "$state" --needs "$RUNNER_TEMP/needs.json" --pins apps/mobile/native-fingerprint.json)
          if [ -f "$RUNNER_TEMP/previous/release.json" ]; then facts+=(--previous "$RUNNER_TEMP/previous/release.json"); fi
          node scripts/unified-release.mjs "${facts[@]}"
          incomplete=$(node -e 'const p=require(process.argv[1]);process.stdout.write(Object.entries(p.run).filter(([,v])=>v).map(([k])=>k).join(","))' "$RUNNER_TEMP/run-plan.json")
          now=$(date +%s)
          # A release that shipped every selected component is a success,
          # however long it took. Elapsed times are reported, never judged.
          node scripts/unified-release.mjs classify-attempt \
            --trigger-epoch "$TRIGGER_EPOCH" \
            --finished-epoch "$now" \
            --checkpoints "$RUNNER_TEMP/checkpoints.json" \
            --incomplete "$incomplete" \
            --output "$RUNNER_TEMP/release-classification.json"
          failure_class=$(node -e 'process.stdout.write(require(process.argv[1]).failureClass)' "$RUNNER_TEMP/release-classification.json")
          slow=$(node -e 'process.stdout.write(String(require(process.argv[1]).slow))' "$RUNNER_TEMP/release-classification.json")
          ota_elapsed=$(node -e 'process.stdout.write(String(require(process.argv[1]).otaElapsedSeconds))' "$RUNNER_TEMP/release-classification.json")
          whole_run_elapsed=$(node -e 'process.stdout.write(String(require(process.argv[1]).wholeRunElapsedSeconds))' "$RUNNER_TEMP/release-classification.json")
          soft_limit_seconds=$(node -e 'process.stdout.write(String(require(process.argv[1]).softLimitSeconds))' "$RUNNER_TEMP/release-classification.json")
          if [ -n "$failure_class" ]; then
            node scripts/unified-release.mjs finalize --state "$state" --outcome failure --failure-class "$failure_class"
            {
              echo "outcome=failure"
              echo "failure_class=$failure_class"
              echo "incomplete=$incomplete"
              echo "no_op=false"
              echo "slow=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "outcome=success"
              echo "failure_class="
              echo "incomplete="
              echo "no_op=$NO_OP"
              echo "slow=$slow"
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "ota_elapsed_seconds=$ota_elapsed"
            echo "whole_run_elapsed_seconds=$whole_run_elapsed"
            echo "soft_limit_seconds=$soft_limit_seconds"
          } >> "$GITHUB_OUTPUT"
      # Installers built by this run's desktop job (same-run build output).
      - name: Download newly built stable desktop installers
        if: steps.result.outputs.outcome == 'success' && needs.initialize.outputs.run_desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: beeline-desktop-release-${{ needs.initialize.outputs.release_version }}-${{ needs.initialize.outputs.release_sha }}-*
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Preserve the previous updater manifest for publication rollback
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DESKTOP: ${{ needs.initialize.outputs.run_desktop }}
        run: |
          state="$RUNNER_TEMP/release/release.json"
          # The last known-good desktop manifest is the one carried by the
          # release this one supersedes — unless desktop is carried forward,
          # in which case only the release that last BUILT desktop
          # (components.desktop.version) is guaranteed to have it.
          if [ "$RUN_DESKTOP" = true ]; then
            previous_version=$(node -e 'process.stdout.write(require(process.argv[1]).supersedes?.version ?? "")' "$state")
          else
            previous_version=$(node -e 'process.stdout.write(require(process.argv[1]).components.desktop.version)' "$state")
          fi
          if [ -n "$previous_version" ]; then
            mkdir -p "$RUNNER_TEMP/desktop-rollback"
            gh release download "$previous_version" --pattern 'Beeline-latest.json' --dir "$RUNNER_TEMP/desktop-rollback"
          fi
      - name: Build the signed desktop update manifest
        if: steps.result.outputs.outcome == 'success' && needs.initialize.outputs.run_desktop == 'true'
        env:
          DESKTOP_VERSION: ${{ needs.initialize.outputs.desktop_version }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-manifest"
          node scripts/desktop-update.mjs manifest \
            --directory "$RUNNER_TEMP/desktop-release" \
            --version "$DESKTOP_VERSION" \
            --tag "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/desktop-manifest/Beeline-latest.json"
      - name: Finalize the release record
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        env:
          RELEASE_PROOF_UNPROVEN: ${{ needs.initialize.outputs.run_mobile_ota == 'true' && inputs.run_release_proof != true }}
        run: |
          state="$RUNNER_TEMP/release/release.json"
          args=(--state "$state" --outcome success)
          if [ "$RELEASE_PROOF_UNPROVEN" = true ]; then
            args+=(--unproven "mobile OTA promoted without a device proof; proof is opt-in and was not requested")
          fi
          node scripts/unified-release.mjs finalize "${args[@]}"
          node -e 'const fs=require("node:fs");const p=process.argv[1];const r=JSON.parse(fs.readFileSync(p,"utf8"));r.runId=Number(process.env.GITHUB_RUN_ID);fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n")' "$state"
      - name: Publish the one GitHub release record with its release.json and stable desktop downloads
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          RUN_DESKTOP: ${{ needs.initialize.outputs.run_desktop }}
          RELEASE_PROOF_UNPROVEN: ${{ needs.initialize.outputs.run_mobile_ota == 'true' && inputs.run_release_proof != true }}
        run: |
          set -euo pipefail
          # Every release-mutating gh call below goes through bounded-retry,
          # asset-verified wrappers (run 35268976983: a transient GitHub-side
          # HTTP 500 on `gh release upload` failed an otherwise finished
          # release).
          . scripts/gh-release-retry.sh
          state="$RUNNER_TEMP/release/release.json"
          mkdir -p "$RUNNER_TEMP/desktop-release"
          # A carried desktop re-attaches the installers of the release that
          # built them; every release therefore holds the current installers.
          if [ "$RUN_DESKTOP" != true ]; then
            previous_version=$(node -e 'process.stdout.write(require(process.argv[1]).components.desktop.version)' "$state")
            gh release download "$previous_version" --pattern 'Beeline-*' --dir "$RUNNER_TEMP/desktop-release"
            if [ ! -f "$RUNNER_TEMP/desktop-rollback/Beeline-latest.json" ] && [ -f "$RUNNER_TEMP/desktop-release/Beeline-latest.json" ]; then
              mkdir -p "$RUNNER_TEMP/desktop-rollback"
              cp "$RUNNER_TEMP/desktop-release/Beeline-latest.json" "$RUNNER_TEMP/desktop-rollback/Beeline-latest.json"
            fi
          fi
          previous_sha=$(node -e 'process.stdout.write(require(process.argv[1]).supersedes?.sourceSha ?? "")' "$state")
          notes="$RUNNER_TEMP/release-notes.md"
          git log --pretty='- %s (%h)' "${previous_sha:+${previous_sha}..}${RELEASE_SHA}" > "$notes"
          [ -s "$notes" ] || echo '- No component changes required.' > "$notes"
          if [ "$RELEASE_PROOF_UNPROVEN" = true ]; then
            echo '- Promoted without a device proof: proof is opt-in and was not requested for this release (release recorded UNPROVEN).' >> "$notes"
          fi
          if [ "$RUN_DESKTOP" = true ]; then
            manifest="$RUNNER_TEMP/desktop-manifest/Beeline-latest.json"
          else
            manifest="$RUNNER_TEMP/desktop-rollback/Beeline-latest.json"
          fi
          test -f "$manifest" || { echo 'desktop updater manifest is missing' >&2; exit 1; }
          mapfile -t assets < <(find "$RUNNER_TEMP/desktop-release" -maxdepth 1 -type f -name 'Beeline-*' ! -name 'Beeline-latest.json' | sort)
          previous="$RUNNER_TEMP/desktop-rollback/Beeline-latest.json"
          # initialize reserved this identity as a draft; create it only if
          # that draft is gone.
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            ghr_create "$RELEASE_VERSION" --target "$RELEASE_SHA" --title "$RELEASE_VERSION" --notes 'Release in progress.' --draft
          fi
          [ ! -f "$previous" ] || ghr_upload_verified "$RELEASE_VERSION" "$previous"
          [ "${#assets[@]}" -eq 0 ] || ghr_upload_verified "$RELEASE_VERSION" "${assets[@]}"
          # The memory the next release and every rollback read. Written
          # before publication, so a published release always carries it.
          ghr_upload_verified "$RELEASE_VERSION" "$state"
          rollback_manifest() {
            if [ -f "$previous" ]; then
              ghr_upload_verified "$RELEASE_VERSION" "$previous#Beeline-latest.json" || true
            else
              ghr_delete_asset "$RELEASE_VERSION" 'Beeline-latest.json' || true
            fi
          }
          manifest_committed=false
          rollback_on_exit() {
            status=$?
            if [ "$manifest_committed" != true ]; then rollback_manifest; fi
            return "$status"
          }
          trap rollback_on_exit EXIT
          # The manifest is the commit point: every URL and signature it names
          # is already present before clients can discover this version.
          ghr_upload_verified "$RELEASE_VERSION" "$manifest"
          ghr_publish "$RELEASE_VERSION" "$notes"
          manifest_url='https://github.com/Beeline-Work/beeline/releases/latest/download/Beeline-latest.json'
          verified=false
          for _ in {1..12}; do
            if node scripts/desktop-update.mjs verify --url "$manifest_url" --expected "$manifest"; then
              verified=true
              break
            fi
            sleep 5
          done
          [ "$verified" = true ] || { echo 'desktop updater manifest did not converge' >&2; exit 1; }
          manifest_committed=true
          trap - EXIT
      - name: Remove drafts this release supersedes
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
        run: |
          for draft in $(node scripts/release-record.mjs stale-drafts --version "$RELEASE_VERSION"); do
            echo "Deleting abandoned draft $draft"
            gh release delete "$draft" --yes || true
          done
      - name: Set explicitly requested store minimums after successful delivery
        if: steps.result.outputs.outcome == 'success' && inputs.mobile_store_minimum != ''
        env:
          MOBILE_STORE_MINIMUM: ${{ inputs.mobile_store_minimum }}
          BEELINE_RELEASE_NOTIFY_SECRET: ${{ secrets.BEELINE_RELEASE_NOTIFY_SECRET }}
        run: node scripts/mobile-store-minimum.mjs
      - name: Notify clients without changing the authoritative release outcome
        id: notification
        if: steps.result.outputs.outcome == 'success' && steps.result.outputs.no_op != 'true'
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.initialize.outputs.release_version }}
          RELEASE_SHA: ${{ needs.initialize.outputs.release_sha }}
          BEELINE_RELEASE_NOTIFY_SECRET: ${{ secrets.BEELINE_RELEASE_NOTIFY_SECRET }}
        run: >-
          node scripts/unified-release.mjs notify
          --version "$RELEASE_VERSION"
          --sha "$RELEASE_SHA"
          --repository "$GITHUB_REPOSITORY"
          --output "$RUNNER_TEMP/release-notification.json"
      - name: Surface release outcome and duration
        env:
          OUTCOME: ${{ steps.result.outputs.outcome }}
          NO_OP: ${{ steps.result.outputs.no_op }}
          FAILURE_CLASS: ${{ steps.result.outputs.failure_class }}
          SLOW: ${{ steps.result.outputs.slow }}
          OTA_ELAPSED_SECONDS: ${{ steps.result.outputs.ota_elapsed_seconds }}
          WHOLE_RUN_ELAPSED_SECONDS: ${{ steps.result.outputs.whole_run_elapsed_seconds }}
          SOFT_LIMIT_SECONDS: ${{ steps.result.outputs.soft_limit_seconds }}
          RUN_DESKTOP: ${{ needs.initialize.outputs.run_desktop }}
          MACOS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          MACOS_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          MACOS_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          NOTIFICATION_STATE: ${{ (steps.result.outputs.no_op == 'true' && 'not-needed') || steps.notification.outputs.state || (steps.notification.outcome == 'failure' && 'warning') || 'not-attempted' }}
          NOTIFICATION_DETAIL: ${{ (steps.result.outputs.no_op == 'true' && 'no component inputs changed') || steps.notification.outputs.detail || (steps.notification.outcome == 'failure' && 'notification step failed unexpectedly') || 'release result was not successful' }}
        run: |
          node - "$RUNNER_TEMP/release/release.json" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.argv[2]));
          console.log(`## Release ${release.delivery.state}: ${release.version}`);
          if (release.delivery.durationSeconds !== undefined) console.log(`- Duration: ${release.delivery.durationSeconds}s`);
          console.log(`- Fix to phone: ${process.env.OTA_ELAPSED_SECONDS}s`);
          if (process.env.SLOW === 'true') console.log(`- Slow: whole run reached ${process.env.WHOLE_RUN_ELAPSED_SECONDS}s (soft limit ${process.env.SOFT_LIMIT_SECONDS}s); release record still published.`);
          console.log(`- Selected: ${release.plan.selected.join(', ') || 'none'}`);
          console.log(`- Carried: ${release.plan.carried.join(', ') || 'none'}`);
          const ota = release.components['mobile-ota'];
          if (ota?.otaBranch) console.log(`- Phone OTA: production -> ${ota.otaBranch} (${(ota.otaTargets ?? []).join(', ') || 'targets carried'}); rollback -> ${ota.previousOtaBranch ?? 'none recorded'}`);
          if (release.components.server?.imageRef) console.log(`- Server: ${release.components.server.imageRef}; rollback -> ${release.components.server.previousImageRef ?? 'none recorded'}`);
          const signingSecrets = [
            'MACOS_APPLE_CERTIFICATE',
            'MACOS_APPLE_CERTIFICATE_PASSWORD',
            'MACOS_APPLE_SIGNING_IDENTITY',
            'MACOS_ASC_KEY_ID',
            'MACOS_ASC_ISSUER_ID',
            'MACOS_ASC_API_KEY_P8',
          ];
          if (process.env.RUN_DESKTOP === 'true' && signingSecrets.some((name) => !process.env[name]?.trim())) {
            console.log('- macOS artifact UNSIGNED: signing secrets absent');
          }
          if (process.env.NO_OP === 'true') console.log('- No-op: this exact release was already delivered; nothing was republished.');
          console.log(`- Notification: ${process.env.NOTIFICATION_STATE} (${process.env.NOTIFICATION_DETAIL})`);
          if (release.delivery.failureClass) console.log(`- Failure class: ${release.delivery.failureClass}`);
          NODE
      - name: Fail the attempt after reporting it
        if: steps.result.outputs.outcome != 'success'
        run: |
          echo "Release failed (${{ steps.result.outputs.failure_class }}): ${{ steps.result.outputs.incomplete }}" >&2
          echo 'Rerun the release: the same commit resumes its draft identity and every leg skips what already shipped.' >&2
          exit 1
