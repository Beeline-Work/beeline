# Build the Android App Bundle on EAS and publish it to a Google Play testing
# track. Manual only: `gh workflow run play-beta.yml -f track=internal`.
#
# Signing: the AAB is built with EAS-managed credentials (the `production`
# build profile), so it carries the EAS upload key and Google Play App Signing
# owns the app signing key. The committed apps/mobile/android-signing keystore
# is the sideload key and is never used for Play.
#
# Publishing goes through the Play Developer API with a short-lived access
# token minted from the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret
# (scripts/play-publish.sh: edit → upload bundle → tracks.update → commit).
# The listing itself is a separate workflow (play-listing.yml); moving a
# release between tracks is play-promote.yml.
#
# Inputs:
#   track          — internal | alpha | beta (Play API names; "beta" is Play
#                    Console's Open testing, "alpha" its Closed testing)
#   release_status — draft (default): uploaded, nothing sent to testers until
#                    you press Release in Play Console;
#                    completed: released to everyone on the track at once.
name: Play beta release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta]
        default: internal
        required: true
      release_status:
        description: 'draft = ready to publish in Play Console; completed = released to the track now'
        type: choice
        options: [draft, completed]
        default: draft
        required: true

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: app.usebeeline.mobile
  EAS_CLI_VERSION: 22.2.0
  BUNDLETOOL_VERSION: 1.18.1

jobs:
  release:
    name: Build on EAS and publish to Play ${{ inputs.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the release secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repository secret is not set; add the Play service account JSON key before running this workflow."
            exit 1
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is not set; add an Expo access token before running this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Version check
        id: version
        working-directory: apps/mobile
        run: |
          version=$(node scripts/check-release-version.cjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing app version $version"

      - name: Play metadata is derived from the store package
        run: node scripts/sync-play-metadata.mjs --check

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build the AAB on EAS
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "eas-cli@$EAS_CLI_VERSION" build --profile production --platform android \
            --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"
          build=$(jq -c 'if type == "array" then .[0] else . end' "$RUNNER_TEMP/eas-build.json")
          status=$(echo "$build" | jq -r '.status')
          if [ "$status" != "FINISHED" ]; then
            echo "EAS build ended with status $status"
            echo "$build" | jq '.'
            exit 1
          fi
          {
            echo "id=$(echo "$build" | jq -r '.id')"
            echo "app_version=$(echo "$build" | jq -r '.appVersion')"
            echo "version_code=$(echo "$build" | jq -r '.appBuildVersion')"
            echo "archive_url=$(echo "$build" | jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl')"
          } >> "$GITHUB_OUTPUT"
          echo "EAS build $(echo "$build" | jq -r '.id') finished: $(echo "$build" | jq -r '.appVersion') ($(echo "$build" | jq -r '.appBuildVersion'))"

      - name: Download the AAB
        env:
          ARCHIVE_URL: ${{ steps.build.outputs.archive_url }}
        run: |
          set -euo pipefail
          if [ -z "$ARCHIVE_URL" ] || [ "$ARCHIVE_URL" = "null" ]; then
            echo "EAS build has no application archive URL"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/beeline.aab" "$ARCHIVE_URL"
          ls -l "$RUNNER_TEMP/beeline.aab"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the AAB version and signer with bundletool
        env:
          EXPECTED_NAME: ${{ steps.version.outputs.version }}
          EXPECTED_CODE: ${{ steps.build.outputs.version_code }}
        run: |
          set -euo pipefail
          aab="$RUNNER_TEMP/beeline.aab"
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$bundletool" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          aab_name=$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionName)
          aab_code=$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)
          aab_package=$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@package)
          echo "Expected: $EXPECTED_NAME ($EXPECTED_CODE) $PACKAGE_NAME"
          echo "AAB:      $aab_name ($aab_code) $aab_package"
          if [ "$aab_name" != "$EXPECTED_NAME" ] || [ "$aab_code" != "$EXPECTED_CODE" ] || [ "$aab_package" != "$PACKAGE_NAME" ]; then
            echo "The AAB does not carry the expected package, versionName and versionCode."
            exit 1
          fi
          certs=$(keytool -printcert -jarfile "$aab")
          echo "$certs" | grep -E '^Owner:' || true
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "The AAB is debug-signed."
            exit 1
          fi

      - name: Upload the AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeline-${{ steps.version.outputs.version }}-${{ steps.build.outputs.version_code }}.aab
          path: ${{ runner.temp }}/beeline.aab
          if-no-files-found: error

      # Self-signed JWT flow: google-github-actions/auth exchanges the key through
      # the IAM Service Account Credentials API, which is not enabled in the
      # Beeline project. The Android Developer API accepts a token minted from the
      # key alone (scripts/play-token.mjs); the token is masked, never printed.
      - name: Authenticate to Google Play with the service account
        id: gcp-auth
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-token.mjs

      - name: Publish to the Play ${{ inputs.track }} track
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          AAB_PATH: ${{ runner.temp }}/beeline.aab
          TRACK: ${{ inputs.track }}
          RELEASE_NAME: ${{ steps.version.outputs.version }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: bash scripts/play-publish.sh

      - name: Release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          {
            echo "## Play ${TRACK}: ${VERSION} (${VERSION_CODE}) — ${RELEASE_STATUS}"
            echo ""
            echo "- Play Console: https://play.google.com/console/u/0/developers/-/app-list?search=${PACKAGE_NAME}"
            echo "- EAS build id: ${BUILD_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
