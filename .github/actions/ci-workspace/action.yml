name: Reuse CI workspace
description: Restore dependencies by lockfile and workspace builds by exact commit
inputs:
  prepared:
    description: Require prepared dependencies; recover missing exact-commit builds locally
    default: 'false'
  mobile:
    description: Install the isolated mobile dependency tree
    default: 'false'
runs:
  using: composite
  steps:
    # Both the CI producer and its consumers serialize archive operations.
    - if: startsWith(runner.name, 'beeline-ci-squire-')
      shell: bash
      run: echo "$GITHUB_ACTION_PATH/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/cache@v4
      id: root
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          !apps/mobile/node_modules
        key: ci-root-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', '.npmrc') }}
    - if: steps.root.outputs.cache-hit != 'true'
      shell: bash
      env:
        CI_PREPARED: ${{ inputs.prepared }}
      run: |
        if [ "$CI_PREPARED" = true ]; then
          echo "::error::Missing prepared root dependencies cache; refusing a cold install/build on a consumer."
          exit 1
        fi
        npm ci --no-audit --no-fund
    - uses: actions/cache/restore@v4
      id: builds
      with:
        path: |
          packages/*/dist/**
          apps/*/dist/**
          .beeline-ci-build.json
        key: ci-build-v3-${{ runner.os }}-node22-${{ github.sha }}
    # Task caches are input-addressed; final dist archives remain exact-SHA.
    # Warm test-only consumers need no task archive; cache misses still recover.
    # Job-specific writes let TYPECHECK publish its completed task cache after
    # preparation has already published the build task cache for the same head.
    - uses: actions/cache@v4
      if: steps.builds.outputs.cache-hit != 'true' || contains(fromJSON('["typecheck","dead-code","mac-helper-acceptance"]'), github.job)
      with:
        path: .turbo/cache
        key: ci-turbo-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ci-turbo-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.job }}-
          ci-turbo-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'turbo.json') }}-
    - uses: actions/cache@v4
      if: inputs.mobile == 'true' && github.job == 'typecheck'
      with:
        path: apps/mobile/tsconfig.tsbuildinfo
        key: ci-ts-state-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/tsconfig.json') }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ci-ts-state-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/tsconfig.json') }}-${{ github.job }}-
          ci-ts-state-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/tsconfig.json') }}-
    - if: steps.builds.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # The cache can disappear after preparation, including before a failed
        # job is rerun. Rebuild this checkout instead of requiring its survival.
        npm run build -- --concurrency=1
    - name: Record exact-head compiled output provenance
      if: steps.builds.outputs.cache-hit != 'true'
      shell: bash
      env:
        CI_BUILD_SHA: ${{ github.sha }}
      run: node scripts/ci-build-provenance.mjs write "$CI_BUILD_SHA"
    - name: Verify exact-head compiled output provenance
      shell: bash
      env:
        CI_BUILD_SHA: ${{ github.sha }}
      run: node scripts/ci-build-provenance.mjs verify "$CI_BUILD_SHA"
    - name: Verify compiled API exports
      id: verify-builds
      shell: bash
      run: |
        node --input-type=module <<'JS'
        import { readFileSync, existsSync } from 'node:fs';
        import { resolve } from 'node:path';
        const directory = resolve('packages/api-contract');
        const manifest = JSON.parse(readFileSync(resolve(directory, 'package.json'), 'utf8'));
        function verify(value) {
          if (typeof value === 'string' && value.startsWith('./dist/') && !value.includes('*')) {
            if (!existsSync(resolve(directory, value))) throw new Error(`Missing compiled API export: ${value}`);
          } else if (value && typeof value === 'object') {
            for (const entry of Object.values(value)) verify(entry);
          }
        }
        verify(manifest.exports);
        JS
    # Publish the verified snapshot before any tests can modify build outputs.
    - uses: actions/cache/save@v4
      if: steps.builds.outputs.cache-hit != 'true'
      with:
        path: |
          packages/*/dist/**
          apps/*/dist/**
          .beeline-ci-build.json
        key: ${{ steps.builds.outputs.cache-primary-key }}
    - uses: actions/cache@v4
      if: inputs.mobile == 'true'
      id: mobile
      with:
        path: |
          apps/mobile/node_modules
          apps/mobile/public/canvaskit.wasm
        key: ci-mobile-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'apps/mobile/package-lock.json', 'apps/mobile/package.json', 'apps/mobile/patches/**', 'apps/mobile/scripts/patch-livekit-abort.cjs') }}
    - if: inputs.mobile == 'true' && steps.mobile.outputs.cache-hit != 'true'
      shell: bash
      env:
        CI_PREPARED: ${{ inputs.prepared }}
      run: |
        if [ "$CI_PREPARED" = true ]; then
          echo "::error::Missing prepared mobile dependencies cache; refusing a cold install/build on a consumer."
          exit 1
        fi
        npm ci --prefix apps/mobile --no-audit --no-fund
