name: buzzy-gate

# Isolated Buzz relay stack for the Phase-0 merge-gate proof.
# Uses the prebuilt ghcr.io/block/buzz:main image (no Rust compile).
# Open relay (REQUIRE_RELAY_MEMBERSHIP=false) so freshly generated keys can
# create groups and push over git without an out-of-band membership grant.
# Only the relay-front HTTP port is published, on 127.0.0.1 only. It serves
# invite/app-association routes and proxies every other request to Buzz.

services:
  auth:
    build:
      context: ..
      dockerfile: apps/auth/Dockerfile
    image: ${BUZZY_AUTH_IMAGE:-beeline-auth:local}
    env_file:
      - ${BUZZY_AUTH_ENV_FILE:-/home/lunchbox/buzzy-auth/oidc.env}
    environment:
      NODE_ENV: production
      PORT: '8789'
      BUZZY_AUTH_HOST: 0.0.0.0
      BUZZY_SNAPSHOT_INTERNAL_TOKEN: ${BUZZY_SNAPSHOT_INTERNAL_TOKEN:-gate-snapshot-internal}
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      # Both hosts intentionally share the original identity namespace so
      # existing links remain visible after the hostname migration. The Room
      # allowlist uses server-stamped channels.community_id values instead.
      BUZZY_AUTH_TENANTS_JSON: >-
        [{"host":"usebeeline.app","community":"relay.buzzrouter.com","roomCommunityIds":["3a47eeff-fdff-4a1e-9eb9-b48cb4ed90ed","e8299f28-f095-472f-941a-80d1195b9a24"],"origin":"https://usebeeline.app"},{"host":"relay.buzzrouter.com","community":"relay.buzzrouter.com","roomCommunityIds":["3a47eeff-fdff-4a1e-9eb9-b48cb4ed90ed","e8299f28-f095-472f-941a-80d1195b9a24"],"origin":"https://relay.buzzrouter.com"}]
      BUZZY_AUTH_OIDC_ISSUER: https://accounts.google.com
      BUZZY_AUTH_OIDC_AUTHORIZATION_ENDPOINT: https://accounts.google.com/o/oauth2/v2/auth
      BUZZY_AUTH_OIDC_TOKEN_ENDPOINT: https://oauth2.googleapis.com/token
      BUZZY_AUTH_OIDC_JWKS_URI: https://www.googleapis.com/oauth2/v3/certs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8789/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzzy-net

  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    env_file:
      - .env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: '8080'
      BUZZ_METRICS_PORT: '9102'
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: 'true'
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: 'false'
      BUZZ_REQUIRE_AUTH_TOKEN: 'false'
      BUZZ_ALLOW_NIP_OA_AUTH: 'true'
      BUZZ_GIT_CONFORMANCE_PROBE: 'false'
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info
    volumes:
      - buzzy-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    networks:
      - buzzy-net

  push-gateway:
    build:
      context: ..
      dockerfile: apps/push-gateway/Dockerfile
    image: ${BUZZY_PUSH_IMAGE:-beeline-push-gateway:local}
    environment:
      NODE_ENV: production
      PORT: '8788'
      BUZZY_PUSH_HOST: 0.0.0.0
      BUZZY_PUSH_DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      BUZZY_PUSH_SA_FILE: /run/secrets/buzzy-fcm-service-account.json
      BUZZY_PUSH_REGISTRY_FILE: /var/lib/buzzy-push/registrations.json
      BUZZY_PUSH_DELIVERY_STATE_FILE: /var/lib/buzzy-push/deliveries.json
      BUZZY_SNAPSHOT_PUBLIC_ORIGIN: ${BUZZY_SNAPSHOT_PUBLIC_ORIGIN:-https://usebeeline.app}
      BUZZY_SNAPSHOT_AUTH_BASE_URL: http://auth:8789
      BUZZY_SNAPSHOT_INTERNAL_TOKEN: ${BUZZY_SNAPSHOT_INTERNAL_TOKEN:-gate-snapshot-internal}
    volumes:
      - ${BUZZY_PUSH_SA_HOST_FILE:-/home/lunchbox/buzzy-push-gateway/secrets/fcm-service-account.json}:/run/secrets/buzzy-fcm-service-account.json:ro
      - ${BUZZY_PUSH_STATE_DIR:-/home/lunchbox/buzzy-push-gateway/state}:/var/lib/buzzy-push
    depends_on:
      auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8788/snapshot/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzzy-net

  relay-front:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${BUZZ_HTTP_PORT:-3010}:3000'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      auth:
        condition: service_healthy
      push-gateway:
        condition: service_healthy
      relay:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzzy-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzzy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzzy-net

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - buzzy-redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzzy-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes:
      - buzzy-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzzy-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '
    restart: 'no'
    networks:
      - buzzy-net

volumes:
  buzzy-postgres-data:
  buzzy-redis-data:
  buzzy-minio-data:
  buzzy-git-data:

networks:
  buzzy-net:
    driver: bridge
