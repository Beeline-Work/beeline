name: iOS sign-in capture
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: App ref to reproduce (capture harness comes from workflow ref)
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: ios-signin-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: [self-hosted, macOS, X64, ios-builder]
    env:
      CI: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BUZZY_MONOLITH_URL: https://server.usebeeline.app
    steps:
      - name: Set isolated evidence directory
        run: |
          evidence="$RUNNER_TEMP/ios-signin-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          sw_vers > "$evidence/runner.txt"
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select user-installed Ruby
        run: |
          for ruby_bin in /usr/local/opt/ruby/bin /usr/local/opt/ruby@3.3/bin /opt/homebrew/opt/ruby/bin; do
            if [[ -x "$ruby_bin/ruby" ]]; then
              export PATH="$ruby_bin:$PATH"
              break
            fi
          done
          if ! ruby -e 'exit(Gem::Version.new(RUBY_VERSION) >= Gem::Version.new("3.1") ? 0 : 1)'; then
            if [[ -x /usr/local/bin/brew ]]; then
              brew_bin=/usr/local/bin/brew
            elif command -v brew; then
              brew_bin=$(command -v brew)
            else
              echo 'Missing required tool: Homebrew (needed to install user-space Ruby)' >&2
              exit 127
            fi
            HOMEBREW_NO_AUTO_UPDATE=1 "$brew_bin" install ruby@3.3
            ruby_bin="$($brew_bin --prefix ruby@3.3)/bin"
            export PATH="$ruby_bin:$PATH"
          fi
          command -v ruby
          ruby --version
          ruby -rrbconfig -e 'puts RbConfig::CONFIG["bindir"]' >> "$GITHUB_PATH"
      - name: Use the runner account's home for user tools
        run: |
          runner_home=$(ruby -retc -e 'puts Etc.getpwuid.dir')
          {
            echo "RUNNER_ACCOUNT_HOME=$runner_home"
            echo "CP_HOME_DIR=$runner_home/.cocoapods"
            echo "GEM_SPEC_CACHE=$runner_home/.gem/specs"
            echo "CFFIXED_USER_HOME=$runner_home"
            echo "GRADLE_USER_HOME=$runner_home/.gradle"
            echo "MAESTRO_CLI_HOME=$runner_home/.maestro"
            echo "JAVA_TOOL_OPTIONS=-Duser.home=\"$runner_home\""
            echo "npm_config_cache=$runner_home/.npm"
          } >> "$GITHUB_ENV"
      - name: Install CocoaPods without changing runner gems
        run: |
          mkdir -p "$EVIDENCE"
          export GEM_HOME="$RUNNER_TEMP/ios-signin-gems-${{ github.run_id }}"
          export GEM_PATH="$GEM_HOME"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          gem install cocoapods --version 1.16.2 --no-document
          "$GEM_HOME/bin/pod" --version
      - name: Record provenance and install mobile dependencies
        working-directory: source/apps/mobile
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
          xcodebuild -version > "$EVIDENCE/xcode.txt"
          xcrun simctl list -j > "$EVIDENCE/simulators.json"
          npm ci --no-audit --no-fund --prefer-offline > "$EVIDENCE/npm-install.log" 2>&1
          npm run eas-build-post-install > "$EVIDENCE/workspace-build.log" 2>&1
      - name: Install pinned Maestro distribution (no remote install script)
        env:
          MAESTRO_VERSION: 2.0.10
        run: |
          curl --fail --location "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" -o "$RUNNER_TEMP/maestro-signin.zip"
          echo "dbdcfbe2b673e1a6f40c65664f1ed5becad0b0a40e35d0e203dff511d05032f6  $RUNNER_TEMP/maestro-signin.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/maestro-signin.zip" -d "$RUNNER_TEMP/maestro-signin"
          echo "$RUNNER_TEMP/maestro-signin/maestro/bin" >> "$GITHUB_PATH"
      - name: Build ad hoc signed Simulator app and capture both providers
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          HARNESS_DIR: ${{ github.workspace }}/harness
        run: bash harness/scripts/ios-signin/capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-signin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this run's build and tool output
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ios-signin-gems-${{ github.run_id }}" "$RUNNER_TEMP/ios-signin-dd-${{ github.run_id }}-${{ github.run_attempt }}" "$RUNNER_TEMP/maestro-signin" "$RUNNER_TEMP/maestro-signin.zip"
